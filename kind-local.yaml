kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: zeta-local
kubeadmConfigPatches:
  # Pull images of a fresh cluster in parallel instead of one after another (kubelet default).
  - |
    kind: KubeletConfiguration
    serializeImagePulls: false
    maxParallelImagePulls: 4
nodes:
  - role: control-plane
    extraPortMappings:
      # Map host ports 80/443 to the ingress controller nodePorts (32080/32443)
      - containerPort: 32080
        hostPort: 80
        protocol: TCP
      - containerPort: 32443
        hostPort: 443
        protocol: TCP
      - containerPort: 32097
        hostPort: 9999
        protocol: TCP
      - containerPort: 32098
        hostPort: 9200
        protocol: TCP
      - containerPort: 32090
        hostPort: 9090
        protocol: TCP
      - containerPort: 32086
        hostPort: 16686
        protocol: TCP
      - containerPort: 32010
        hostPort: 9010
        protocol: TCP
      - containerPort: 32011
        hostPort: 9011
        protocol: TCP
      - containerPort: 32012
        hostPort: 9012
        protocol: TCP
      - containerPort: 32013
        hostPort: 9013
        protocol: TCP

  # Worker deliberately commented out, not deleted: single-node saves ~2 kubelet/containerd
  # stacks plus per-node image pulls (KIND drops the control-plane taint on one-node clusters,
  # so scheduling still works). Uncomment when testing multi-node behaviour (affinity, drain,
  # tolerations) — topology only applies on cluster creation: make kind-down && make kind-up.
  # - role: worker
  # - role: worker
