{{- define "testfachdienst.otelResourceAttributes" -}}
{{- $attributes := list -}}
{{- range $key, $value := . -}}
{{- $attributes = append $attributes (printf "%s=%v" $key $value) -}}
{{- end -}}
{{- join "," $attributes -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testfachdienst
  labels:
    component: testfachdienst
spec:
  replicas: 1
  selector:
    matchLabels:
      app: testfachdienst
  template:
    metadata:
      {{- if .Values.devMode }}
      annotations:
        zeta.dev/rollout-timestamp: "{{ now | unixEpoch }}"
      {{- end }}
      labels:
        app: testfachdienst
        component: testfachdienst
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets | default .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.mtls.enabled }}
        - name: testfachdienst-keystore
          secret:
            secretName: {{ required "testfachdienst.mtls.keyStore.secretName is required when mtls.enabled=true" .Values.mtls.keyStore.secretName | quote }}
            items:
              - key: {{ .Values.mtls.keyStore.key | quote }}
                path: keystore.p12
        - name: testfachdienst-truststore
          secret:
            secretName: {{ required "testfachdienst.mtls.trustStore.secretName is required when mtls.enabled=true" .Values.mtls.trustStore.secretName | quote }}
            items:
              - key: {{ .Values.mtls.trustStore.key | quote }}
                path: truststore.p12
        {{- end }}
      containers:
        - name: testfachdienst
          image: "{{ default (printf "%s%s" .Values.global.registry_host .Values.registry_name) .Values.image.registry }}{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: "{{ .Values.imagePullPolicy }}"
          env:
            - name: MANAGEMENT_SERVER_PORT
              value: {{ .Values.managementPort | quote }}
          {{- if .Values.mtls.enabled }}
            - name: SPRING_PROFILES_INCLUDE
              value: {{ .Values.mtls.springProfile | quote }}
            - name: TLS_KEYSTORE
              value: {{ .Values.mtls.keyStore.mountPath | quote }}
            - name: TLS_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "testfachdienst.mtls.keyStore.passwordSecretName is required when mtls.enabled=true" .Values.mtls.keyStore.passwordSecretName | quote }}
                  key: {{ .Values.mtls.keyStore.passwordSecretKey | quote }}
            - name: TLS_KEYSTORE_TYPE
              value: {{ .Values.mtls.keyStore.type | quote }}
            - name: TLS_KEY_ALIAS
              value: {{ .Values.mtls.keyStore.alias | quote }}
            - name: TLS_TRUSTSTORE
              value: {{ .Values.mtls.trustStore.mountPath | quote }}
            - name: TLS_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "testfachdienst.mtls.trustStore.passwordSecretName is required when mtls.enabled=true" .Values.mtls.trustStore.passwordSecretName | quote }}
                  key: {{ .Values.mtls.trustStore.passwordSecretKey | quote }}
            - name: TLS_TRUSTSTORE_TYPE
              value: {{ .Values.mtls.trustStore.type | quote }}
            - name: TLS_CLIENT_AUTH
              value: {{ .Values.mtls.clientAuth | quote }}
            - name: MANAGEMENT_SERVER_SSL_CLIENT_AUTH
              value: {{ .Values.mtls.managementClientAuth | quote }}
            - name: MANAGEMENT_TLS_KEYSTORE
              value: {{ .Values.mtls.keyStore.mountPath | quote }}
            - name: MANAGEMENT_TLS_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "testfachdienst.mtls.keyStore.passwordSecretName is required when mtls.enabled=true" .Values.mtls.keyStore.passwordSecretName | quote }}
                  key: {{ .Values.mtls.keyStore.passwordSecretKey | quote }}
            - name: MANAGEMENT_TLS_KEYSTORE_TYPE
              value: {{ .Values.mtls.keyStore.type | quote }}
            - name: MANAGEMENT_TLS_KEY_ALIAS
              value: {{ .Values.mtls.keyStore.alias | quote }}
          {{- end }}
            - name: OTEL_SDK_DISABLED
              value: {{ .Values.opentelemetry.enabled | ternary "false" "true" | quote }}
          {{- if .Values.opentelemetry.enabled }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.opentelemetry.serviceName | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.opentelemetry.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.opentelemetry.protocol | quote }}
            - name: MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED
              value: "true"
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
              value: {{ printf "%s/v1/traces" .Values.opentelemetry.endpoint | quote }}
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_TRANSPORT
              value: "http"
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED
              value: "true"
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_URL
              value: {{ printf "%s/v1/metrics" .Values.opentelemetry.endpoint | quote }}
            - name: MANAGEMENT_OTLP_METRICS_EXPORT_STEP
              value: {{ .Values.opentelemetry.metricExportInterval | quote }}
            - name: MANAGEMENT_LOGGING_EXPORT_OTLP_ENABLED
              value: "true"
            - name: MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT
              value: {{ printf "%s/v1/logs" .Values.opentelemetry.endpoint | quote }}
            - name: MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_TRANSPORT
              value: "http"
            {{- with .Values.opentelemetry.resourceAttributes }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ include "testfachdienst.otelResourceAttributes" . | quote }}
            {{- end }}
          {{- end }}
          {{- with .Values.env }}
          {{- range . }}
            - name: {{ .name | quote }}
            {{- if hasKey . "valueFrom" }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
            {{- else }}
              value: {{ .value | quote }}
            {{- end }}
          {{- end }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.containerPort }}
              name: app
            - containerPort: {{ .Values.managementPort }}
              name: management
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.mtls.enabled }}
            - name: testfachdienst-keystore
              mountPath: {{ .Values.mtls.keyStore.mountPath | quote }}
              subPath: keystore.p12
              readOnly: true
            - name: testfachdienst-truststore
              mountPath: {{ .Values.mtls.trustStore.mountPath | quote }}
              subPath: truststore.p12
              readOnly: true
            {{- end }}
