apiVersion: v1
kind: Service
metadata:
  name: sekidp-fedmaster
  labels:
    {{- include "sekidp-fedmaster.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "sekidp-fedmaster.selectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.fedmaster.service.apiPort }}
      targetPort: api
    - name: management
      port: {{ .Values.fedmaster.service.managementPort }}
      targetPort: management
  type: ClusterIP
