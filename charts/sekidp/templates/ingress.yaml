{{- /* vim: set ft=helm: */ -}}
{{- /* NIC mergeable minion for sekidp — mirrors charts/testdriver's ingress pattern */ -}}
---
{{- if .Values.ingressEnabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sekidp
  labels:
    app: sekidp
    app.kubernetes.io/name: sekidp
  annotations:
    {{- if .Values.nginxIngressEnabled }}
    nginx.org/mergeable-ingress-type: "minion"
    {{- if not .Values.routeViaTigerProxy }}
    # Direct routing: gsi-server and gsi-fedmaster serve at "/", so the
    # /sekidp and /sekidp-fedmaster prefixes must be stripped here (the
    # tiger-proxy route does that itself). Capture group 2 is the remainder.
    nginx.org/path-regex: "case_insensitive"
    nginx.org/rewrite-target: "/$2"
    {{- end }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  {{- if .Values.openshiftIngress.enabled }}
  tls:
    - hosts:
        - {{ .Values.hostname | quote }}
      secretName: {{ .Values.openshiftIngress.certName }}
  {{- end }}
  rules:
    # do not set host when working with local-cluster
    - {{- if .Values.hostname }}
      host: {{ .Values.hostname | quote }}
      {{- end }}
      http:
        paths:
          {{- if .Values.routeViaTigerProxy }}
          - path: /sekidp
            pathType: Prefix
            backend:
              service:
                name: tiger-proxy
                port:
                  number: 80
          - path: /sekidp-fedmaster
            pathType: Prefix
            backend:
              service:
                name: tiger-proxy
                port:
                  number: 80
          {{- else }}
          - path: /sekidp(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: sekidp-gsi-server
                port:
                  name: api
          - path: /sekidp-fedmaster(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: sekidp-fedmaster
                port:
                  name: api
          {{- end }}
{{- end }}
