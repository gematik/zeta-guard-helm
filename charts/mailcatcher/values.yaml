global:
  imagePullSecrets: []

# Third-party image pulled directly — does NOT consult global.registry_host/name.
# Verify it resolves (or mirror/build your own) and point image.* at what you trust.
image:
  repository: dockage/mailcatcher
  tag: "0.9.0"
  # When set, fully overrides the repository above (full prefix, trailing slash).
  registry: ""
  # Optional digest (e.g. "sha256:...") appended as @<digest>, in addition to tag.
  digest: ""
imagePullPolicy: IfNotPresent
imagePullSecrets: []

# Retain only the newest messages to keep the test mail store bounded.
messagesLimit: 1000

# Service ports only — the container listens on fixed ports 1025 (SMTP)
# and 1080 (web UI).
service:
  smtpPort: 1025
  httpPort: 1080

# Web UI prefix, passed to mailcatcher's `--http-path`. Its HTML emits assets
# relative to this, so it must match the reverse-proxy route's `from`
# (e.g. tiger-proxy's /mailcatcher) or assets 404. Leave empty ("") for direct access.
httpPath: ""

# Expose the web UI/API (port 1080) directly through the cluster Ingress as a
# NIC "mergeable minion" sharing zeta-guard's ingress-master host/TLS — for
# stages without tiger-proxy. Requires httpPath (the Ingress routes that prefix
# unchanged). Keep false when a tiger-proxy proxyRoutes entry serves /mailcatcher,
# both would claim the same path. Mind the no-authentication warning in
# docs/how-to_guides/How_to_configure_mailcatcher.md.
ingressEnabled: false

# Must match zeta-guard.authserver.hostname for this minion to merge onto the
# shared NIC master. Leave empty for host-less local-cluster setups.
hostname: ""

ingressClassName: "nginx"

# Use NIC ("nginx.org/...") mergeable-ingress annotations. Set false (with
# openshiftIngress.enabled: true) for OpenShift Routes instead.
nginxIngressEnabled: true

# Use OpenShift's Route-backed ingress controller with TLS instead of NIC.
openshiftIngress:
  enabled: false
  certName: ""

# When enabled, injects a changing annotation to force pod rollouts
# on each helm upgrade/apply even if image tag is unchanged.
devMode: false

serviceAccount:
  create: true
  name: mailcatcher

resources: {}

podDisruptionBudget:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: 1

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext: {}
#  allowPrivilegeEscalation: false
#  readOnlyRootFilesystem: true
#  runAsNonRoot: true
#  capabilities:
