apiVersion: v1
kind: Service
metadata:
  name: push-gateway-postgres
  labels:
    {{- include "push-gateway-postgres.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "push-gateway-postgres.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  type: ClusterIP
