{{- if .Values.firebaseCredentials.mount }}
apiVersion: v1
kind: Secret
metadata:
  name: push-gateway-firebase
  labels:
    {{- include "push-gateway.labels" . | nindent 4 }}
type: Opaque
data:
  sa.json: {{ required "firebaseCredentials.serviceAccountJson is empty: pass the Firebase service account JSON (make: FIREBASE_SA_JSON)" .Values.firebaseCredentials.serviceAccountJson | b64enc }}
{{- end }}
