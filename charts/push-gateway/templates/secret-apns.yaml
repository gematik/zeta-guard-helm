{{- if .Values.apnsCredentials.mount }}
apiVersion: v1
kind: Secret
metadata:
  name: push-gateway-apns
  labels:
    {{- include "push-gateway.labels" . | nindent 4 }}
type: Opaque
data:
  apns.p8: {{ required "apnsCredentials.authKeyP8 is empty: pass the APNs .p8 file (make: APNS_P8)" .Values.apnsCredentials.authKeyP8 | b64enc }}
{{- end }}
