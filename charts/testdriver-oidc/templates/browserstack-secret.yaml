apiVersion: v1
kind: Secret
metadata:
  name: testdriver-oidc-browserstack
type: Opaque
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "testdriver-oidc-browserstack").data | default dict }}
data:
  username: {{ .Values.browserstack.user | default (index $existing "username" | default "" | b64dec) | b64enc | quote }}
  accessKey: {{ .Values.browserstack.key | default (index $existing "accessKey" | default "" | b64dec) | b64enc | quote }}
