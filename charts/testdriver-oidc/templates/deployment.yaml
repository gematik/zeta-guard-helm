{{- $authMode := "OIDC" -}}
{{- if not (has $authMode (list "SMB" "OIDC")) -}}
  {{- fail "testdriver.authMode must be either SMB or OIDC" -}}
{{- end -}}
{{- if eq $authMode "OIDC" -}}
  {{- $_ := required "testdriver-oidc.oidcIdpIss is required when authMode is OIDC" .Values.oidcIdpIss -}}
  {{- $_ := required "testdriver-oidc.oidcIdpAlias is required when authMode is OIDC" .Values.oidcIdpAlias -}}
  {{- $_ := required "testdriver-oidc.oidcBaseUri is required when authMode is OIDC" .Values.oidcBaseUri -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testdriver-oidc
  labels:
    component: testdriver-oidc
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: testdriver-oidc
  template:
    metadata:
      labels:
        app: testdriver-oidc
        component: testdriver-oidc
      {{- if .Values.devMode }}
      annotations:
        zeta.dev/rollout-timestamp: "{{ now | unixEpoch }}"
      {{- end }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets | default .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if .Values.global.enableDNSRedirect }}
      {{- template "global.tigerDNSRedirect" . }}
    {{- end }}
      containers:
        - name: testdriver-oidc
          image: "{{ default (printf "%s%s" .Values.global.registry_host .Values.registry_name) .Values.image.registry }}{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: "{{ .Values.imagePullPolicy }}"
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 10
          ports:
            - containerPort: {{ .Values.containerPort }}
              name: http
          env:
            - name: FACHDIENST_URL
              value: {{ .Values.fachdienst_url }}
            - name: DISABLE_SERVER_VALIDATION
              value: {{ quote .Values.disableServerValidation }}
            - name: ASL_PROD
              value: {{ quote .Values.aslProdEnv }}
            - name: POPP_TOKEN
              value: {{ .Values.PoppToken | quote }}
            - name: REQUIRED_ROLE_OID
              value: {{ .Values.requiredOid }}
            - name: AUTH_MODE
              value: {{ $authMode | quote }}
            - name: OIDC_IDP_ISS
              value: {{ .Values.oidcIdpIss | quote }}
            - name: OIDC_IDP_ALIAS
              value: {{ .Values.oidcIdpAlias | quote }}
            - name: OIDC_BASE_URI
              value: {{ .Values.oidcBaseUri | quote }}
            - name: OIDC_TEST_KVNR
              value: {{ .Values.oidcTestKvnr | quote }}
            {{- with .Values.oidcBindingEmail }}
            - name: OIDC_BINDING_EMAIL
              value: {{ . | quote }}
            {{- end }}
            - name: BS_HUB_URL
              value: {{ .Values.browserstack.hubUrl | quote }}
            - name: BS_ANDROID_APP_URL
              value: {{ .Values.browserstack.androidApp | quote }}
            - name: BS_IOS_APP_URL
              value: {{ .Values.browserstack.iosApp | quote }}
            - name: MAILCATCHER_URL
              value: {{ .Values.mailcatcherUrl | quote }}
            - name: BS_USER
              valueFrom:
                secretKeyRef:
                  name: testdriver-oidc-browserstack
                  key: username
            - name: BS_KEY
              valueFrom:
                secretKeyRef:
                  name: testdriver-oidc-browserstack
                  key: accessKey
            - name: CUCUMBER_PUBLISH_ENABLED
              value: "false"
            - name: CUCUMBER_PUBLISH_QUIET
              value: "true"
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi

