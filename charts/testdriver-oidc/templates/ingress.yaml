{{- /* vim: set ft=helm: */ -}}
---
{{- if .Values.ingressEnabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: testdriver-oidc
  labels:
    app: testdriver-oidc
    app.kubernetes.io/name: testdriver-oidc
  annotations:
    {{- if .Values.nginxIngressEnabled }}
    nginx.org/mergeable-ingress-type: "minion"
    nginx.org/websocket-services: {{ if .Values.routeViaTigerProxy }}"tiger-proxy,testdriver-oidc"{{ else }}"testdriver-oidc"{{ end }}
    nginx.org/client-max-body-size: "10m"
    # Preserve case-insensitive matching and all three URI capture groups.
    nginx.org/path-regex: "case_insensitive"
    nginx.org/rewrite-target: "/$1$2$3"
  
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  {{- if .Values.openshiftIngress.enabled }}
  tls:
    - hosts:
        - {{ .Values.hostname | quote }}
      secretName: {{ .Values.openshiftIngress.certName }}
  {{- end }}
  rules:
    # do not set host when working with local-cluster
    - {{- if .Values.hostname }}
      host: {{ .Values.hostname | quote }}
      {{- end }}
      http:
        paths:
          - path: {{ if .Values.routeViaTigerProxy }}/(td-oidc/proxy)(/|$)(.*){{ else }}/td-oidc/(proxy)(/|$)(.*){{ end }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ if .Values.routeViaTigerProxy }}tiger-proxy{{ else }}testdriver-oidc{{ end }}
                port:
                  number: 80
          - path: /td-oidc/(testdriver-api)(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: testdriver-oidc
                port:
                  number: 80
          - path: /td-oidc/(oidc)(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: testdriver-oidc
                port:
                  number: 80
          - path: /td-oidc/(load)(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: testdriver-oidc
                port:
                  number: 80
          - path: /td-oidc/(loaddriver-api)(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: testdriver-oidc
                port:
                  number: 80
{{- end }}
