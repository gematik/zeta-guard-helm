global:
  imagePullSecrets: []
  registry: europe-west3-docker.pkg.dev/gematik-pt-zeta-prod/zeta-dcr/
  registry_host: "europe-west3-docker.pkg.dev/gematik-pt-zeta-prod/zeta-dcr/"

registry_name: ""

image:
  repository: testdriver-image
  tag: 2.0.6
imagePullPolicy: Always

replicaCount: 1

containerPort: 8080

fachdienst_url: ""

# Token used by the test-driver to call POPP-protected endpoints
PoppToken: ""

# When enabled, injects a changing annotation to force pod rollouts
# on each helm upgrade/apply even if image tag is unchanged.
devMode: false

# When true, the ingress routes traffic to the tiger-proxy service
# instead of directly exposing internal services.
routeViaTigerProxy: false

# Toggle ingress deployment
ingressEnabled: true

# Ingress settings (used when deploying a NIC minion Ingress for the test-driver)
ingressClassName: "nginx"

# Use nginx ingress controller for ingress
nginxIngressEnabled: true

# Use OpenShift ingress controller with tls; created routes will use https
openshiftIngress:
  enabled: false
  certName: ""

# Issuer URL of the SekIDP the client authenticates against (OIDC `idp_iss` param)
oidcIdpIss: ""

# Alias of the SekIDP identity provider broker in Keycloak (used to build the broker callback URL)
oidcIdpAlias: "zeta-sekidp-oidc"

# Base URI the OIDC client's redirect_uri/oidc_redirect_uri are derived from.
# Must match the localhost:8090/cb/demo/oidc entry in sekidp.gsiServer.entityStatementAboutRp's redirect_uris.
oidcBaseUri: "http://localhost:8090/cb/demo"

# Test KVNR used to auto-fill the SekIDP login form in headless test runs
oidcTestKvnr: "X110411675"

# E-mail for the e-mail binding step after OIDC login (binding_mode=collect_email)
oidcBindingEmail: "X110411675@mailgun.com"

# BrowserStack App Automate configuration for the device e2e tests
# (e.g. GET /testdriver-api/hellozeta/android). Exposed to the testdriver
# as BS_* environment variables.
browserstack:
  # Appium/WebDriver hub endpoint used to open device sessions (BS_HUB_URL).
  hubUrl: https://hub-cloud.browserstack.com/wd/hub
  # Android app under test (BS_ANDROID_APP_URL): either a custom_id set at
  # upload time (resolves to the latest upload with that id) or a bs://<hash>.
  androidApp: ZetaClientAndroid
  # iOS app under test (BS_IOS_APP_URL), same format as androidApp.
  iosApp: ZetaClientIOS
  # BrowserStack credentials, stored in the testdriver-oidc-browserstack Secret
  # (BS_USER / BS_KEY). Do not set here; injected by the Makefile from the
  # GitLab CI variables BS_USER and BS_KEY. If left empty, the values of an
  # existing Secret are kept; without one the device tests fail with
  # "Missing environment variable"; everything else is unaffected.
  user: ""
  key: ""

# Mailcatcher base URL used to read the OTP verification mails during the
# device login flow (MAILCATCHER_URL), e.g. https://<host>/mailcatcher.
# Set per stage.
mailcatcherUrl: ""

serviceAccount:
  create: true
  name: testdriver-oidc

resources: {}
# resources:
#   limits:
#     cpu: "2"
#     memory: "1Gi"
#   requests:
#     cpu: "500m"
#     memory: "512Mi"

podDisruptionBudget:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: 1

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext: {}
