global:
  imagePullSecrets: []
  registry: europe-west3-docker.pkg.dev/gematik-pt-zeta-prod/zeta-dcr/
  registry_host: "europe-west3-docker.pkg.dev/gematik-pt-zeta-prod/zeta-dcr/"

registry_name: ""

image:
  repository: android-testdriver-image
  tag: 2.0.6
imagePullPolicy: Always

containerPort: 8080

# Match the health endpoint served by the selected driver image.
readinessPath: /androiddriver-api/health

# Optional entrypoint override, for example to set a process limit before
# exec'ing the image's entrypoint. An empty list uses the image's default.
command: []

# Start in writable storage instead of the image's /home/androidusr, which
# may not be accessible when Kubernetes overrides the image's user ID.
workingDir: /tmp

# Direct KVM passthrough for local emulator testing. The node must already
# have this character device. Enable explicitly alongside a privileged
# containerSecurityContext and the device's GID in podSecurityContext.supplementalGroups.
# This configuration requires a namespace that permits privileged pods/hostPath.
kvm:
  enabled: false
  hostPath: /dev/kvm

fachdienst_url: ""

# Token used by the test-driver to call POPP-protected endpoints
PoppToken: ""

# When enabled, injects a changing annotation to force pod rollouts
# on each helm upgrade/apply even if image tag is unchanged.
devMode: false

# When true, the ingress routes traffic to the tiger-proxy service
# instead of directly exposing internal services.
routeViaTigerProxy: false

# Toggle ingress deployment
ingressEnabled: true

# Ingress settings (used when deploying a NIC minion Ingress for the test-driver)
ingressClassName: "nginx"

# Issuer URL of the SekIDP the client authenticates against (OIDC `idp_iss` param)
oidcIdpIss: ""

# Alias of the SekIDP identity provider broker in Keycloak (used to build the broker callback URL)
oidcIdpAlias: "zeta-sekidp-oidc"

# Base URI the OIDC client's redirect_uri/oidc_redirect_uri are derived from.
# Must match the localhost:8090/cb/demo/oidc entry in sekidp.gsiServer.entityStatementAboutRp's redirect_uris.
oidcBaseUri: "http://localhost:8090/cb/demo"

# Test KVNR used to auto-fill the SekIDP login form in headless test runs
oidcTestKvnr: "X110411675"

# E-mail for the e-mail binding step after OIDC login (binding_mode=collect_email)
oidcBindingEmail: "X110411675@mailgun.com"

# notifications push gateway
pushGatewayUrl: ""

# app_id sent at pusher registration- must match push-gateway receivingAppIds. Empty = firebase.projectId
pusherAppId: ""

# Firebase for push notifications. The values come from the project's google-services.json
firebase:
  appId: ""      # mobilesdk_app_id
  apiKey: ""     # api_key[0].current_key (NOT a secret)
  projectId: ""  # project_id
  senderId: ""   # project_number

resources: {}
# resources:
#   limits:
#     cpu: "2"
#     memory: "1Gi"
#   requests:
#     cpu: "500m"
#     memory: "512Mi"

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext: {}
#  allowPrivilegeEscalation: false
#  readOnlyRootFilesystem: true
#  runAsNonRoot: true
#  capabilities:
#    drop: [ "ALL" ]
