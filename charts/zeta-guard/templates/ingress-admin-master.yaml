{{- /* vim: set ft=helm: */ -}}
{{- /* Separate TLS-terminating ingress for the Keycloak admin hostname.
     /auth on this hostname routes directly to authserver (no PEP, no admin block),
     so everything the public hostname denies lives here: the admin REST API for
     Terraform and CI/CD runners, the Admin Console, and the master realm that
     issues their access token. With F5 NIC this resource carries only TLS and the
     global annotations — the path routing comes from the zeta-guard-admin-auth
     minion (ingress-admin.yaml); without NIC the rule below provides it.

     This hostname is protected by nothing but TLS. The split moves the admin
     surface off the public hostname, it does not close it: IP-based access
     restriction must be configured at the infrastructure layer (e.g. Cloud Armor,
     NetworkPolicy, firewall rules), and Keycloak's brute-force detection ships
     disabled on the master realm. */ -}}
{{- if and .Values.ingressEnabled .Values.authserver.adminHostname }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zeta-guard-admin
  labels:
    {{- include "ingress.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.nginxIngressEnabled }}
    nginx.org/mergeable-ingress-type: "master"
    {{- end }}
    {{- /* TLS secret is issued by the explicit Certificate in certificate.yaml,
         not via ingress-shim annotations */ -}}
    {{- if not .Values.nginxIngressEnabled }}
    nginx.org/ssl-redirect: "true"
    {{- end }}
    {{- if .Values.nginxIngressEnabled }}
    nginx.org/hsts: "true"
    nginx.org/hsts-max-age: "31536000"
    nginx.org/hsts-include-subdomains: "true"
    {{- end }}
    {{- with .Values.ingressMasterAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  tls:
    - hosts:
        - {{ .Values.authserver.adminHostname | quote }}
      secretName: {{ .Values.authserver.adminTlsSecretName | default "zeta-guard-admin-tls" | quote }}
  rules:
    - host: {{ .Values.authserver.adminHostname | quote }}
      {{- if not .Values.nginxIngressEnabled }}
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: authserver
                port:
                  {{- if or .Values.authserver.hsm.tls.enabled .Values.authserver.tls.enabled }}
                  name: https
                  {{- else }}
                  name: http
                  {{- end }}
      {{- end }}
{{- end }}
