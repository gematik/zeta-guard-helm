{{- if .Values.opa.rolloutRestart.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: opa-rollout-restart-cronjob
  labels:
    {{- include "opa.labels" . | nindent 4 }}
spec:
  timeZone: "Europe/Berlin"
  schedule: {{ .Values.opa.rolloutRestart.schedule | quote }}
  # never overlap, never crawl for hours (a memory-starved kubectl saturates the node's OS disk)
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: {{ .Values.opa.rolloutRestart.backoffLimit | default 5 }}
      template:
        metadata:
          labels:
            {{- include "opa.labels" . | nindent 12 }}
            {{- with .Values.opa.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if $.Values.devMode }}
          annotations:
            zeta.dev/rollout-timestamp: "{{ now | unixEpoch }}"
          {{- end }}
        spec:
          {{- with .Values.provisioningProcessor.imagePullSecrets | default .Values.global.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "zeta-guard.podSecurityContext" (dict "root" $ "sc" dict) | nindent 10 }}
          serviceAccountName: {{ .Values.opa.rolloutRestart.serviceAccountName | default "opa-rollout-restart" }}
          restartPolicy: OnFailure
          containers:
            - name: opa-rollout-restart
              image: "{{ include "provisioningProcessor.image" . | trim }}"
              imagePullPolicy: "{{ .Values.provisioningProcessor.imagePullPolicy | default "IfNotPresent" }}"
              {{- include "zeta-guard.containerSecurityContext" (dict "root" $ "sc" .Values.provisioningProcessor.containerSecurityContext) | nindent 14 }}
              {{- with .Values.opa.rolloutRestart.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  kubectl --request-timeout=60s rollout restart deployment/opa -n {{ .Release.Namespace }}
                  {{- if .Values.opa.simulation.enabled }}
                  && kubectl --request-timeout=60s rollout restart deployment/opa-simulation -n {{ .Release.Namespace }}
                  {{- end }}
{{- end }}
