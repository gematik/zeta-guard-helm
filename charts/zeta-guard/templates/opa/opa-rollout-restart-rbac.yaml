{{- if and .Values.opa.rolloutRestart.enabled (not .Values.opa.rolloutRestart.serviceAccountName) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opa-rollout-restarter
  labels:
    {{- include "opa.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
    resourceNames:
      - opa
      {{- if .Values.opa.simulation.enabled }}
      - opa-simulation
      {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opa-rollout-restart-binding
  labels:
    {{- include "opa.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: opa-rollout-restart
roleRef:
  kind: Role
  name: opa-rollout-restarter
  apiGroup: rbac.authorization.k8s.io
{{- end }}
