{{- $sekidpMtls := .Values.authserver.sekidp.mtls -}}
{{- $sekidpMtlsOn := $sekidpMtls.keystore.secretName -}}
{{- if and $sekidpMtlsOn (not .Values.authserver.config.oidcFlowEnabled) -}}
{{- fail "authserver.sekidp.mtls requires authserver.config.oidcFlowEnabled: true (the SE-KIDP mTLS keystore is ignored otherwise)" -}}
{{- end -}}
{{- $rsMtls := .Values.authserver.resourceServerMtls -}}
{{- /* Consistency of resourceServerMtls (oidcFlowEnabled, secretKey with secretName) is checked by values.schema.json. */ -}}
{{- $rsTruststore := and $rsMtls.enabled $rsMtls.truststore.secretName -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authserver
  labels:
    {{- include "authserver.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.authserver.replicaCount }}
  selector:
    matchLabels:
      {{- include "authserver.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "authserver.labels" . | nindent 8 }}
        {{- with .Values.authserver.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if .Values.authserver.podAnnotations | or .Values.devMode }}
      annotations:
        {{- with .Values.authserver.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.devMode }}
        zeta.dev/rollout-timestamp: "{{ now | unixEpoch }}"
        {{- end }}
      {{- end }}
    spec:
      {{- if and .Values.authserver.serviceAccount .Values.authserver.serviceAccount.create }}
      serviceAccountName: {{ .Values.authserver.serviceAccount.name }}
      automountServiceAccountToken: false
      {{- end }}
      {{- include "zeta-guard.podSecurityContext" (dict "root" $ "sc" .Values.authserver.podSecurityContext) | nindent 6 }}
      {{- with .Values.authserver.imagePullSecrets | default .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.authserver.hostAlias .Values.global.enableDNSRedirect }}
      hostAliases:
        {{- with .Values.authserver.hostAlias }}
        - ip: {{ .ip | quote }}
          hostnames:
            - {{ .name | quote }}
        {{- end }}
        {{- if .Values.global.enableDNSRedirect }}
          {{- template "global.tigerDNSRedirectEntryOnly" . }}
        {{- end }}
      {{- end }}
      initContainers:
        {{- if .Values.authserver.dbEnc.enabled }}
        {{- with .Values.authserver.dbEnc.initContainerProvideKeys }}
        - {{ tpl (toYaml .) $ | nindent 10 }}
        {{- end}}
        - name: keychain-generator
          image: "{{ include "keychainGenerator.image" . | trim }}"
          imagePullPolicy: "{{ .Values.authserver.dbEnc.keychainGenerator.imagePullPolicy }}"
          env:
          {{- with .Values.authserver.dbEnc.keychainFileName }}
            - name: SPREE_KEYCHAIN_FILE
              value: {{ . | quote }}
          {{- end }}
          {{- if .Values.authserver.hsm.enabled }}
            - name: HSM_PROXY_ENDPOINT
              value: {{ .Values.authserver.hsm.endpoint | quote }}
          {{- with .Values.authserver.hsm.dbEnc.keyId }}
            - name: HSM_PROXY_KEK_ID
              value: {{ . | quote }}
          {{- end }}
          {{- end }}
          {{- with .Values.authserver.dbEnc.keychainGenerator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "zeta-guard.containerSecurityContext" (dict "root" $ "sc" .Values.authserver.dbEnc.keychainGenerator.containerSecurityContext) | nindent 10 }}
          volumeMounts:
            {{- with .Values.authserver.dbEnc.keychainGenerator.extraVolumeMounts }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
        {{- with .Values.authserver.dbEnc.initContainerStoreKeys }}
        - {{ tpl (toYaml .) $ | nindent 10 }}
        {{- end}}
        {{- end}}
        # Needed because the main container runs with readOnlyRootFilesystem and mounts an emptyDir over
        # /opt/keycloak, where startup.sh, kc.sh build and Keycloak itself write: this seeds that volume
        # with the image's /opt/keycloak. No kc.sh build here, startup.sh builds in the main container.
        - name: keycloak-copy
          image: "{{ include "authserver.image" . | trim }}"
          imagePullPolicy: "{{ .Values.authserver.imagePullPolicy }}"
          command:
            - /bin/sh
            - -c
          args:
            - cp -r /opt/keycloak/. /work/
          volumeMounts:
            - name: keycloak-home
              mountPath: /work
          {{- include "zeta-guard.containerSecurityContext" (dict "root" $ "sc" .Values.authserver.initContainer.containerSecurityContext) | nindent 10 }}
          {{- with .Values.authserver.initContainer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: trust-anchor-provisioning-processor
          image: "{{ include "provisioningProcessor.image" . | trim }}"
          imagePullPolicy: "{{ .Values.provisioningProcessor.imagePullPolicy }}"
          {{- if .Values.provisioningProcessor.schedule.enabled }}
          # Native sidecar (needs Kubernetes >= 1.29; the chart's declared minimum is 1.32): the processor stays
          # resident and repeats its run daily instead of exiting after the first pass, so Keycloak's truststores
          # are refreshed without restarting the pod.
          restartPolicy: Always
          startupProbe:
            # A sidecar only has to *start* before Keycloak does, not finish its first run — unlike a plain init
            # container, which has to exit successfully. This probe restores that barrier: without it Keycloak could
            # boot while /var/trust-data is still empty and fail on the missing truststores.
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  test -f /var/trust-data/smcb-trust-roots.p12 &&
                  test -f /var/trust-data/smcb-trust-roots-meta.json &&
                  test -f /var/trust-data/apple-trust-roots.p12 &&
                  test -f /var/trust-data/google-trust-roots.p12 &&
                  test -f /var/trust-data/google-certificate-status.json &&
                  test -f /var/trust-data/tpm-trust-roots.p12
                  {{- if .Values.provisioningProcessor.tslOcspEnabled }} &&
                  test -f /var/trust-data/ocsp-signers.p12 &&
                  test -f /var/trust-data/ocsp-signers-meta.json
                  {{- end }}
                  {{- if .Values.provisioningProcessor.federationMaster.enabled }} &&
                  test -f /var/trust-data/federation-master.json
                  {{- end }}
            periodSeconds: 5
            # Generous: the first pass pulls a signed OCI image and verifies its cosign signature.
            failureThreshold: 120
          {{- end }}
          {{- include "zeta-guard.containerSecurityContext" (dict "root" $ "sc" .Values.provisioningProcessor.containerSecurityContext) | nindent 10 }}
          env:
            # Also read by the scheduler below: SCHEDULE_TIME is a wall-clock time, evaluated in this zone.
            - name: TZ
              value: {{ .Values.provisioningProcessor.schedule.timezone | quote }}
            - name: RESULT_DIR
              value: "/var/trust-data"
            {{- if .Values.provisioningProcessor.schedule.enabled }}
            - name: SCHEDULE_TIME
              value: {{ .Values.provisioningProcessor.schedule.time | quote }}
            {{- end }}
            - name: PROCESSORS_TSL_SMB_ENABLED
              value: "true"
            - name: PROCESSORS_TSL_OCSP_ENABLED
              value: {{ .Values.provisioningProcessor.tslOcspEnabled | quote }}
            - name: TSL_FILENAME
              value: "ECC-RSA_TSL-test.xml"
            - name: PROCESSORS_TPM_ENABLED
              value: "true"
            - name: PROCESSORS_APPLE_TRUST_STORE_ENABLED
              value: "true"
            - name: PROCESSORS_GOOGLE_TRUST_STORE_ENABLED
              value: "true"
            - name: PROCESSORS_FEDERATION_MASTER_ENABLED
              value: {{ .Values.provisioningProcessor.federationMaster.enabled | quote }}
            {{- if .Values.provisioningProcessor.federationMaster.enabled }}
            - name: FEDERATION_MASTER_ENVIRONMENT
              value: {{ required "provisioningProcessor.federationMaster.environment is required when federationMaster is enabled" .Values.provisioningProcessor.federationMaster.environment | quote }}
            {{- if .Values.provisioningProcessor.federationMaster.devModeUrl }}
            - name: DEV_MODE
              value: "true"
            - name: FEDMASTER_URL
              value: {{ .Values.provisioningProcessor.federationMaster.devModeUrl | quote }}
            {{- end }}
            {{- end }}
            - name: PROVISIONING_CONTAINER_NAME
              value: {{ .Values.provisioningProcessor.provisioningContainer | quote }}
            {{- include "zeta-guard.provisioningProcessor.caEnv" . | nindent 12 }}
            - name: TRUST_CERTCHAIN_FILE
              value: "/var/image-trustchain/certchain.pem"
            {{- include "zeta-guard.proxyEnvVars" .Values.global | nindent 12 }}
          {{- with .Values.provisioningProcessor.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: trust-data
              mountPath: "/var/trust-data"
              readOnly: false
            - name: image-trustchain
              mountPath: "/var/image-trustchain"
              readOnly: true
            - name: tmp
              mountPath: "/tmp"
              readOnly: false
            {{- include "zeta-guard.provisioningProcessor.caVolumeMounts" . | nindent 12 }}
      containers:
        - name: keycloak
          image: "{{ include "authserver.image" . | trim }}"
          imagePullPolicy: "{{ .Values.authserver.imagePullPolicy }}"
          {{- with .Values.authserver.container.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - start
            {{- if .Values.authserver.verbose }}
            - --verbose
            {{- end }}
            - --optimized
            - --db-pool-min-size={{ .Values.authserver.dbPool.minSize }}
            - --db-pool-max-size={{ .Values.authserver.dbPool.maxSize }}
            - --db-pool-max-lifetime={{ .Values.authserver.dbPool.maxLifetime }}
            - --http-pool-max-threads={{ .Values.authserver.httpPool.maxThreads }}
            - --hostname-strict=false
            - --proxy-headers=xforwarded
            {{- if .Values.authserver.adminHostname }}
            {{- /* KC26: --hostname must be a full URL when --hostname-admin is set.
                 The path (/auth) must be explicit on *both* to preserve the context path;
                 omitting it would cause KC to drop the /auth prefix from all endpoints.
                 On --hostname-admin that means KC serves the console at /auth/admin/ (from
                 KC_HTTP_RELATIVE_PATH) but advertises and redirects to /admin/ — a path
                 neither KC nor ingress-admin.yaml (path: /auth) answers. */}}
            - --hostname=https://{{ .Values.authserver.hostname }}/auth
            - --hostname-admin=https://{{ .Values.authserver.adminHostname }}/auth
            {{- else }}
            - --hostname={{ .Values.authserver.hostname }}
            {{- end }}
            - --http-access-log-enabled=true
          livenessProbe:
            httpGet:
              {{- /* Deliberately DB-independent. Pointing liveness at /health/ready would let a
                   single database outage kill every authserver pod at once, turning a recoverable
                   incident into a restart cascade. The pool recovers on its own (see the
                   validation settings below); it needs no help from the kubelet. */}}
              path: /auth-mgmt/health/live/ # align with KC_HTTP_MANAGEMENT_RELATIVE_PATH
              port: http-mgmt-port
              {{- if or .Values.authserver.hsm.tls.enabled .Values.authserver.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: {{ .Values.authserver.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.authserver.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.authserver.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.authserver.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /auth-mgmt/health/ready/  # align with KC_HTTP_MANAGEMENT_RELATIVE_PATH
              port: http-mgmt-port
              {{- if or .Values.authserver.hsm.tls.enabled .Values.authserver.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: {{ .Values.authserver.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.authserver.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.authserver.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.authserver.probes.readiness.failureThreshold }}
          startupProbe:
            httpGet:
              path: /auth-mgmt/health/ready/  # align with KC_HTTP_MANAGEMENT_RELATIVE_PATH
              port: http-mgmt-port
              {{- if or .Values.authserver.hsm.tls.enabled .Values.authserver.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: {{ .Values.authserver.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.authserver.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.authserver.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.authserver.probes.startup.failureThreshold }}
          env:
            {{- if .Values.authserver.testmode }}
            - name: KC_SPI_CONNECTIONS_HTTP_CLIENT_DEFAULT_DISABLE_TRUST_MANAGER
              value: "true"
            {{- end }}
            # Environment variable 'KEYCLOAK_ADMIN' is deprecated, use 'KC_BOOTSTRAP_ADMIN_USERNAME' instead
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authserver.admin.secretRef | default "authserver-admin" | quote }}
                  key: username
            # Environment variable 'KEYCLOAK_ADMIN_PASSWORD' is deprecated, use 'KC_BOOTSTRAP_ADMIN_PASSWORD' instead
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authserver.admin.secretRef | default "authserver-admin" | quote }}
                  key: password
            {{- if .Values.provisioningProcessor.tslOcspEnabled }}
            # Unset when OCSP is off: the app treats a missing OCSP_KEYSTORE_LOCATION as
            # "OCSP disabled"; leaving it set fails on the absent ocsp-signers.p12 at startup.
            - name: OCSP_KEYSTORE_LOCATION
              value: "/var/trust-data/ocsp-signers.p12"
            - name: OCSP_KEYSTORE_META_LOCATION
              value: "/var/trust-data/ocsp-signers-meta.json"
            - name: OCSP_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authserver.truststoresSecretRef | default "pdp-truststores-pw" | quote }}
                  key: password
            {{- end }}
            - name: SMCB_KEYSTORE_LOCATION
              value: "/var/trust-data/smcb-trust-roots.p12"
            - name: SMCB_KEYSTORE_META_LOCATION
              value: "/var/trust-data/smcb-trust-roots-meta.json"
            - name: SMCB_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authserver.truststoresSecretRef | default "pdp-truststores-pw" | quote }}
                  key: password
            - name: TPM_KEYSTORE_LOCATION
              value: "/var/trust-data/tpm-trust-roots.p12"
            - name: TPM_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authserver.truststoresSecretRef | default "pdp-truststores-pw" | quote }}
                  key: password
            - name: APPLE_KEYSTORE_LOCATION
              value: "/var/trust-data/apple-trust-roots.p12"
            - name: APPLE_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authserver.truststoresSecretRef | default "pdp-truststores-pw" | quote }}
                  key: password
            # Certificate revocation status list (CRL) for Android key attestation certificates, published by Google at [https://android.googleapis.com/attestation/status].
            - name: GOOGLE_CERTIFICATE_STATUS_LOCATION
              value: "/var/trust-data/google-certificate-status.json"
            - name: GOOGLE_KEYSTORE_LOCATION
              value: "/var/trust-data/google-trust-roots.p12"
            - name: GOOGLE_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authserver.truststoresSecretRef | default "pdp-truststores-pw" | quote }}
                  key: password
            # Periodic reload of the truststores above, so a provisioning run takes effect without restarting the pod.
            - name: TRUSTSTORE_RELOAD_ENABLED
              value: {{ .Values.authserver.truststoreReload.enabled | quote }}
            - name: TRUSTSTORE_RELOAD_INTERVAL
              value: {{ .Values.authserver.truststoreReload.interval | quote }}
            {{- if .Values.devMode }}
            # Enable remote debugging in devMode
            - name: KC_DEBUG
              value: "true"
            - name: KC_DEBUG_PORT
              value: "*:5005"
            {{- end }}
            - name: KC_LOG_LEVEL
              value: "{{ .Values.authserver.log.level }}"
            {{- include "keycloak.buildOptions" . | nindent 12 }}
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: JAVA_LOCALE
              value: "-Duser.timezone=Europe/Berlin"
            - name: JAVA_OPTS_APPEND
              value: >
                -ea
                -XX:MaxRAMPercentage=70
                -XX:MinRAMPercentage=70
                -XX:InitialRAMPercentage=50
                -XX:MetaspaceSize=96M
                -XX:MaxMetaspaceSize=256m
                -XX:+UseG1GC
                -XX:MaxGCPauseMillis=200
                {{- with .Values.global.noProxy }}
                -Dhttp.nonProxyHosts={{ regexReplaceAll "(^|,)\\." . "${1}*." | replace "," "|" }}
                {{- end }}
            {{- if .Values.authServerLogConsoleOutput | eq "json" }}
            - name: KC_LOG_CONSOLE_JSON_FORMAT
              value: "ecs"
            {{- end }}
            - name: KC_LOG_CONSOLE_OUTPUT
              value: {{ quote .Values.authServerLogConsoleOutput }}
            - name: KC_TELEMETRY_ENDPOINT
              value: "http://{{ include "telemetryGateway.hostname" . }}:4317"
            - name: KC_TELEMETRY_RESOURCE_ATTRIBUTES
              value: "service.version={{ .Chart.Version }}"
            - name: KC_TELEMETRY_SERVICE_NAME
              value: "{{ include "authserver.otel-service-name" $ }}"
            # OPA endpoints and behavior
            - name: KC_SPI_TOKEN_EXCHANGE_PROVIDER_ZETA_SMC_B_TOKEN_EXCHANGE_OPA_BASE_URL
              value: "{{ .Values.authserver.provider.smcB.opaBaseUrl }}"
            - name: KC_SPI_TOKEN_EXCHANGE_PROVIDER_ZETA_SMC_B_TOKEN_EXCHANGE_OPA_SIMULATION_BASE_URL
              value: "{{ .Values.authserver.provider.smcB.opaSimulationBaseUrl }}"
            - name: KC_SPI_TOKEN_EXCHANGE_PROVIDER_ZETA_SMC_B_TOKEN_EXCHANGE_DECISION_PATH
              value: "{{ .Values.authserver.provider.smcB.decisionPath }}"
            - name: KC_SPI_TOKEN_EXCHANGE_PROVIDER_ZETA_SMC_B_TOKEN_EXCHANGE_CONNECTION_TIMEOUT_MS
              value: "{{ .Values.authserver.provider.smcB.connectionTimeoutMs }}"
            - name: KC_SPI_TOKEN_EXCHANGE_PROVIDER_ZETA_SMC_B_TOKEN_EXCHANGE_READ_TIMEOUT_MS
              value: "{{ .Values.authserver.provider.smcB.readTimeoutMs }}"
            # SMC-B OCSP revocation check timeouts
            - name: KC_SPI_TOKEN_EXCHANGE_PROVIDER_ZETA_SMC_B_TOKEN_EXCHANGE_OCSP_CONNECT_TIMEOUT_MS
              value: "{{ .Values.authserver.provider.smcB.ocspConnectTimeoutMs }}"
            - name: KC_SPI_TOKEN_EXCHANGE_PROVIDER_ZETA_SMC_B_TOKEN_EXCHANGE_OCSP_READ_TIMEOUT_MS
              value: "{{ .Values.authserver.provider.smcB.ocspReadTimeoutMs }}"
            # Fail-closed guard: also deny when the OCSP revocation status cannot be determined.
            # Keep the quote — the provider parses strictly and treats anything but
            # "true"/"false" as unset, falling back to fail-open.
            - name: KC_SPI_TOKEN_EXCHANGE_PROVIDER_ZETA_SMC_B_TOKEN_EXCHANGE_OCSP_FAIL_CLOSED
              value: {{ .Values.authserver.provider.smcB.ocspFailClosed | quote }}
            {{- if $sekidpMtlsOn }}
            - name: KC_SPI_IDENTITY_PROVIDER__ZETA_SEKIDP_OIDC__MTLS_ENABLED
              value: "true"
            - name: KC_SPI_IDENTITY_PROVIDER__ZETA_SEKIDP_OIDC__MTLS_KEYSTORE_LOCATION
              value: /opt/keycloak/conf/sekidp-client/keystore.p12
            - name: KC_SPI_IDENTITY_PROVIDER__ZETA_SEKIDP_OIDC__MTLS_KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "authserver.sekidp.mtls.keystorePassword.secretName is required when sekidp mTLS is enabled" $sekidpMtls.keystorePassword.secretName }}
                  key: {{ required "authserver.sekidp.mtls.keystorePassword.secretKey is required when sekidp mTLS is enabled" $sekidpMtls.keystorePassword.secretKey }}
            {{- end }}
            {{- if $rsMtls.enabled }}
            # Resource servers calling userinfo/email: the ingress forwards their client certificate unverified in
            # ssl-client-cert (ingress-auth.yaml); the plugin checks the chain against the resource server truststore.
            - name: KC_SPI_X509CERT_LOOKUP__PROVIDER
              value: nginx
            - name: KC_SPI_X509CERT_LOOKUP__NGINX__SSL_CLIENT_CERT
              value: ssl-client-cert
            # Must stay false: true makes Keycloak demand ssl-client-verify: SUCCESS from the proxy, which an
            # optional_no_ca ingress never sends (→ 401 for everyone). With false Keycloak tries to rebuild the chain
            # from its own truststore and, failing for the resource server CA, emits per request a WARN "No issuer
            # certificate ..." and an INFO "Impossible to rebuild end user cert chain : client certificate
            # authentication will fail". Expected and harmless (the INFO is wrong here): the client certificate is
            # still handed over and the plugin validates it against the resource server truststore. The image demotes
            # exactly these two messages to DEBUG (Quarkus log filter in conf/quarkus.properties); to see them, add
            # org.keycloak.services.x509.NginxProxySslClientCertificateLookup:debug to authserver.log.level.
            - name: KC_SPI_X509CERT_LOOKUP__NGINX__TRUST_PROXY_VERIFICATION
              value: "false"
            {{- end }}
            {{- if $rsTruststore }}
            - name: KC_SPI_REALM_RESTAPI_EXTENSION__ZETA__RESOURCE_SERVER_TRUSTSTORE_FILE
              value: /opt/keycloak/conf/resource-server-truststore/{{ base $rsMtls.truststore.secretKey }}
            {{- if $rsMtls.truststorePassword.secretName }}
            - name: KC_SPI_REALM_RESTAPI_EXTENSION__ZETA__RESOURCE_SERVER_TRUSTSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $rsMtls.truststorePassword.secretName }}
                  key: {{ $rsMtls.truststorePassword.secretKey }}
            {{- end }}
            {{- end }}
            # https://www.keycloak.org/docs/latest/upgrading/#maximum-length-of-the-parameters-in-the-oidc-token-endpoint
            - name: KC_SPI_LOGIN_PROTOCOL_OPENID_CONNECT_REQ_PARAMS_DEFAULT_MAX_SIZE
              value: "10000"
            - name: SMCB_USER_MAX_CLIENTS
              value: "{{ .Values.authserver.config.maxClients }}"
            - name: SMCB_IDLE_USER_TTL
              value: "{{ .Values.authserver.config.userIdleTTL }}"
            - name: SMCB_IDLE_CLIENT_TTL
              value: "{{ .Values.authserver.config.clientIdleTTL }}"
            - name: CLIENT_REGISTRATION_TTL
              value: "{{ .Values.authserver.config.clientRegistrationTTL }}"
            - name: CLIENT_REGISTRATION_SCHEDULER_INTERVAL
              value: "{{ .Values.authserver.config.clientRegistrationSchedulerInterval }}"
            - name: ZETA_OIDC_FLOW_ENABLED
              value: {{ .Values.authserver.config.oidcFlowEnabled | toString | quote }}
            {{- if .Values.authserver.config.oidcFlowEnabled }}
            - name: ENTITY_STATEMENT_CLIENT_NAME
              value: {{ .Values.authserver.config.entityStatement.clientName | quote }}
            - name: ENTITY_STATEMENT_ORGANIZATION_NAME
              value: {{ .Values.authserver.config.entityStatement.organizationName | quote }}
            - name: ENTITY_STATEMENT_CONTACT_EMAIL
              value: {{ .Values.authserver.config.entityStatement.contactEmail | quote }}
            {{- with .Values.authserver.config.entityStatement.redirectUris }}
            - name: ENTITY_STATEMENT_REDIRECT_URIS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- end }}
            - name: FEDERATION_MASTER_LOCATION
              value: "/var/trust-data/federation-master.json"
            {{- if .Values.authserver.hsm.enabled }}
            - name: HSM_PROXY_ENDPOINT
              value: {{ .Values.authserver.hsm.endpoint | quote }}
            - name: HSM_PROXY_KEY_ID
              value: {{ .Values.authserver.hsm.tls.keyId | quote }}
            {{- if .Values.authserver.dbEnc.enabled }}
            {{- with .Values.authserver.hsm.dbEnc.keyId }}
            - name: HSM_PROXY_KEK_ID
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.authserver.dbEnc.futureKeychainFileName }}
            - name: SPREE_FUTURE_KEYCHAIN_FILE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.authserver.dbEnc.keychainFileName }}
            - name: SPREE_KEYCHAIN_FILE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.authserver.dbEnc.previousKeychainFileName }}
            - name: SPREE_PREVIOUS_KEYCHAIN_FILE
              value: {{ . | quote }}
            {{- end }}
            - name: SPREE_INTEGRITY_PROVIDER_ENABLED
              value: {{ .Values.authserver.dbEnc.enabled | toString | quote }}
            - name: SPREE_ENABLE_COLUMN_ENCRYPTION
              value: {{ .Values.authserver.dbEnc.columnEncryptionEnabled | toString | quote }}
            - name: SPREE_ENABLE_INTEGRITY_CHECK
              value: {{ .Values.authserver.dbEnc.integrityChecksEnabled | toString | quote }}
            - name: SPREE_ENABLE_INTEGRITY_ROW_CHECK
              value: {{ .Values.authserver.dbEnc.integrityRowChecksEnabled | toString | quote }}
            - name: SPREE_ENABLE_INTEGRITY_TABLE_CHECK
              value: {{ .Values.authserver.dbEnc.integrityTableChecksEnabled | toString | quote }}
            - name: SPREE_ENCRYPTED_REALM
              value: "zeta-guard"
            - name: SPREE_BOOTSTRAP_INTERVAL
              value: {{ .Values.authserver.dbEnc.bootstrapInterval | quote }}
            - name: SPREE_BOOTSTRAP_ATTEMPTS
              value: {{ .Values.authserver.dbEnc.bootstrapAttempts | toString | quote }}
            - name: SPREE_SHUTDOWN_ON_ERROR
              value: {{ .Values.authserver.dbEnc.shutdownOnError | toString | quote }}
            - name: SPREE_PERIODIC_ROW_CHECK
              value: {{ .Values.authserver.dbEnc.periodicRowChecksEnabled | toString | quote }}
            - name: SPREE_LOCKDOWN_ON_ERROR
              value: {{ .Values.authserver.dbEnc.lockdownOnError | toString | quote }}
            - name: SPREE_AUTOMATIC_CRYPTO_UPDATE
              value: {{ .Values.authserver.dbEnc.automaticCryptoUpdatesEnabled | toString | quote }}
            {{- end }}
            {{- if .Values.authserver.hsm.tokenSigning.enabled }}
            - name: HSM_PROXY_TOKEN_KEY_ID
              value: {{ .Values.authserver.hsm.tokenSigning.keyId | quote }}
            # Fail-closed guard: refuse software signing-key fallback when HSM is unreachable.
            - name: KC_SPI_KEYS_ZETA_HSM_TOKEN_SIGNING_FAIL_CLOSED
              value: {{ .Values.authserver.hsm.tokenSigning.failClosed | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.authserver.hsm.tls.enabled }}
            # pod-level TLS via HSM-backed HSMPROXY KeyStore
            # startup.sh generates /opt/keycloak/conf/hsm-keystore.properties from HSM_PROXY_* env vars
            - name: KC_HTTPS_KEY_STORE_TYPE
              value: "HSMPROXY"
            - name: KC_HTTPS_KEY_STORE_FILE
              value: "/opt/keycloak/conf/hsm-keystore.properties"
            - name: KC_HTTPS_KEY_STORE_ALIAS
              value: "tls"
            {{- else if .Values.authserver.tls.enabled }}
            # pod-level TLS via cert/key mounted from a Kubernetes Secret
            - name: KC_HTTPS_CERTIFICATE_FILE
              value: "/opt/keycloak/conf/tls/tls.crt"
            - name: KC_HTTPS_CERTIFICATE_KEY_FILE
              value: "/opt/keycloak/conf/tls/tls.key"
            {{- end }}
            # Initial hash for admin events log
            - name: GENESIS_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authserver.genesisHashSecretRef | default "genesis-hash" | quote }}
                  key: hash
            - name: SMCB_HASHING_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authserver.smcbHashingPepperSecretRef | default "smcb-hashing-pepper" | quote }}
                  key: pepper
            # Agroal connection validation (ANFTI2-881). Keycloak exposes no first-class
            # option for any of these, so they go in as plain Quarkus properties: its own
            # KcEnvConfigSource reads only KC_/KCRAW_ names, but it does not replace Quarkus'
            # default EnvConfigSource, which stays active alongside it.
            # Without a validation timeout Quarkus validates with isValid(0) — no socket
            # timeout — so the check hangs on the dead socket it is meant to detect, and the
            # pool never recovers. Foreground validation has no Quarkus default at all, so a
            # stale connection otherwise goes straight to a request thread.
            # Do NOT add validation-query-sql: it replaces the timeout-aware validator with
            # one using setQueryTimeout(), which pgjdbc implements as a cancel over a second
            # socket — useless against a server that answers nothing.
            - name: QUARKUS_DATASOURCE_JDBC_VALIDATION_QUERY_TIMEOUT
              value: {{ .Values.authserver.dbPool.validationQueryTimeout | quote }}
            - name: QUARKUS_DATASOURCE_JDBC_BACKGROUND_VALIDATION_INTERVAL
              value: {{ .Values.authserver.dbPool.backgroundValidationInterval | quote }}
            - name: QUARKUS_DATASOURCE_JDBC_FOREGROUND_VALIDATION_INTERVAL
              value: {{ .Values.authserver.dbPool.foregroundValidationInterval | quote }}
            - name: QUARKUS_DATASOURCE_JDBC_IDLE_REMOVAL_INTERVAL
              value: {{ .Values.authserver.dbPool.idleRemovalInterval | quote }}
            # DB wiring switches by databaseMode value (cloudnative|external)
            {{- if eq .Values.databaseMode "cloudnative" }}
            # CloudNativePG-backed DB
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: {{ include "authserver.dbUrl" . | quote }}
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudnativeDbSecretName | quote }}
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudnativeDbSecretName | quote }}
                  key: password
            - name: KC_DB_SCHEMA
              value: {{ .Values.cloudnativeDbSchema | quote }}
            {{- else }}
            # DB settings for external DB
            - name: KC_DB
              value: {{ .Values.authserverDb.kcDb | quote }}
            - name: KC_DB_URL
              value: {{ include "authserver.dbUrl" . | quote }}
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authserverDb.kcDbSecretName | quote }}
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.authserverDb.kcDbSecretName | quote }}
                  key: password
            - name: KC_DB_SCHEMA
              value: {{ .Values.authserverDb.kcDbSchema | quote }}
            {{- end }}
            {{- if .Values.global.infinispanExternal.enabled }}
            {{- if and .Values.global.infinispanExternal.remote.host .Values.global.infinispanExternal.remote.port }}
            - name: KC_CACHE_REMOTE_HOST
              value: {{ .Values.global.infinispanExternal.remote.host }}
            - name: KC_CACHE_REMOTE_PORT
              value: {{ .Values.global.infinispanExternal.remote.port }}
            {{- else }}
            - name: KC_CACHE_REMOTE_HOST
              value: infinispan
            - name: KC_CACHE_REMOTE_PORT
              value: "11222"
            {{- end }}
            - name: KC_CACHE_REMOTE_USERNAME
              valueFrom:
                secretKeyRef:
                  {{- if .Values.global.infinispanExternal.admin.secretName }}
                  name: {{ .Values.global.infinispanExternal.admin.secretName }}
                  {{- else }}
                  name: infinispan-admin
                  {{- end }}
                  key: username
            - name: KC_CACHE_REMOTE_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.global.infinispanExternal.admin.secretName }}
                  name: {{ .Values.global.infinispanExternal.admin.secretName }}
                  {{- else }}
                  name: infinispan-admin
                  {{- end }}
                  key: password
            - name: KC_CACHE_REMOTE_TLS_ENABLED
            {{- if .Values.global.infinispanExternal.hsm.enabled }}
              value: "true"
            {{- else }}
              value: "false"
            {{- end }}
            {{- end }}
            {{- include "zeta-guard.proxyEnvVars" .Values.global | nindent 12 }}
          ports:
            - containerPort: 8080 # align with KC_HTTP_PORT
              name: http-port
            - containerPort: 9000 # align with KC_HTTP_MANAGEMENT_PORT
              name: http-mgmt-port
            - containerPort: 7800
              name: jgroups
            - containerPort: 57800
              name: jgroups-fd
            {{- if or .Values.authserver.hsm.tls.enabled .Values.authserver.tls.enabled }}
            - containerPort: 8443
              name: https-port
            {{- end }}
            {{- if .Values.devMode }}
            - containerPort: 5005
              name: jdwp
            {{- end }}
          volumeMounts:
            - name: keycloak-home
              mountPath: /opt/keycloak
            - name: trust-data
              mountPath: "/var/trust-data"
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- if .Values.authserver.tls.enabled }}
            - name: tls-cert
              mountPath: /opt/keycloak/conf/tls
              readOnly: true
            {{- end }}
            {{- if and .Values.global.infinispanExternal.enabled .Values.global.infinispanExternal.hsm.enabled }}
            - name: infinispan-ca
              mountPath: /opt/keycloak/conf/truststores/infinispan
              readOnly: true
            {{- end }}
            {{- if .Values.authserver.additionalTrustedCAs }}
            # Keycloak auto-imports every certificate under conf/truststores.
            - name: additional-trusted-cas
              mountPath: /opt/keycloak/conf/truststores/additional-cas
              readOnly: true
            {{- end }}
            {{- if $sekidpMtlsOn }}
            - name: sekidp-client-mtls
              mountPath: /opt/keycloak/conf/sekidp-client
              readOnly: true
            {{- end }}
            {{- if $rsTruststore }}
            # Deliberately not under conf/truststores, which Keycloak also trusts for outbound calls.
            - name: resource-server-truststore
              mountPath: /opt/keycloak/conf/resource-server-truststore
              readOnly: true
            {{- end }}
            {{- with .Values.authserver.container.extraVolumeMounts }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
          {{- include "zeta-guard.containerSecurityContext" (dict "root" $ "sc" .Values.authserver.container.containerSecurityContext) | nindent 10 }}
      volumes:
        - name: keycloak-home
          emptyDir: {}
        - name: trust-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: image-trustchain
          secret:
            secretName: {{ required "SecretRef for image verification certchain is missing, see imageTrustCertchainSecretRef" .Values.imageTrustCertchainSecretRef }}
        {{- include "zeta-guard.provisioningProcessor.caVolumes" . | nindent 8 }}
        {{- if .Values.authserver.tls.enabled }}
        - name: tls-cert
          secret:
            secretName: {{ .Values.authserver.tls.certSecretName }}
        {{- end }}
        {{- if and .Values.global.infinispanExternal.enabled .Values.global.infinispanExternal.hsm.enabled }}
        - name: infinispan-ca
          configMap:
            name: infinispan-ca-cert
            defaultMode: 0444
        {{- end }}
        {{- if .Values.authserver.additionalTrustedCAs }}
        - name: additional-trusted-cas
          projected:
            sources:
              {{- range $i, $ca := .Values.authserver.additionalTrustedCAs }}
              {{- if and $ca.secretName $ca.cert }}
              {{- fail (printf "authserver.additionalTrustedCAs[%d]: set either secretName+secretKey or cert, not both" $i) }}
              {{- else if $ca.secretName }}
              - secret:
                  name: {{ $ca.secretName }}
                  items:
                    - key: {{ required (printf "authserver.additionalTrustedCAs[%d]: secretKey is required when secretName is set" $i) $ca.secretKey }}
                      path: {{ printf "ca-%d.pem" $i }}
              {{- else if $ca.cert }}
              - secret:
                  name: authserver-additional-cas
                  items:
                    - key: {{ printf "ca-%d.pem" $i }}
                      path: {{ printf "ca-%d.pem" $i }}
              {{- else }}
              {{- fail (printf "authserver.additionalTrustedCAs[%d]: must set either secretName+secretKey or cert" $i) }}
              {{- end }}
              {{- end }}
        {{- end }}
        {{- if $sekidpMtlsOn }}
        - name: sekidp-client-mtls
          secret:
            secretName: {{ $sekidpMtls.keystore.secretName }}
            items:
              - key: {{ required "authserver.sekidp.mtls.keystore.secretKey is required when sekidp mTLS is enabled" $sekidpMtls.keystore.secretKey }}
                path: keystore.p12
        {{- end }}
        {{- if $rsTruststore }}
        - name: resource-server-truststore
          secret:
            secretName: {{ $rsMtls.truststore.secretName }}
            items:
              - key: {{ $rsMtls.truststore.secretKey }}
                path: {{ base $rsMtls.truststore.secretKey }}
        {{- end }}
        {{- with .Values.authserver.extraVolumes }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      {{- with .Values.authserver.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.authserver.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
