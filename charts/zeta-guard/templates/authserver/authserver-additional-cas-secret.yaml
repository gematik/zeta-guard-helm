{{/*
  Materializes a chart-managed Secret from any inline-PEM (`cert`) entries in
  authserver.additionalTrustedCAs, so users don't have to pre-create a Secret
  just to trust a known-good CA. Entries using the secretName/secretKey form
  reference an existing Secret directly and are not included here. Renders
  nothing if no entry uses the `cert` form.
*/}}
{{- $hasInlineCAs := false }}
{{- range .Values.authserver.additionalTrustedCAs }}
  {{- if .cert }}
    {{- $hasInlineCAs = true }}
  {{- end }}
{{- end }}
{{- if $hasInlineCAs }}
apiVersion: v1
kind: Secret
metadata:
  name: authserver-additional-cas
  labels:
    {{- include "authserver.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $i, $ca := .Values.authserver.additionalTrustedCAs }}
  {{- if $ca.cert }}
  {{ printf "ca-%d.pem" $i }}: |
    {{- $ca.cert | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
