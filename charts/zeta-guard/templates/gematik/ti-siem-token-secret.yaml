{{- if .Values.gematikConnectionEnabled }}
apiVersion: v1
kind: Secret
metadata:
  name: ti-siem-token
  labels:
    {{- include "opa.labels" . | nindent 4 }}
type: Opaque
{{- /* Seed a placeholder so /etc/ti-siem/token exists before the first
     * token-renewer run. When the key already exists, carry the live
     * value forward so the manifest always contains data.token —
     * otherwise helm's merge would remove the renewed token
     * on the first upgrade after a fresh install.
     * The legacy gematik-oidc-token Secret (pre-SIM/SIEM split) is used
     * as a one-time migration fallback; drop it once all environments
     * have upgraded past the split. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "ti-siem-token" }}
{{- $legacy := lookup "v1" "Secret" .Release.Namespace "gematik-oidc-token" }}
{{- $live := index ($existing | default $legacy | default dict) "data" | default dict }}
data:
  token: {{ index $live "token" | default ("placeholder-replaced-by-ti-siem-token-renewer" | b64enc) }}
{{- end }}