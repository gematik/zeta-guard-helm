{{- /* TODO: retire this hand-rolled template once every stage has migrated to keycloak-db.enabled */}}
{{- if and (eq .Values.databaseMode "cloudnative") (not (index .Values "keycloak-db" "enabled")) }}
{{- /* Connection-budget guard lives in cnpg-connection-budget-guard.yaml, so it also covers
     the keycloak-db.enabled path (that Cluster comes from the vendored subchart, which can't
     run our validation itself). */}}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
  labels:
    app.kubernetes.io/part-of: zeta-guard
spec:
  instances: {{ .Values.cloudnativePg.instances }}
  {{- if kindIs "bool" .Values.cloudnativePg.enablePDB }}
  enablePDB: {{ .Values.cloudnativePg.enablePDB }}
  {{- end }}
  postgresql:
    {{- with .Values.cloudnativePg.sharedPreloadLibraries }}
    {{- /* dedicated CNPG field, NOT a postgresql.conf parameter. For CNPG-
         managed extensions (pg_stat_statements, auto_explain, ...) the
         operator also creates the extension. Changing this restarts postgres. */}}
    shared_preload_libraries:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    parameters:
      shared_buffers: {{ .Values.cloudnativePg.parameters.sharedBuffers | quote }}
      max_connections: {{ .Values.cloudnativePg.parameters.maxConnections | quote }}
      {{- /* any further postgresql.conf parameters, passed through verbatim
           (snake_case keys, values as strings) */}}
      {{- range $k, $v := .Values.cloudnativePg.extraParameters }}
      {{ $k }}: {{ $v | quote }}
      {{- end }}
  imageName: {{ .Values.cloudnativePg.imageName | quote }}
  {{- with .Values.cloudnativePg.imagePullPolicy }}
  imagePullPolicy: {{ . | quote }}
  {{- end }}
  storage:
    size: {{ .Values.cloudnativePg.storage.size | quote }}
    {{- with .Values.cloudnativePg.storage.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
    {{- with .Values.cloudnativePg.storage.pvcTemplate }}
    pvcTemplate:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- /* Optional dedicated volume for pg_wal. When set, WAL fsync no longer
       contends with checkpoint data flushes on the same disk. Gated on the
       block being non-empty, so the default (single PVC) is unchanged. */}}
  {{- with .Values.cloudnativePg.walStorage }}
  walStorage:
    size: {{ .size | quote }}
    {{- with .storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}
    {{- with .pvcTemplate }}
    pvcTemplate:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- with .Values.cloudnativePg.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.cloudnativePg.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.cloudnativePg.monitoring }}
  monitoring:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.cloudnativePg.backup.enabled }}
  backup:
    {{- with .Values.cloudnativePg.backup.retentionPolicy }}
    retentionPolicy: {{ . | quote }}
    {{- end }}
    {{- with .Values.cloudnativePg.backup.barmanObjectStore }}
    barmanObjectStore:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  bootstrap:
    initdb:
      database: keycloak
      owner: zeta-guard
{{- end }}
