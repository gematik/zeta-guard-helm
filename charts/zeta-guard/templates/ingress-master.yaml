{{- /* vim: set ft=helm: */ -}}
{{- /* NIC mergeable master for zeta-guard */ -}}
{{- if .Values.ingressEnabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zeta-guard
  labels:
    {{- include "ingress.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.nginxIngressEnabled }}
    nginx.org/mergeable-ingress-type: "master"
    {{- end }}
    {{- if and .Values.authserver.hostname }}
    {{- /* TLS secret is issued by the explicit Certificate in certificate.yaml,
         not via ingress-shim annotations */ -}}
    {{- if not .Values.nginxIngressEnabled }}
    nginx.org/ssl-redirect: "true"
    {{- end }}
    {{- if .Values.nginxIngressEnabled }}
    nginx.org/hsts: "true"
    nginx.org/hsts-max-age: "31536000"
    nginx.org/hsts-include-subdomains: "true"
    {{- end }}
    {{- end }}
    {{- $annotations := deepCopy (.Values.ingressMasterAnnotations | default dict) }}
    {{- if and .Values.nginxIngressEnabled .Values.authserver.resourceServerMtls.enabled }}
    {{- /* Resource servers calling userinfo/email present a client certificate. Requested from every client on
         this host but optional and not verified here (no CA list): the authserver checks the chain itself, see
         authserver.resourceServerMtls. Prepended to, not replacing, server-snippets the operator set (ossl_hsm). */}}
    {{- $mtls := printf "ssl_verify_client optional_no_ca;\nssl_verify_depth %d;\n" (int .Values.authserver.resourceServerMtls.verifyDepth) }}
    {{- $_ := set $annotations "nginx.org/server-snippets" (printf "%s%s" $mtls (get $annotations "nginx.org/server-snippets")) }}
    {{- end }}
    {{- with $annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  {{- if (and .Values.authserver.hostname (not (and .Values.nginxIngressEnabled .Values.nginxIngressHsm))) }}
  tls:
    - hosts:
        - {{ .Values.authserver.hostname | quote }}
      secretName: "zeta-guard-tls"
  {{- end }}
  {{- if .Values.authserver.hostname }}
  rules:
    - host: {{ .Values.authserver.hostname | quote }}
  {{- end }}
{{- end }}
