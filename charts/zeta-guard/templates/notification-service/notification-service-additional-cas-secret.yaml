{{/*
  Materializes a chart-managed Secret from any inline-PEM (`cert`) entries in
  notificationService.pushGateway.trustedCAs, so users don't have to pre-create
  a Secret just to trust a known CA for outbound HTTPS to the Push Gateway.
  Entries using the secretName/secretKey form reference an existing Secret
  directly and are not included here. Renders nothing if no entry uses the
  `cert` form. Shared by both NS variants (rs/fdv).
*/}}
{{- if .Values.notificationService.enabled }}
{{- $hasInlineCAs := false }}
{{- range .Values.notificationService.pushGateway.trustedCAs }}
  {{- if .cert }}
    {{- $hasInlineCAs = true }}
  {{- end }}
{{- end }}
{{- if $hasInlineCAs }}
apiVersion: v1
kind: Secret
metadata:
  name: notification-service-additional-cas
  labels:
    {{- include "zeta-guard.baseLabels" . | nindent 4 }}
    app.kubernetes.io/component: notification-service
type: Opaque
stringData:
  {{- range $i, $ca := .Values.notificationService.pushGateway.trustedCAs }}
  {{- if $ca.cert }}
  {{ printf "ca-%d.pem" $i }}: |
    {{- $ca.cert | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
