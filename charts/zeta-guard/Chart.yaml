apiVersion: v2
name: zeta-guard
description: ZETA Guard
type: application
version: 2.0.4
# Hard lower bound for the whole chart: Kubernetes 1.32, i.e. OpenShift 4.19 or newer. Sidecar init containers
# (restartPolicy: Always), which the provisioning processor relies on, are GA from 1.29 — but the supported
# platform baseline is 1.32, so that is what is declared here.
kubeVersion: ">=1.32.0-0"
dependencies:
  - name: nginx-ingress
    # F5 NGINX Ingress Controller (NIC)
    version: 2.8.0
    repository: oci://ghcr.io/nginx/charts
    condition: nginx-ingress.enabled
  - name: opentelemetry-collector
    # Keep this in lockstep with the opentelemetry-collector version vendored
    # transitively by test-monitoring-service's opentelemetry-demo dependency
    # (charts/test-monitoring-service/Chart.yaml). Helm's `{{ define }}`
    # template names are global across the whole release, not scoped per
    # chart/subchart — deploying two different versions of the same chart
    # side by side means whichever copy's templates load last silently wins
    # the name collision for BOTH instances, and the loser's values (built
    # from its own, different version's values.yaml/schema) get fed into
    # template code that doesn't match, causing nil-pointer template errors
    # when both zeta-guard and test-monitoring-service are deployed together.
    version: "0.165.0"
    repository: oci://ghcr.io/open-telemetry/opentelemetry-helm-charts
    condition: telemetryGatewayEnabled
    alias: telemetry-gateway
  - name: cluster
    # Upstream CloudNativePG cluster chart, for generic config pass-through
    # (affinity, monitoring/PodMonitor, alerting/PrometheusRule, pooler,
    # backup) instead of the hand-rolled Cluster template in
    # templates/db/cnpg-cluster.yaml. Opt-in, off by default — the hand-rolled
    # template stays authoritative until this is explicitly enabled.
    version: "0.8.1"
    repository: oci://ghcr.io/cloudnative-pg/charts
    condition: keycloak-db.enabled
    alias: keycloak-db
  - name: prometheus
    # ADR 0001 (docs/adr/0001-reliable-daily-metrics.md): dedicated,
    # minimal Prometheus for durable KPI counters, independent of
    # charts/test-monitoring-service's own bundled Prometheus (which
    # ships transitively via its opentelemetry-demo dependency). Two
    # vendored copies of the same chart, at different versions, is the
    # exact category of bug this repo already hit and fixed once for
    # opentelemetry-collector — Helm's `{{ define }}` template names are
    # global across the whole release, not scoped per chart/subchart. If
    # this ever needs bumping, check test-monitoring-service's bundled
    # Prometheus version first and keep them aligned, or verify there's no
    # overlap in defined template names before assuming it's safe to diverge.
    version: "29.25.0"
    repository: https://prometheus-community.github.io/helm-charts
    condition: kpiMetricsPersistence.enabled
    alias: kpiPrometheus
