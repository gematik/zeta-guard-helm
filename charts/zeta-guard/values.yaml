global:
  imagePullSecrets: [ ]
  registry_host: "europe-west3-docker.pkg.dev/gematik-pt-zeta-prod/zeta-dcr/"
  infinispanExternal: {}
  # Istio PeerAuthentication resources
  istio:
    enabled: false
  # HTTP forward proxy for outbound requests from all ZETA Guard components.
  # Applies to: pepproxy (nginx), authserver (Keycloak), opa, opa-simulation,
  #             provisioning-processor (init container), opa-token-renewer (CronJob).
  # httpsProxy takes precedence over httpProxy for HTTPS traffic.
  # Example: "http://proxy.example.com:8080"
  httpProxy: null
  httpsProxy: null
  noProxy: null
  allProxy: null

  # global.clusterFQDN is the cluster's public fully qualified domain name
  clusterFQDN: "REPLACE ME"

registry_name: ""

# Chart-wide base for every container securityContext of this chart (PSS
# 'restricted'). A component's containerSecurityContext only lists what differs:
# each key set there wins, every other key comes from here. The merge is
# per top-level key — setting `capabilities` in a component replaces the whole
# map, so keep `drop: [ "ALL" ]` when adding capabilities.
# runAsUser is needed because several images declare a non-numeric USER
# (keycloak, nginx) or none at all (google/cloud-sdk, python), which the kubelet
# cannot verify against runAsNonRoot. On OpenShift set `runAsUser: null` so the
# SCC assigns the UID. Deliberately not under `global`: Helm drops a `null` there
# when zeta-guard is used as a dependency. The telemetry-gateway subchart does
# not read it, see telemetry-gateway below.
defaultContainerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop: ["ALL"]

# Chart-wide base for every pod securityContext of this chart, merged the same
# way as defaultContainerSecurityContext (a component's podSecurityContext only
# lists what differs). Set on the pod so it also covers containers the chart does
# not render itself (injected sidecars, debug containers). runAsUser stays on the
# container level, so it is not inherited by an injected istio-proxy.
defaultPodSecurityContext:
  seccompProfile:
    type: RuntimeDefault

# additionalLabels is a map of labels added to each zeta-guard resource.
additionalLabels: {}

authserver:
  dbEnc:
    enabled: false
    columnEncryptionEnabled: true
    integrityChecksEnabled: true
    integrityRowChecksEnabled: true
    integrityTableChecksEnabled: true
    periodicRowChecksEnabled: false
    lockdownOnError: false
    shutdownOnError: false
    # Enable to automatically start key rotation when detecting changes in keychain configuration
    automaticCryptoUpdatesEnabled: false
    bootstrapInterval: "PT30S"
    bootstrapAttempts: 15
    keychainGenerator:
      resources:
        limits:
          memory: "256Mi"
        requests:
          cpu: "100m"
          memory: "128Mi"
      extraVolumeMounts: []
      # Overrides on top of defaultContainerSecurityContext.
      containerSecurityContext:
        readOnlyRootFilesystem: false
      image:
        repository: keychain-generator
        tag: 2.0.10
      imagePullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: authserver
  # Overrides on top of defaultPodSecurityContext.
  podSecurityContext: {}
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  # Periodic reload of the SMC-B, TPM and OCSP truststores while the server runs, so a provisioning run takes effect
  # without restarting the pod. Compared is a hash over the trust files, so every provisioning run triggers one reload
  # even when the certificates are unchanged. Only has an effect if something actually rewrites the files at runtime,
  # see provisioningProcessor.schedule.
  truststoreReload:
    enabled: true
    # ISO-8601 duration between two checks, hours or less. The first check runs one interval after startup.
    interval: PT1H
  # keycloak-copy: copies /opt/keycloak from the image into the pod's writable volume.
  initContainer:
    # Overrides on top of defaultContainerSecurityContext.
    containerSecurityContext: {}
    resources:
      limits:
        memory: "256Mi"
      requests:
        cpu: "100m"
        memory: "64Mi"
  container:
    # Overrides on top of defaultContainerSecurityContext.
    containerSecurityContext: {}
    resources:
      limits:
        memory: "6Gi"
      requests:
        cpu: "4"
        memory: "4Gi"
    extraVolumeMounts: []
  extraVolumes: []
  # CA certificates Keycloak trusts for its own outbound HTTPS calls; each is
  # mounted under conf/truststores (auto-imported). Empty -> JVM defaults.
  # Per entry set exactly one: secretName+secretKey (existing Secret) or an
  # inline PEM cert (chart creates the Secret).
  additionalTrustedCAs: []
  # - secretName: zeta-guard-tls
  #   secretKey: ca.crt
  # - cert: |
  #     -----BEGIN CERTIFICATE-----
  #     ...
  #     -----END CERTIFICATE-----
  replicaCount: 1
  hostname: ""
  wellKnownAuthServerPath: /
  # When set, /auth/admin and /auth/realms/master on the main hostname are routed
  # to the PEP proxy, which denies them with 403, and a dedicated admin ingress is
  # created for this hostname. The master realm is blocked because it carries the
  # admin token endpoint; ZETA traffic runs on the zeta-guard realm and is
  # unaffected. Terraform/CI must use this hostname for keycloak_url.
  adminHostname: ""
  # TLS secret for the admin ingress. Defaults to "zeta-guard-admin-tls".
  # For local/KIND environments reuse the main cert by setting this to "zeta-guard-tls"
  # and adding the adminHostname to issuers.local.dnsNames.
  adminTlsSecretName: ""
  # Seed value for the admin-event hash chain (GENESIS_HASH env var).
  # Required on first install (helm install); leave empty on upgrades — the chart
  # reads the existing cluster Secret automatically via lookup and leaves it unchanged.
  # To rotate: set an explicit value during helm upgrade. Warning: changing this
  # value breaks the integrity of the admin-event hash chain.
  # Recommended format: 64-char hex string, e.g. $(openssl rand -hex 32)
  genesisHash:
  image:
    repository: keycloak-zeta
    tag: 2.0.1
  imagePullPolicy: Always
  imagePullSecrets: [ ]
  # authserver.podLabels is a map of labels to add to the authserver pod.
  podLabels: {}
  # Provider configuration for ZETA SMC-B token-exchange implementation
  provider:
    smcB:
      opaBaseUrl: "http://opa:8181"
      opaSimulationBaseUrl: "http://opa-simulation:8181"
      decisionPath: "/v1/data/policies/zeta/authz/decision"
      connectionTimeoutMs: 1000
      readTimeoutMs: 2000
      # HTTP timeouts for the SMC-B OCSP revocation check
      ocspConnectTimeoutMs: 1000
      ocspReadTimeoutMs: 3000
      # ocspFailClosed: default false (fail-open) — only a REVOKED OCSP response denies the token exchange;
      # an undetermined status (responder unreachable, timeout, unknown) is allowed so ZETA Guard stays operational
      # during an OCSP responder outage/maintenance.
      # Set to true to also deny when the revocation status cannot be determined.
      ocspFailClosed: false
  # Secret pepper for SMC-B user hashes (SMCB_HASHING_PEPPER env var).
  # Required on first install (helm install); leave empty on upgrades — the chart
  # reads the existing cluster Secret automatically via lookup and leaves it unchanged.
  # To rotate: set an explicit value during helm upgrade. Warning: changing this
  # value invalidates all existing SMC-B user hashes.
  # Recommended format: UUID, e.g. $(uuidgen)
  smcbHashingPepper:
  admin:
    username: admin
    password:
  hsm:
    # enabled activates the HSM Proxy connection at authserver startup (sets HSM_PROXY_ENDPOINT).
    # When false, the HsmProxyKeycloakFactory SPI is a no-op and no HSM is required at runtime.
    enabled: false
    endpoint: ""  # gRPC address of the HSM Proxy, e.g. "hsm-sim:50051"
    dbEnc: {}
    tls:
      # Pod-level HTTPS on port 8443 using an HSM-backed key.
      # Requires authserver.hsm.enabled: true and a running HSM Proxy.
      # startup.sh generates /opt/keycloak/conf/hsm-keystore.properties from HSM_PROXY_* env vars automatically.
      enabled: false
      keyId: ""  # TLS key ID in the HSM, e.g. "zeta-guard-keycloak-tls-es256-v1.p256"
    tokenSigning:
      # JWT token signing (access, ID, refresh tokens) via HSM-backed ES256 key.
      # Requires authserver.hsm.enabled: true. The realm must also set defaultSignatureAlgorithm: ES256.
      # The KeyProvider component is registered via Terraform (make config), not by the plugin itself.
      enabled: false
      keyId: ""  # Token signing key ID in the HSM, e.g. "zeta-guard-keycloak-token-es256-v1.p256"
      # failClosed: when true (default), HsmTokenSigningKeyProviderFactory throws on any SIG fallback attempt
      # while the HSM is unreachable, instead of letting Keycloak silently generate a software signing key.
      # Set to false ONLY for controlled HSM maintenance windows where temporary software fallback is acceptable.
      failClosed: true
  tls:
    # pod-level HTTPS on port 8443 using a cert/key from a Kubernetes Secret.
    # The Secret must contain keys tls.crt and tls.key (standard kubernetes.io/tls format).
    enabled: false
    # certSecretName is the name of the Kubernetes Secret holding tls.crt and tls.key.
    certSecretName: ""
  # Client mTLS identity presented to the SE-KIDP. On when keystore.secretName is set.
  sekidp:
    mtls:
      keystore:
        secretName: ""                 # Secret holding the PKCS12 keystore
        secretKey: sekidp-client.p12   # key within that Secret
      keystorePassword:
        secretName: ""                 # Secret holding the keystore password
        secretKey: ""
  # mTLS authentication of resource servers calling GET /auth/realms/<realm>/zeta/userinfo/email, which releases the
  # verified email of a mobile user. When enabled, the ingress asks every client on authserver.hostname for a
  # certificate (optional, unverified by the ingress: ssl_verify_client optional_no_ca) and forwards it to Keycloak in
  # the ssl-client-cert header; the authserver checks its chain against the truststore below. Requires
  # config.oidcFlowEnabled. Side effect: browsers with client certificates installed may show a certificate picker.
  resourceServerMtls:
    enabled: false
    # Truststore dedicated to resource servers; every certificate in it is a trust anchor. Its format follows the
    # extension of secretKey: .p12/.pfx (PKCS12), .jks, anything else a PEM bundle. Empty secretName falls back to
    # Keycloak's HTTPS truststore (KC_HTTPS_TRUST_STORE_FILE). With neither, userinfo/email answers every request
    # with 401. Never put it into additionalTrustedCAs: those are trusted for outbound calls.
    truststore:
      secretName: ""
      secretKey: ca.pem
    # Only for PKCS12/JKS truststores.
    truststorePassword:
      secretName: ""
      secretKey: ""
    # ssl_verify_depth of the ingress: the longest certificate chain a resource server may present.
    verifyDepth: 3
  testmode: false
  # verbose adds --verbose to the Keycloak start command, which makes the CLI
  # print full stacktraces for startup/build errors. It does not change the
  # runtime log level — use authserver.log.level for that.
  verbose: false
  config:
    maxClients: "256"
    userIdleTTL: "P1Y"
    clientIdleTTL: "P1Y"
    clientRegistrationTTL: "PT5M"
    clientRegistrationSchedulerInterval: "PT2M"
    # Enable the OIDC client flow (env ZETA_OIDC_FLOW_ENABLED).
    oidcFlowEnabled: false
    # Entity statement metadata (A_23034-02, A_27598). Required when oidcFlowEnabled is true.
    # entityStatement:
    #   clientName: ""
    #   organizationName: ""
    #   contactEmail: ""
    #   # Optional (A_25656): static redirect_uris of the entity statement. Empty: derived from the realm's SekIDP clients.
    #   redirectUris: []
  # Mostly for test setup purposes.
  # Adds an entry to the authserver's host file, mapping hostAlias.ip to hostAlias.name
  hostAlias: { }
  db:
    # pgjdbc connection parameters, appended to KC_DB_URL as query parameters.
    #
    # socketTimeout (SECONDS) is the only bound on a blocking read, and the only bound on
    # the auth exchange of a NEW connection — db-connect-timeout maps to
    # quarkus.datasource.jdbc.login-timeout, which does not exist in Quarkus, so that
    # mapping is a no-op. Without it, a CNPG primary whose pod vanished (the -rw ClusterIP
    # stays valid while kube-proxy still routes to the dead pod IP, so no RST is ever sent)
    # blackholes the pooled connections and every replacement attempt alike.
    #
    # These live in the URL rather than as QUARKUS_DATASOURCE_JDBC_ADDITIONAL_JDBC_PROPERTIES_*
    # env vars because that is a Map property, and an environment variable name cannot carry
    # the camelCase key — it would arrive as "sockettimeout", which pgjdbc silently ignores.
    #
    # 120s is 12x db-log-slow-queries-threshold (10s), so no legitimate runtime statement is
    # near it, while staying above any realistic single Liquibase DDL statement. Raise it for
    # one release if a heavy migration is expected: a statement killed by this timeout leaves
    # the Liquibase changelog lock held and the next start waits 30 min before failing.
    #
    # "connectTimeout" and "targetServerType" are rejected here — naming either in the URL
    # makes Keycloak stop injecting its own defaults (10s / primary).
    urlProperties:
      socketTimeout: 120
      tcpKeepAlive: true
  dbPool:
    # Per-pod JDBC pool. replicaCount × maxSize (+ reserve) must stay ≤ maxConnections
    # (enforced in cnpg-cluster.yaml).
    minSize: 10
    maxSize: 100
    # Recycle every pooled connection after this long (ISO-8601 duration), so a socket
    # orphaned by a CNPG switchover cannot sit in the pool forever. Keycloak's own default
    # for Postgres is empty == unlimited; only MySQL/MariaDB get PT7H50M.
    # Set through this first-class Keycloak option rather than the underlying Quarkus
    # property: Keycloak maps kc.db-pool-max-lifetime -> quarkus.datasource.jdbc.max-lifetime
    # and logs "Please use the first-class option ..." if the Quarkus name is set directly.
    maxLifetime: PT30M
    # Agroal connection validation. Keycloak exposes no option for any of these, so they are
    # passed as plain QUARKUS_* environment variables — Keycloak's own KcEnvConfigSource only
    # reads KC_/KCRAW_ names, but it does not replace Quarkus' default EnvConfigSource, which
    # stays active alongside it. A misspelled name here is silently ignored — to prove one is
    # actually read, give it a value that cannot be converted: Keycloak then refuses to start
    # with SRCFG00039 naming the property.
    #
    # queryTimeout bounds the validation itself. Unset, Quarkus validates with isValid(0) —
    # no socket timeout — so the check hangs on the very socket it is meant to detect, which
    # is why the pool never recovered on its own.
    validationQueryTimeout: 2S
    # Background sweep over idle connections (Quarkus default 2M).
    backgroundValidationInterval: 15S
    # Validate on acquire once a connection has been idle longer than this. Quarkus has NO
    # default, i.e. this is off, which is why a stale connection went straight to a request
    # thread.
    foregroundValidationInterval: 5S
    # Reap idle connections (Quarkus default 5M). Never shrinks the pool below minSize.
    idleRemovalInterval: 1M
  httpPool:
    maxThreads: 300
  log:
    level: "INFO"
  # podAnnotations is for setting additional Kubernetes Annotations to a Pod.
  podAnnotations: {}
  probes:
    # timeoutSeconds matters more than it looks: Agroal's invalidCount is a monotonic counter
    # that never resets, so once validation has evicted its first connection Keycloak takes the
    # blocking DataSourceHealthCheck branch on EVERY readiness probe (open a connection and
    # validate it). Kubernetes' default of 1s flaps under load. The ceiling is Agroal's
    # acquisition timeout, PT20S.
    liveness:
      # Kubernetes suppresses liveness until the startupProbe has succeeded, so 0 is fine.
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 5
      # Liveness deliberately targets /health/live, which never touches the database, so this
      # threshold is about an unresponsive JVM — not about database availability. A DB-aware
      # liveness probe would kill every pod at once during an outage; the connection validation
      # below is what recovers the pool.
      failureThreshold: 5
    readiness:
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    startup:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 5
      # 60 × 5s = 300s. The previous 20 (100s) was tight for a cold database plus Liquibase.
      failureThreshold: 60
  affinity: {}
  tolerations: []

# authServerLogConsoleOutput sets the log output to JSON or default (plain) unstructured logging
authServerLogConsoleOutput: json

# authServerMetricsEnabled enables the metrics endpoint for Keycloak
authServerMetricsEnabled: true

# authServerTracingEnabled enables the OpenTelemetry tracing
authServerTracingEnabled: true

pepproxy:
  serviceAccount:
    create: true
    name: pep-proxy
  # Overrides on top of defaultPodSecurityContext.
  podSecurityContext:
    sysctls:
      # Outbound connections (inner ASL requests to localhost, nginx upstream
      # connections) each park their ephemeral port in TIME_WAIT for 60s when
      # closed — sustained connect/close churn needs ~rate × 60 free ports.
      # Widen the range to raise that ceiling, and pin it explicitly (the
      # effective default varies by base image / platform).
      # "Safe" sysctl: https://kubernetes.io/docs/tasks/administer-cluster/sysctl-cluster/#safe-and-unsafe-sysctls
      - name: net.ipv4.ip_local_port_range
        value: "10240 65535"
  # Overrides on top of defaultContainerSecurityContext, for the nginx container
  # and the metrics sidecar. The writable paths (/var/cache/nginx, /var/run,
  # /tmp) are emptyDirs, so the root filesystem stays read-only.
  containerSecurityContext: {}
  replicaCount: 1
  image:
    repository: ngx_pep
    # `pep_pdp_url` (nginxConf.pepInternalUrl) needs a PEP image >= 2.0.0-rc1; off by default.
    tag: 2.0.0
  imagePullPolicy: Always
  imagePullSecrets: [ ]
  # pepproxy.podLabels is a map of labels to add to the pepproxy pod.
  podLabels: {}
  # Extra /etc/hosts entries for the PEP pod (native Kubernetes hostAliases form).
  # Escape hatch for resolving a hostname the PEP must reach to a cluster-internal
  # address. Prefer `nginxConf.pepInternalUrl` for the authserver — it needs no IP
  # and no TLS considerations. If you do alias the public authserver FQDN here,
  # point it at the ClusterIP of the *ingress controller*, not the authserver:
  # only the ingress controller serves a certificate valid for that name.
  # Merged with the entries from `global.enableDNSRedirect`.
  #   hostAliases:
  #     - ip: 10.96.1.23
  #       hostnames:
  #         - zeta.example.com
  hostAliases: []
  resources:
    limits:
      memory: "2Gi"
    requests:
      cpu: "4"
      memory: "1Gi"
  workerProcesses: auto
  workerConnections: 16384
  # per worker process; must cover ~2x worker_connections (client + upstream
  # side of each proxied connection) or nginx clamps below worker_connections
  workerRlimitNofile: 40960
  wellKnownBase: http://localhost
  wellKnownResourceSuffix: /pep/
  # boolean that controls if ASL should be enabled (true) or not (false)
  asl_enabled: false
  #
  # ASL signer key in the HSM as store URI, e.g. "store:hsm:asl-signer.p256".
  # Replaces the signer-key file from the asl-identity secret; requires hsmProxyAddr.
  asl_hsm_key: null
  #
  #aslRootCA: "GEM.RCA7 TEST-ONLY"
  #
  # specify an override OCSP URL to use instead of certificate default, or "off" to disable stapling
  # aslOcsp: "http://example.org/ocsp"
  #
  # change maximum validity of cached OCSP responses (default 24h per A_24624-01)
  # aslOcspTtl: 5m
  #
  nginxConf:
    configMapName: pep-nginx-conf
    generateConfigMap: false

    httpClientAcceptInvalidCerts: false

    # enables ASL test mode. This will practically disable encryption! NEVER USE IN PRODUCTION!
    aslTestmode: false

    # enable (true) or disable (false) no-travel enforcement
    noTravel: true

    # fachdienstUrl defines a variable that could be referenced in the `locations`
    # to avoid repeating the upstream URL. Irrelevant when using `proxyLocations`.
    fachdienstUrl: ""

    # JWKS issuer for PoPP key validation.
    # If set, all locations default to `pep_require_popp on;`.
    # Set to null to disable PoPP.
    poppIssuer: null

    # quarter: within the current quarter (see gemSpec_ZETA — A_26477)
    # duration string: fixed validity period, since iat + optional unit (d,h,m,s); e.g. "1d"
    #                  defaults to s if no unit given.
    poppValidity: quarter

    # OIDC issuer (iss) of the authorization server (e.g., zeta-guard-realm).
    # Always the public issuer: it is the `iss` the PEP expects in access tokens.
    pepIssuer: ""

    # Cluster-internal address of the authserver, used *only* to fetch the OIDC
    # discovery document and the JWKS. The chart always deploys the authserver as
    # the `authserver` Service — the same address `pep_revocation_url` already
    # uses. pepIssuer stays the expected `iss`; only
    # the network path changes.
    # Without it both fetches follow the public pepIssuer and leave the cluster
    # through the ingress (A_27864-01 egress then needs the ingress IP allowed).
    # Must mirror the issuer's path structure, e.g.
    #   pepIssuer:       https://<public-host>/auth/realms/zeta-guard
    #   pepInternalUrl:  http://authserver/auth/realms/zeta-guard
    # Off by default. Needs a PEP image >= 2.0.0-rc1; older images do not know
    # `pep_pdp_url` and refuse to start on it.
    pepInternalUrl: ""

    # Session revocation endpoint of the authserver (SSE block list and reports).
    # Empty = <pepInternalUrl>/zeta-guard-revocation, or
    # http://authserver/auth/realms/zeta-guard/zeta-guard-revocation when
    # pepInternalUrl is unset. Set only when the authserver is reachable under
    # another address or realm path.
    pepRevocationUrl: ""

    # requiredAudience defines the audience required for a valid access token.
    requiredAudience: ""

    # requiredScopes defines scopes required for a valid access token.
    requiredScopes: [ ]
    # DEPRECATED in favor of `proxyLocations` below — raw nginx `location`
    # blocks (with `proxy_pass`) for the resource server. Scheduled for removal
    # once all stages have migrated; do not mix both worlds for the same path.
    # The PEP header handling (`include proxy_headers.conf;` — strips client-supplied
    # credentials and ZETA-* headers, sets the PEP's own headers + Forwarded) is included
    # once at the `server` level, so plain `proxy_pass` locations inherit it automatically.
    # nginx `proxy_set_header` inheritance is non-additive: a location that declares its own
    # `proxy_set_header` (e.g. a WebSocket upgrade) does NOT inherit it and must repeat
    # `include proxy_headers.conf;` itself — otherwise a `pep on;` location returns HTTP 500
    # (ProxyHeadersMissing). `proxyLocations` generates all of this correctly.
    locations: ""

    # Structured alternative to `locations` for proxied resource-server paths —
    # prefer this; it generates the correct nginx config so the footguns
    # (credential-strip clobbering, missing upstream keepalive, hop-by-hop WebSocket
    # headers) cannot happen.
    # Each entry renders an http-level `upstream` block (connection keepalive)
    # plus an exact + trailing-slash location pair, always including
    # proxy_headers.conf. `websocket: true` entries additionally get routed
    # via a dedicated ingress WebSocket minion, which restores upstream
    # keepalive on all other ingress locations (see templates/ingress-ws.yaml).
    # The deprecated raw `locations` string renders after these.
    #
    # proxyLocations:
    #   - path: /pep                        # public path; no trailing slash
    #     upstream: http://fachdienst:8080  # scheme://host[:port] — no path here; port defaults to 80/443 per scheme
    #     upstreamPath: /                   # optional URI prefix on the upstream (default /)
    #     websocket: false                  # WebSocket upgrade handling (+ ingress ws routing)
    #     bypassAsl: false                  # satisfy all/allow all — public without ASL, mind your spec!
    #     keepalive: 32                     # optional; idle upstream conns kept per worker
    #     extraConfig: |                    # optional; tpl-rendered, appended inside both blocks
    #       proxy_ssl_verify on;
    proxyLocations: [ ]
  # set to gRPC URL of HSM Proxy to enable ossl_hsm integration
  hsmProxyAddr: null
  # HSM key ID for the TLS listener ("store:hsm:<hsmTlsKeyId>")
  hsmTlsKeyId: tls.p256
  # certificate matching the HSM TLS key, relative to /etc/nginx; the default is
  # baked into the PEP image — mount your own via extraVolumeMounts
  hsmTlsCert: tls.p256.pem

  # NOTE: keep in-sync with nginx-ingress' http-snippets
  tlsConfig: |
    # AFOs: GS-A_5035, GS-A_4387, A_18464, GS-A_4385, A_18467
    ssl_protocols TLSv1.3 TLSv1.2;
    # AFOs: A_17322, A_21275-01, A_17124-03, GS-A_5016; (GS-A_4384-03 omitted)
    # tls 1.2
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:@SECLEVEL=3;
    # tls 1.3
    ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256;
    # AFOs: GS-A_4359-02, GS-A_4357-02
    ssl_ecdh_curve secp384r1:prime256v1:brainpoolP512r1:brainpoolP384r1:brainpoolP256r1;
    # GS-A_5322: a server using RFC-5077 tickets MUST rotate the STEK <= 48h
    # (+ BSI-TR-03116-1 algo, GS-A_4368 entropy). nginx's auto-generated STEK
    # gives no such guarantee, so disable tickets rather than manage a rotated
    # key file. Resumption is preserved via the server-side cache (session-ID for
    # 1.2, stateful PSK for 1.3); ssl_session_timeout << 24h also satisfies the
    # GS-A_5322 key-deletion bound.
    ssl_session_tickets off;
    ssl_session_cache   shared:SSL:10m; # 10 megabytes, not minutes — good for ~40k sessions
    ssl_session_timeout 10m;
    # A_26964
    # ssl_certificate should include intermediates, or issuer should be present in ssl_trusted_certificate.
    # Additionally, a resolver should be set to resolve the responder.
    # If certs don't have OCSP AIA (e.g. LetsEncrypt), this is a no-op.
    ssl_stapling on;
    ssl_stapling_verify on;
    # AFOs: A_17775 - use client order
    ssl_prefer_server_ciphers off; # default
  # podAnnotations is for setting additional Kubernetes Annotations to a Pod.
  podAnnotations: {}
  affinity: {}
  tolerations: []
  # Optional extra volumes
  # can be used to mount client certificate used by nginx when proxying to the fachdienst
  # over mTLS. Mount a client certificate/key trusted by the fachdienst and,
  # the CA chain used to verify the fachdienst certificate.
  extraVolumes: []
  extraVolumeMounts: []

# pepproxyMetricsEnabled enables the metrics endpoint for Keycloak
pepproxyMetricsEnabled: false

# pepproxyMetricsExporterImage is required if pepproxyMetricsEnabled is true
pepproxyMetricsExporterImage: nginx/nginx-prometheus-exporter:1.5.3@sha256:85666e7fde7e253f1c6d978f9a961245df4c9cdb7677e1866d9bb28e8f9ee41d

# pepproxyTracingEnabled enables tracing for nginx
pepproxyTracingEnabled: true

# When true, the ingress routes traffic to the tiger-proxy service
# instead of directly exposing internal services.
routeViaTigerProxy: false

# When enabled, injects a changing annotation to force pod rollouts
# on each helm upgrade/apply even if image tag is unchanged.
devMode: false

# DB mode switch:
# - cloudnative: managed by CloudNativePG operator
# - external: use external db by providing values authserverDb.kcDb, authserverDb.kcDbUrl, authserverDb.kcDbSchema,
#       authserverDb.kcDbSecretName
#       The db username and password are pulled from the respective field of a secret going by the provided name.
#       The other properties behave according to the keycloak environment variables.
#       See https://www.keycloak.org/server/db
authserverDb:
  kcDb: postgres
databaseMode: cloudnative
# CloudNativePG DB connection settings used when databaseMode=cloudnative.
cloudnativeDbUrl: "jdbc:postgresql://keycloak-db-rw:5432/keycloak"
cloudnativeDbSecretName: "keycloak-db-app"
cloudnativeDbSchema: "public"

# CloudNativePG settings used when databaseMode=cloudnative.
# WARNING: instances=1 is only suitable for development/test environments.
# For production use instances >= 3 to avoid a single point of failure.
cloudnativePg:
  instances: 1
  # Additional postgresql.conf parameters, rendered verbatim into the CNPG
  # Cluster (snake_case keys, string values). Example:
  #   extraParameters:
  #     log_min_duration_statement: "200"   # log statements slower than 200ms
  #     track_io_timing: "on"
  #     pg_stat_statements.track: top
  extraParameters:
    # optional: Give WAL headroom so checkpoints are paced by the timer, not
    # by pressure.
    # NOTE: max_wal_size is a SOFT cap and by default WAL shares the 10Gi data volume —
    # raise only together with more disk / a dedicated walStorage
    # max_wal_size: "2GB"
    # min_wal_size: "1GB"
    # checkpoint_timeout: "900"
    # full_page_writes after each checkpoint balloon WAL (~3x observed);
    # compression costs spare CPU and cuts checkpoint frequency and disk
    # write volume alike
    wal_compression: "on"
  # Libraries for CNPG's spec.postgresql.shared_preload_libraries. CNPG-managed
  # extensions (e.g. pg_stat_statements) are auto-CREATEd by the operator.
  # Example:
  # sharedPreloadLibraries: [pg_stat_statements]
  # NOTE: changes here trigger a postgres restart.
  sharedPreloadLibraries: []
  # Anchored (&keycloakDbImage) so keycloak-db.cluster.imageName below stays in lockstep —
  # the two are otherwise-independent config surfaces (see keycloak-db comment) and a plain
  # copy would silently drift on the next image bump.
  imageName: &keycloakDbImage europe-west3-docker.pkg.dev/gematik-pt-zeta-prod/zeta-dcr/postgres:17.11-standard-trixie
  imagePullPolicy: ""
  resources:
    requests:
      cpu: "2"
      memory: 2Gi
    limits:
      # No cpu limit: avoids CFS throttling; cpu.request is the floor, DB can burst.
      memory: 3Gi
  # empty → CNPG default
  affinity: {}
  # CNPG-native monitoring. The operator creates a PodMonitor when enablePodMonitor is true; requires the Prometheus Operator CRD in the cluster.
  # Empty → no PodMonitor.
  monitoring: {}
  # enablePDB: leave unset for the CNPG default; set false on single-instance stages
  storage:
    size: 10Gi
    # storageClass shortcut; empty → cluster default StorageClass
    storageClass: ""
    # Per-env PVC template (e.g. a specific storageClassName); empty → CNPG default
    pvcTemplate: {}
  # Optional dedicated volume for the write-ahead log (pg_wal). Empty → WAL
  # lives on the data volume above (CNPG default). Set size (and optionally
  # storageClass/pvcTemplate) to split WAL onto its own disk so WAL fsync does
  # not contend with checkpoint flushes — recommended for write-heavy stages.
  # Example:
  #   walStorage:
  #     size: 16Gi
  #     storageClass: managed-csi-premium
  walStorage: {}
  parameters:
    # rule of thumb: ~25% of memory
    sharedBuffers: 512MB
    maxConnections: 250
  # Connection pooler
  pooler:
    enabled: false
    # type: rw
    # instances: 1
    # poolMode: session
    # parameters: {}
    # template: {} # pod template overrides (affinity, resources, ...)
  # Continuous backup; disabled by default.
  # When enabling, provide backup.barmanObjectStore + a ScheduledBackup schedule and the required credentials secret out-of-band.
  backup:
    enabled: false
    # retentionPolicy: "30d"
    # schedule: "0 0 2 * * *" # 6-field CNPG cron (leading seconds)
    # method: barmanObjectStore
    # barmanObjectStore: {} # destinationPath, endpointURL, credentials, wal, data

# Which cert-manager namespace-scoped Issuer to use for TLS on the Ingress.
# If set, it takes precedence over clusterIssuer (emits cert-manager.io/issuer).
issuer: ""

# Which cert-manager ClusterIssuer to use for TLS on the Ingress (default).
clusterIssuer: ""

# One-shot post-install/post-upgrade hook Job that adopts pre-existing
# ingress-shim-created Certificates (zeta-guard-tls / zeta-guard-admin-tls)
# into the helm release — only rendered while such a foreign Certificate
# exists (see templates/certificate-adopt-hook.yaml). The next helm operation
# after adoption renders and manages the Certificate normally.
certificateAdoption:
  # needs kubectl + bash; same default as the token-renewer worker image
  image: google/cloud-sdk:549.0.0
  # Overrides on top of defaultContainerSecurityContext. Writable root
  # filesystem: kubectl caches discovery data under $HOME.
  containerSecurityContext:
    readOnlyRootFilesystem: false

# If gematikConnectionEnabled is true, the CronJob ti-sim-token-renewer-cronjob is deployed and will maintain a valid access token in the Secret ti-sim-token
gematikConnectionEnabled: true

gematik:
  tiSiem:
    # serviceAccountEmailAddress refers to a Google service account to be impersonated
    serviceAccountEmailAddress: ""
    # idTokenAudience is the audience claim used in generateIdToken (ti-sim-token-renewer-cronjob).
    # Typically, the OAuth 2.0 Client ID of the IAP-protected BDE data receiver.
    idTokenAudience: "833409780574-lilt6qf6lli28r16b72q3p8epefop2gr.apps.googleusercontent.com"

  tiSim:
    # serviceAccountEmailAddress refers to a Google service account to be impersonated
    serviceAccountEmailAddress: ""
    # idTokenAudience is the audience claim used in generateIdToken (ti-sim-token-renewer-cronjob).
    # Typically, the OAuth 2.0 Client ID of the IAP-protected BDE data receiver.
    idTokenAudience: "833409780574-lilt6qf6lli28r16b72q3p8epefop2gr.apps.googleusercontent.com"

  # workloadIdentityFederation contains configuration for Google Workload Identity Federation
  workloadIdentityFederation:
    # The project number of the project that contains the workload identity pool
    projectNumber: ""
    # The ID of the workload identity pool
    poolId: ""
    # The ID of the workload identity pool provider
    workloadIdentityProvider: ""

# IngressClass used by the generated Ingress.
# - With the bundled NIC: keep equal to nginx-ingress.controller.ingressClass.name.
# - With an external controller: disable the bundled NIC and set this to your class (e.g., gce, openshift-default).
ingressClassName: "nginx"

# If ingressEnabled is true, Ingresses are deployed.
ingressEnabled: true
ingressMasterAnnotations: { }
ingressMinionAnnotations:
  # setting default rate limit to comply with A_26668-02, please change these settings according to your installation
  nginx.org/limit-req-rate: "20r/s"
  nginx.org/limit-req-key: "${binary_remote_addr}"
  nginx.org/limit-req-zone-size: "10m"

# Render F5-NIC-specific annotations on the Ingresses. Does NOT install the NIC —
# that is `nginx-ingress.enabled`. Set false for non-F5 ingress controllers.
# TODO: misleading name — rename to something like nginxIngressAnnotations (in extra branch).
nginxIngressEnabled: true
# When true, disable spec.tls of the master ingress to enable custom TLS configuration via ingressMasterAnnotations.\"nginx.org/server-snippets\", as required for ossl_hsm support
nginxIngressHsm: false
# When true, add the cookie-based sticky-session lb-method on the minion ingress.
# Needs the NIC to provide the $zeta_route http-snippets (the bundled subchart ships
# them; external NICs must add them). Disable where the NIC lacks them.
nginxIngressLbMethod: true

# Upstream cloudnative-pg/cluster chart for keycloak-db (see Chart.yaml dependencies).
# Disabled by default: templates/db/cnpg-cluster.yaml stays authoritative until this is
# explicitly enabled. Once enabled, this replaces the cloudnativePg.* block entirely for
# keycloak-db (the two are not merged).
keycloak-db:
  enabled: false
  # Pins the Cluster/Service/Secret names to "keycloak-db", so authserver's connection
  # string, the egress NetworkPolicy, and the Istio PeerAuthentication (all of which
  # select on the Cluster name) keep working unchanged.
  fullnameOverride: keycloak-db
  cluster:
    instances: 1
    imageName: *keycloakDbImage
    imagePullPolicy: IfNotPresent
    # Off, unlike the chart default: the operator's own service accounts are enough for
    # normal operation. Turning it on would create a superuser Secret we don't need.
    enableSuperuserAccess: false
    # enablePDB: leave unset for the upstream chart's default (true); set false per
    # stage on single-instance clusters where a PDB would block node drains.
    storage:
      size: 10Gi
    resources:
      requests:
        cpu: "2"
        memory: 2Gi
      limits:
        # No cpu limit: avoids CFS throttling; cpu.request is the floor, DB can burst.
        memory: 3Gi
    postgresql:
      parameters:
        shared_buffers: 512MB
        max_connections: "250"
    initdb:
      database: keycloak
      owner: zeta-guard
    # Nested under cluster, not top-level — the upstream chart only reads
    # cluster.monitoring.*; a top-level monitoring: block is silently ignored.
    monitoring:
      enabled: false
      # Upstream default (true) renders a ConfigMap of pg_stat_subscription metrics
      # for logical-replication monitoring; keycloak-db has no subscriptions, so it
      # would just be dead config.
      instrumentation:
        logicalReplication: false
  poolers: []
  backups:
    enabled: false

nginx-ingress:
  # Whether to install the bundled F5 NIC subchart. Set to false on stages where
  # NIC is installed cluster-wide out-of-band (e.g. qs on GKE). When false, the
  # F5-NIC-specific annotations on Ingresses still render (gated by
  # `nginxIngressEnabled`), so the chart works with an externally-installed NIC.
  enabled: true
  controller:
    # DaemonSet rather than Deployment, because `service.externalTrafficPolicy:
    # Local` (below) only routes to nodes that host a controller pod: with a
    # single-replica Deployment exactly one node is a valid load-balancer target,
    # so every reschedule costs load-balancer probe convergence on top of pod
    # startup. One pod per node keeps a healthy target everywhere and avoids the
    # extra node-to-node hop.
    kind: daemonset
    # Upstream latency histograms (nginx_ingress_controller_upstream_server_
    # response_latency_ms*) on the prometheus endpoint (:9113)
    enableLatencyMetrics: true
    readOnlyRootFilesystem: true
    # NIC v5.4.0+ uses /tmp for thread-local temp files
    volumes:
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: tmp
        mountPath: /tmp
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
      sysctls:
        # NIC upstream connections park their ephemeral port in TIME_WAIT
        # for 60s when closed — sustained connect/close churn needs
        # ~rate × 60 free ports. Widen the range to raise that ceiling.
        # "Safe" sysctl: https://kubernetes.io/docs/tasks/administer-cluster/sysctl-cluster/#safe-and-unsafe-sysctls
        - name: net.ipv4.ip_local_port_range
          value: "10240 65535"
    # We use standard Kubernetes Ingress; disable NIC CRDs to avoid CRD install requirement
    enableCustomResources: false
    ingressClass:
      name: nginx
    image:
      repository: "europe-west3-docker.pkg.dev/gematik-pt-zeta-prod/zeta-dcr/nginx-ingress"
      tag: 2.0.0
    service:
      # Default for standalone/cloud installs.
      type: LoadBalancer
      externalTrafficPolicy: Local # preserve client ips
    pod:
      annotations:
        # Bump on HSM/TLS-related config changes to force a NIC pod restart —
        # nginx -s reload does not re-init OpenSSL providers (e.g. ossl_hsm).
        config-rev: "2026-04-29-ecdsa-strict"
    enableSnippets: true
    config:
      entries:
        # default NIC log format extended with request/upstream timing info
        # (mirrors the PEP proxy's log_format)
        log-format: >-
          $remote_addr - $remote_user [$time_local] "$request"
          $status $body_bytes_sent ${request_time}s
          (${upstream_connect_time},${upstream_header_time},${upstream_response_time})
          "$http_referer" "$http_user_agent" "$http_x_forwarded_for"
        # impl. nginx.org/lb-method: "hash $zeta_route consistent"
        main-snippets: |
          # see https://github.com/openresty/headers-more-nginx-module
          load_module modules/ngx_http_headers_more_filter_module.so;

        # NOTE: keep ssl_* in-sync with pepproxy's tlsConfig
        http-snippets: |
          # Clear client-supplied forwarding / client-address headers at the
          # edge, so that only this ingress decides what the client address is.
          #
          # Why this is required: the ingress overwrites X-Real-IP and
          # X-Forwarded-{Host,Port,Proto} with its own values, but it never sets
          # `Forwarded` (RFC 7239) at all, and its X-Forwarded-For is built with
          # $proxy_add_x_forwarded_for, which *appends* to whatever the client
          # sent. Both are therefore attacker-controlled unless the incoming
          # headers are cleared here: clearing the input makes
          # $proxy_add_x_forwarded_for collapse to $remote_addr.
          #
          # This matters because the authorization server derives the client
          # address claim of the access token from these headers, and the PEP
          # then enforces that the claim matches the address of each request. A
          # client that can inject a forwarding header can pick its own address
          # and defeat that check.
          #
          # NOTE: this only yields a *true* client address if $remote_addr is
          # the client — see `service.externalTrafficPolicy` below, and use
          # set-real-ip-from/real-ip-header if a trusted proxy fronts this
          # ingress.
          #
          # If you REMOVE a header from this list because you need to trust a
          # reverse proxy in front of this ingress, then you are responsible for
          # stripping the incoming forwarding headers *at that proxy*. Otherwise
          # clients can spoof their address again.
          more_clear_input_headers
              # RFC 7239 and the de-facto X-Forwarded-* family
              "Forwarded"
              "X-Forwarded-For"
              "X-Forwarded-Host"
              "X-Forwarded-Port"
              "X-Forwarded-Proto"
              "X-Forwarded-Scheme"
              "X-Forwarded-Server"
              "X-Forwarded-Ssl"
              "X-Original-Forwarded-For"
              # single-value client-address variants used by proxies and CDNs
              "X-Real-IP"
              "Client-IP"
              "X-Client-IP"
              "X-Cluster-Client-IP"
              "True-Client-IP"
              "CF-Connecting-IP"
              "CF-Connecting-IPv6"
              "CF-Pseudo-IPv4"
              "Fastly-Client-IP"
              "Fly-Client-IP"
              "X-Azure-ClientIP"
              "X-Azure-SocketIP"
              "X-ProxyUser-Ip"
              # service-mesh sidecars, when traffic can reach the ingress through one
              "X-Envoy-External-Address"
              "X-Envoy-Internal"
              # proxy chain metadata; not an address, but nothing downstream should trust it
              "Via"
              # client certificate of a resource server; only the ingress itself may set it (ingress-auth.yaml)
              "ssl-client-cert";

          map $cookie_zeta_route $zeta_route {
              ""      $request_id;
              default $cookie_zeta_route;
          }
          map $cookie_zeta_route $zeta_route_setcookie {
              ""      "zeta_route=$zeta_route; path=/";
              default ""; # no-op when empty
          }

          # add_header directives don't inherit as you'd expect: using add_header for
          # *any* header invalidates all add_headers set by parent locations.
          # -a for appending; don't override cookies set by upstream (or elsewhere in
          # nginx config).
          more_set_headers -a "Set-Cookie: $zeta_route_setcookie";

          # AFOs: GS-A_5035, GS-A_4387, A_18464, GS-A_4385, A_18467
          ssl_protocols TLSv1.3 TLSv1.2;
          # AFOs: A_17322, A_21275-01, A_17124-03, GS-A_5016; (GS-A_4384-03 omitted)
          # tls 1.2
          ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:@SECLEVEL=3;
          # tls 1.3
          ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256;
          # AFOs: GS-A_4359-02, GS-A_4357-02
          ssl_ecdh_curve secp384r1:prime256v1:brainpoolP512r1:brainpoolP384r1:brainpoolP256r1;
          # GS-A_5322: a server using RFC-5077 tickets MUST rotate the STEK <= 48h
          # (+ BSI-TR-03116-1 algo, GS-A_4368 entropy). nginx's auto-generated STEK
          # gives no such guarantee, so disable tickets rather than manage a rotated
          # key file. Resumption is preserved via the server-side cache (session-ID for
          # 1.2, stateful PSK for 1.3); ssl_session_timeout << 24h also satisfies the
          # GS-A_5322 key-deletion bound.
          ssl_session_tickets off;
          ssl_session_cache   shared:SSL:10m; # 10 megabytes, not minutes — good for ~40k sessions
          ssl_session_timeout 10m;
          # A_26964
          # ssl_certificate should include intermediates, or issuer should be present in ssl_trusted_certificate.
          # Additionally, a resolver should be set to resolve the responder.
          # If certs don't have OCSP AIA (e.g. LetsEncrypt), this is a no-op.
          ssl_stapling on;
          ssl_stapling_verify on;
          # AFOs: A_17775 - use client order
          ssl_prefer_server_ciphers off; # default

        keepalive-requests: "10000"
        # UPSTREAM keepalive (NIC -> backends): without it every proxied
        # request opens a fresh upstream connection, and each closed one
        # parks an ephemeral port in TIME_WAIT for 60s — the NIC pod runs
        # out of ports around ~1000 rps (observed: connect() to pep failed
        # (99: Cannot assign requested address)). Idle conns cached per
        # worker; NIC adds the required proxy_http_version/Connection ""
        # plumbing itself.
        keepalive: "32"
        worker-connections: "16384"
        # per worker process; must cover ~2x worker_connections (client + upstream
        # side of each proxied connection) or nginx clamps below worker_connections
        worker-rlimit-nofile: "40960"
    resources:
      limits:
        memory: "2Gi"
      requests:
        memory: "1Gi"
opa:
  # opa.podLabels is a map of labels to add to the opa pod.
  podLabels: {}
  replicaCount: 1
  serviceAccountName: ""
  image:
    repository: opa
    tag: 1.21.3-static
  imagePullPolicy: IfNotPresent
  imagePullSecrets: [ ]
  # --- Pod security context (opa / opa-simulation) ---
  # Overrides on top of defaultPodSecurityContext.
  podSecurityContext: {}
  # --- Container security context (opa / opa-simulation main container) ---
  # Overrides on top of defaultContainerSecurityContext.
  containerSecurityContext: {}
  # --- CronJob security context (opa-token-renewer, ti-sim-token-renewer,
  # ti-siem-token-renewer) ---
  # Overrides on top of defaultContainerSecurityContext, whose runAsUser is
  # required for workloadIdentityFederation.worker.image (google/cloud-sdk runs
  # as root by default).
  cronjobSecurityContext:
    readOnlyRootFilesystem: false
  # Set OPA server log level: debug|info|warn|error (default: info)
  logLevel: info
  # If enabled, OPA will log decision logs to console.
  logDecisions: false
  # Remote decision-log upload interval in seconds, shared by active and simulation OPA.
  # Applies when telemetryGatewayEnabled is true; independent of bundle polling.
  decisionLogs:
    reporting:
      min_delay_seconds: 60
      max_delay_seconds: 60
  # If enabled, OPA will log status updates to console.
  logStatusUpdates: false
  # If enabled (and bundle mode is on), the readiness probe uses /health?bundles=true, so
  # the pod only becomes Ready once a bundle has been downloaded and activated. During a
  # rolling update the previous pod keeps serving (the rollout stalls instead), but a
  # freshly scheduled pod — node drain, restart — stays NotReady while the registry is
  # unreachable, which takes OPA out of service at replicaCount 1. Off by default.
  bundleHealthCheck: false
  # Bundle mode (enabled by default) — inline policyRego is used when disabled
  bundle:
    enabled: true
    # Logical service name used in OPA config (e.g., 'gitlab-registry' or 'local-proxy')
    serviceName: registry
    # Base URL of registry
    url: https://europe-west3-docker.pkg.dev
    # fully qualified resource (including the registry host)
    resource: europe-west3-docker.pkg.dev/gematik-pt-zeta-test/zeta-policies-dev/testfachdienst-policy:latest
    credentials:
      # Reference a Secret containing registry bearer credentials.
      secretRef:
        # Name of the Secret in the release namespace that holds credentials
        name: ""
    polling:
      min_delay_seconds: 60
      max_delay_seconds: 60
    # Signature verification for OPA bundles
    verification:
      enabled: true
      # set in env-specific values
      keyId: ""
      algorithm: ""
      # Optional: must match the scope embedded in the bundle signature. Omit if bundle was signed without a scope.
      scope: ""
  simulation:
    enabled: true
    replicaCount: 1
    bundle:
      # Fully qualified simulation bundle resource (including the registry host). Required
      # when bundle.enabled and simulation.enabled are true; it is not derived from
      # opa.bundle.resource — gematik names simulation bundles differently per environment.
      # Where gematik publishes a simulation bundle, use it here, never the production policies.
      resource: ""
      # Optional signature verification override for the simulation bundle (same keys as
      # opa.bundle.verification). If empty, the shared opa.bundle.verification applies.
      verification: { }
  # Workload Identity Federation (AKS → GCP STS) for GAR access
  workloadIdentityFederation:
    enabled: false
    sts:
      # GPC service-account (email format)
      sa: ""

    tokenRenewer:
      enabled: true
      # Default schedule: refresh every 45 minutes
      # Immediately get token: kubectl -n NAMESPACE create job token-renewer-once --from=cronjob/opa-token-renewer-cronjob
      schedule: "*/45 * * * *"
      # Number of retries for failed Jobs spawned by the CronJob
      backoffLimit: 5

    # opa.workloadIdentityFederation.worker is required if opa.workloadIdentityFederation.enabled is true
    worker:
      image: google/cloud-sdk:549.0.0
      imagePullPolicy: IfNotPresent
      imagePullSecrets: [ ]
      resources:
        limits:
          memory: "200Mi"
        requests:
          cpu: "50m"
          memory: "50Mi"

  # Periodically restart the opa (and, if enabled, opa-simulation) Deployment via
  # `kubectl rollout restart`. Disabled by default — no impact unless explicitly
  # enabled per stage.
  rolloutRestart:
    enabled: false
    # Leave empty (default) to let the chart create its own ServiceAccount + minimal
    # RBAC (get/patch on just the opa/opa-simulation Deployments) — see
    # opa-rollout-restart-serviceaccount.yaml and opa-rollout-restart-rbac.yaml. Set
    # to use an externally pre-provisioned ServiceAccount instead — the chart then
    # creates no RBAC of its own and expects the given ServiceAccount to already
    # have equivalent get/patch rights.
    serviceAccountName: ""
    # Default: daily at 3am, Europe/Berlin (see spec.timeZone in the CronJob template)
    schedule: "0 3 * * *"
    backoffLimit: 5
    # kubectl (~55 MB binary) + heap must fit, else the kernel thrashes its code pages from disk instead of OOM-killing
    resources:
      limits:
        memory: "256Mi"
      requests:
        cpu: "10m"
        memory: "64Mi"
    # Reuses provisioningProcessor.image (now includes kubectl) and
    # provisioningProcessor.containerSecurityContext, rather than a separate,
    # generic CI tooling image that runs as root and isn't part of any vulnerability scan.

  # --- Example: Workload Identity Federation (WIF) ---
  #
  # WIF mode (AKS → GCP STS → GAR). STS/IAM endpoints and scope are fixed in the
  # token-renewer CronJob; the STS audience is derived from
  # gematik.workloadIdentityFederation.{projectNumber,poolId,workloadIdentityProvider}.
  # serviceAccountName: opa
  # bundle:
  #   enabled: true
  #   serviceName: gar
  #   url: https://<region>-docker.pkg.dev
  #   resource: <region>-docker.pkg.dev/<PROJECT_ID>/<REPO>/<IMAGE>:<TAG>
  #   credentials:
  #     secretRef:
  #       name: ""   # keep empty in WIF mode
  #    verification:
  #      enabled: true
  #      keyId: zeta_artifact_reg
  #      algorithm: ES256
  # workloadIdentityFederation:
  #   enabled: true
  #   sts:
  #     sa: ""   # Google service account email to impersonate
  #   tokenRenewer:
  #     schedule: "*/45 * * * *"
  #
  # --- Examples: GitLab/Basic mode (deploy-token) ---
  # bundle:
  #   enabled: true
  #   serviceName: gitlab
  #   url: https://registry.example.com:443
  #   resource: registry.example.com/group/project/policy-bundle:latest
  #   credentials:
  #     secretRef:
  #       name: opa-bearer   # Secret with token='USERNAME:PASSWORD', scheme='Basic'
  health:
    liveness:
      periodSeconds: 20
    readiness:
      periodSeconds: 20
  resources:
    limits:
      memory: "1Gi"
    requests:
      cpu: "100m"
      memory: "200Mi"
  # podAnnotations is for setting additional Kubernetes Annotations to a Pod.
  podAnnotations: {}
  affinity: {}
  tolerations: []

notificationService:
  # Deploy the bundled notification-service (and its PEP location block, see
  # pep/_pep-nginx-conf.tpl). Off by default; enable per-stage.
  enabled: false
  # notificationService.podLabels is a map of labels to add to the notification-service pod.
  podLabels: {}
  replicaCount: 1
  serviceAccountName: ""
  # One image repo, two variants by tag suffix: "-rs" (RS-facing) and "-fdv"
  # (FdV-facing). Both are deployed and share one Postgres DB; repo/tag prefix
  # are shared, the chart appends "-<variant>" per variant.
  image:
    repository: notification-service
    # Tag prefix; "-rs"/"-fdv" appended per variant (e.g. main -> main-rs/main-fdv).
    tag: 2.0.1
  # Optional per-variant pins (rs/fdv differ). A per-variant image.tag replaces
  # the shared tag verbatim (no "-<variant>" appended); a digest is appended as
  # "@<digest>". Empty -> shared image.tag + "-<variant>".
  rs:
    image:
      digest: ""
    mtls:
      # Application-level client-certificate authentication for the RS API.
      enabled: true
  fdv:
    image:
      digest: ""
  imagePullPolicy: Always
  imagePullSecrets: [ ]
  # Overrides on top of defaultPodSecurityContext.
  podSecurityContext: {}
  # Overrides on top of defaultContainerSecurityContext. The root filesystem
  # stays read-only — /tmp is a writable emptyDir (see _notification-service.tpl).
  containerSecurityContext: {}
  # Postgres persistence (both variants connect to the same database).
  db:
    # mode: cloudnative -> provision a dedicated CNPG Cluster (see cloudnativePg
    # below); external -> point jdbcUrl/secretName at an out-of-band database.
    mode: cloudnative
    # Database kind (notification.datasource.db-kind): postgresql, mariadb, mysql,
    # mssql or oracle. cloudnative mode (CNPG) requires postgresql.
    kind: postgresql
    # CNPG Cluster name (cloudnative mode). Single source of truth: -rw/-app
    # resources, NetworkPolicy/PeerAuthentication selectors, and the derived
    # jdbcUrl/secretName/waitForDb.host all follow it.
    clusterName: "notification-db"
    # JDBC URL. Empty in cloudnative mode -> "jdbc:postgresql://<clusterName>-rw:5432/notification".
    # Set explicitly for an external DB.
    jdbcUrl: ""
    # Secret with datasource username/password. Empty in cloudnative mode ->
    # "<clusterName>-app". Set explicitly for an external DB.
    secretName: ""
    # Init container that blocks pod startup until Postgres accepts TCP, so
    # Flyway doesn't crash-loop while the DB comes up. Mirrors push-gateway's
    # wait-for-dependencies.
    waitForDb:
      enabled: true
      # busybox provides `nc` for the TCP check.
      image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
      imagePullPolicy: IfNotPresent
      # DB host/port to probe. Empty host -> "<clusterName>-rw". Set for external DB.
      host: ""
      port: 5432
      # Seconds between connection attempts.
      intervalSeconds: 2
      resources:
        requests:
          cpu: "10m"
          memory: 16Mi
        limits:
          memory: 32Mi
    # CNPG Cluster settings (mode=cloudnative). Plain Postgres — no pg_cron
    # (record purging is in-app).
    cloudnativePg:
      instances: 1
      imageName: europe-west3-docker.pkg.dev/gematik-pt-zeta-prod/zeta-dcr/postgres:17.11-standard-trixie
      imagePullPolicy: ""
      # enablePDB: leave unset for the CNPG default; set false on single-instance stages
      storage:
        size: 2Gi
        storageClass: ""
        pvcTemplate: {}
      # Optional dedicated pg_wal volume (empty -> WAL on the data volume).
      walStorage: {}
      resources:
        requests:
          cpu: "500m"
          memory: 512Mi
        limits:
          memory: 1Gi
      parameters:
        sharedBuffers: 128MB
        maxConnections: 100
      # Additional postgresql.conf parameters (snake_case keys, string values).
      extraParameters: {}
      affinity: {}
      # CNPG-native monitoring (empty -> no PodMonitor).
      monitoring: {}
      backup:
        enabled: false
        # retentionPolicy: "30d"
        # barmanObjectStore: {}
  env:
    # Allowlist of Push Gateway base URLs (-> push-gateway.allowed-base-urls).
    # No default; empty fails startup validation — set at least one.
    pushGatewayAllowedBaseUrls: []
    # Allowed notification channels (notification.channels.allowed), comma-separated.
    # No default — set at least one.
    channelsAllowed: ""
    # Encrypt push notification payloads when dispatching them
    # (notification.encryption.enabled).
    encryptionEnabled: false
  # gRPC HSM Proxy backing the at-rest sealing configured below. Every key is
  # optional: each env var is emitted only when its value is set, so an unset
  # value leaves the service's own default in force.
  hsm:
    # HSM_PROXY_ENDPOINT - host:port of the HSM Proxy, e.g. "hsm-sim:50051".
    endpoint: ""
    # HSM_PROXY_PLAIN_TEXT_ACCEPTED - accept an unprotected (plain-text gRPC)
    # channel to the HSM Proxy. The HSM proxy client currently speaks plain-text
    # gRPC only (mTLS per A_28830 is deferred), so with sealing enabled the
    # service refuses to start unless this is true. Set it only where the network
    # itself protects the channel, e.g. hsm-sim in a local cluster.
    # Unset -> the service's default.
    plainTextAccepted: null
  # HSM-backed at-rest sealing of stored notification data. Requires hsm.endpoint.
  # The keys come from the keychain file keychainFileName, on a volume of your
  # choice (extraVolumes, mounted via extraVolumeMounts and
  # keychainGenerator.extraVolumeMounts), e.g. a Secret holding the keychain. The
  # init containers run in this order: initContainerProvideKeys (optional),
  # keychain-generator (creates a keychain only if there is none yet),
  # initContainerStoreKeys (optional). Both variants (rs, fdv) and all replicas
  # must use the same keychain.
  sealing:
    # NOTIFICATION_PERSISTENCE_SEALING_ENABLED. Always emitted; default false.
    enabled: false
    # Absolute path of the keychain file (NOTIFICATION_PERSISTENCE_SEALING_KEYCHAIN_FILE).
    keychainFileName: /keychain/keychain.json
    # NOTIFICATION_PERSISTENCE_SEALING_ROTATION_INTERVAL - how often the service
    # moves records of older keychain entries to the current one. Unset -> the
    # service's default (1h).
    rotationInterval: null
    # Container spec of an init container that puts an existing keychain at
    # keychainFileName. Empty -> none.
    initContainerProvideKeys: {}
    # Container spec of an init container that stores the keychain found at
    # keychainFileName. Empty -> none.
    initContainerStoreKeys: {}
    # Init container creating the first keychain entry through the HSM Proxy
    # when keychainFileName does not exist yet; does nothing otherwise.
    keychainGenerator:
      # Off only when initContainerProvideKeys always provides the keychain.
      enabled: true
      # HSM_PROXY_KEK_ID - KEK a new keychain is wrapped under, schema
      # [component]-[purpose]-[algorithm]-v<N>, e.g.
      # notification-service-keychain-kek-aesgcm-v1. Required while enabled.
      kekId: ""
      image:
        # Name in the gematik registry; our own registry has it as
        # notification-service/keychain-generator (see the umbrella values.yaml).
        repository: notification-keychain-generator
        # Empty -> notificationService.image.tag (without variant suffix).
        tag: 2.0.1
      imagePullPolicy: IfNotPresent
      resources:
        limits:
          memory: "256Mi"
        requests:
          cpu: "100m"
          memory: "128Mi"
      # Overrides on top of defaultContainerSecurityContext.
      containerSecurityContext: {}
      extraVolumeMounts: []
  # Additional volumes for the notification-service pods, e.g. the keychain.
  extraVolumes: []
  # Additional volume mounts for the notification-service container, e.g. the
  # keychain (read-only is enough).
  extraVolumeMounts: []
  pushGateway:
    # Extra CA(s) trusted for the NS's outbound HTTPS to the (external) Push
    # Gateway, in addition to system defaults. Empty -> defaults only. Mounted at
    # /certs/push-gateway/ca-<i>.pem, passed via PUSH_GATEWAY_TRUSTED_CA_PATHS.
    # Per entry set exactly one: secretName+secretKey or an inline cert.
    trustedCAs: []
    # - secretName: zeta-guard-tls
    #   secretKey: ca.crt
    # - cert: |
    #     -----BEGIN CERTIFICATE-----
    #     ...
    #     -----END CERTIFICATE-----
    # Client certificate presented to the Push Gateway for outbound mTLS.
    # On when both clientCert.secretName and clientKey.secretName are set.
    mtls:
      clientCert:
        secretName: ""      # Secret holding the PEM client certificate
        secretKey: tls.crt  # key within that Secret
      clientKey:
        secretName: ""      # Secret holding the PEM private key
        secretKey: tls.key  # key within that Secret
      # Optional password for an encrypted private key.
      keyPassword:
        secretName: ""
        secretKey: ""
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "50m"
      memory: "128Mi"
  podAnnotations: {}
  affinity: {}
  tolerations: []
  # A_29974: single knob for the optional history feature — drives the NS's
  # NOTIFICATION_HISTORY_ENABLED env, discovery scopes_supported, and (via
  # terraform notification_history_enabled) the Keycloak scope.
  historyEnabled: false
  # How long a device's message history is kept (NOTIFICATION_HISTORY_RETENTION):
  # once it has passed after the first recorded notification, the complete
  # history is erased; the next notification restarts the history and the
  # timer. A_29988 exempts the history from the short processing-data retention;
  # it follows the operator's configuration. ISO-8601 (P30D) or Quarkus shorthand
  # (30d, 720h). null -> the service default, P30D.
  historyRetention: null
  # RFC 9728 resource identifier for the NS (source of truth). Combined with
  # pepproxy.wellKnownBase to form the aud; well-known location, `resource`,
  # pep_require_aud and ConfigMap path all derive from it. Single leading-slash
  # segment, decoupled from the /push/v1 API prefix.
  wellKnownResourceSuffix: /notification-service

# Optional: Install CloudNativePG operator in the same namespace (namespace-scoped)
# Enabled by default so each namespace manages its own operator instance.
# CRDs remain cluster-scoped and are installed once (the first time the
# operator is installed in any namespace).

# opaDistributedTracingEnabled enables distributed tracing with a gRPC endpoint
opaDistributedTracingEnabled: true

# If opaStatusPrometheus is true, export the status (bundle and plugin) metrics to prometheus
opaStatusPrometheus: true

# OPA policy/data configuration for Keycloak→OPA showcase
opaPolicy:
  # Default fake policy: allow-all decision object.
  # The policies will be loaded from PIP and PAP Service (workload identity federation or secretRef)
  policyRego: |
    package policies.zeta.authz

    # Minimal decision object compatible with callers expecting
    # data.policies.zeta.authz.decision => {"allow": bool, "ttl": {"access_token": number, "refresh_token": number}}
    decision := {
      "allow": true,
      "ttl": {
        "access_token": 300,
        "refresh_token": 86400,
      },
    }

# Use OpenShift Ingress Route-Controller with tls; will create edge-terminiated routes with tls-redirect
openshiftIngress:
  enabled: false
  certName: ""

provisioningProcessor:
  # OCSP validation of SMC-B / TSL certs (env PROCESSORS_TSL_OCSP_ENABLED).
  # Default true per A_24624-01; false skips live OCSP checks (test envs).
  tslOcspEnabled: true
  # Keep the processor resident as a native sidecar and re-run it daily, so refreshed trust anchors take effect
  # without restarting the pod. enabled: false runs it as a one-shot init container that exits after the first pass.
  schedule:
    enabled: true
    # Local time of the daily re-run, format HH:MM (env SCHEDULE_TIME). Not a cron expression.
    time: "03:00"
    # IANA timezone the time above is read in (env TZ).
    timezone: "Europe/Berlin"
  # Overrides on top of defaultContainerSecurityContext.
  containerSecurityContext:
    readOnlyRootFilesystem: false
  image:
    repository: provisioning-processor
    tag: 2.0.0
  imagePullPolicy: Always
  provisioningContainer: "europe-west3-docker.pkg.dev/gematik-pt-zeta-test/zeta-provisioning/zeta-guard-provisioning@sha256:72d1ae7329c95346a9ef82cf5baf28ec31a78ecbc761a36884a2a1056b5d6665" # "europe-west3-docker.pkg.dev/gematik-pt-zeta-test/zeta-provisioning/zeta-guard-provisioning:latest"
  # --- CA for the provisioning container registry (Option A and B are mutually exclusive) ---
  # Option A (existing default): mount the CA from a Secret. Auto-wires env var
  #           PROVISIONING_CONTAINER_REGISTRY_CA_FILE + mount /var/registry-ca/ca.crt.
  # provisioningContainerCaSecretRef:
  #   name: registry-ca
  #   key: ca.crt
  #
  # Option B: mount the CA from a ConfigMap (e.g. the bundle generated by OpenShift custom PKI).
  #           Same auto-wiring. SecretRef takes precedence if both are set.
  # provisioningContainerCaConfigMapRef:
  #   name: zeta-guard-openshift-ca-bundle
  #   key: ca-bundle.crt
  #
  # Option C: generic mount of any source (Secret/ConfigMap/projected/CSI/...). The operator
  #           wires up the volume, mount and env var themselves.
  # extraEnv: []
  # extraVolumes: []
  # extraVolumeMounts: []
  #
  # --- Registry credentials (for registries that do not allow anonymous access) ---
  # Reference an existing Secret (e.g. created from a SealedSecret) holding the registry
  # username and token/password. Auto-wires the env vars PROVISIONING_CONTAINER_REGISTRY_USERNAME
  # and PROVISIONING_CONTAINER_REGISTRY_TOKEN via secretKeyRef. Leave unset for anonymous access.
  # registryCredentialsSecretRef:
  #   name: registry-credentials
  #   usernameKey: username   # default: username
  #   tokenKey: token         # default: token
  # Federation Master processor (env PROCESSORS_FEDERATION_MASTER_ENABLED).
  # Extracts the TI Federation Master entity statement URL from the provisioning
  # container's federation-master.yaml and writes it to federation-master.json.
  # Only the authserver consumes this file (OIDC flow).
  federationMaster:
    enabled: false
    # Selects which environment's URL to extract (e.g. "production", "test").
    environment: ""
    # Override: when set, replaces the URL extracted from the provisioning
    # container. Use for stages that run their own sekidp-fedmaster.
    devModeUrl: ""
  resources:
    limits:
      memory: "200Mi"
    requests:
      cpu: "100m"
      memory: "100Mi"

# telemetryGatewayEnabled adds the telemetry gateway to the helm release
telemetryGatewayEnabled: true

# telemetryGatewayHost sets the hostname that ALL telemetry is sent to: the PEP
# OTLP traces endpoint and syslog error_log/access_log, the OPA OTLP address, and
# the authserver OTLP endpoint. Leave empty to use the default bundled collector
# name (telemetry-gateway.fullnameOverride, else "<release>-telemetry-gateway").
#
# Set this to the fully-qualified hostname of the telemetry gateway when the bare
# service name does not resolve from the components — e.g. clusters whose DNS does
# not apply the pod search path to the exporter's resolver, cross-namespace setups,
# or a non-default cluster domain. Example:
#   telemetryGatewayHost: zeta-guard-telemetry-gateway.<namespace>.svc.cluster.local
# Being a Helm value, it survives chart upgrades — no hand-editing of the rendered
# ConfigMap (which is not permitted in production). This is the same pattern the
# chart already uses for OPA via authserver.provider.smcB.opaBaseUrl.
#
# This changes ONLY the address under which the telemetry-gateway is reached, never
# the destination: telemetry must always go to the telemetry-gateway, whose redaction
# processor and ti_sim/ti_siem filters are not bypassable. To feed your own
# observability backend, add an exporter INSIDE the gateway's dienst_hersteller
# pipelines instead of redirecting the producers.
#
# The in-cluster hops are plaintext; transport security is delegated to the service
# mesh (global.istio.enabled renders a namespace-wide STRICT PeerAuthentication that
# also covers the OTLP, syslog and OPA ports).
#
# Hostname only — ports (4317/54526/49152/49153) are fixed. When the gateway runs
# outside this chart, the operator must also allow egress to it: the pep-proxy, opa,
# opa-simulation and authserver egress NetworkPolicies only permit a same-namespace
# opentelemetry-collector pod as the destination.
telemetryGatewayHost: ""

# telemetryGatewaySendingQueuePVCResources sizes the PersistentVolumeClaim backing the sending queue
telemetryGatewaySendingQueuePVCResources:
  requests:
    storage: 5Gi

# telemetryGatewaySendingQueuePVCAccessModes sets the access modes of that PVC.
# ReadWriteOnce fits the single-replica deployment on block storage. Use
# ReadWriteMany on a shared filesystem (Azure Files, CephFS, NFS) — required when
# the storage system offers nothing else, and it also lifts the single-writer
# constraint that the telemetry-gateway rollout below works around with
# maxSurge: 0.
telemetryGatewaySendingQueuePVCAccessModes:
  - ReadWriteOnce

# telemetryGatewaySendingQueuePVCStorageClass pins the StorageClass of that PVC.
# Empty omits the field, so the cluster's default StorageClass applies. Set it
# when that default cannot be attached by your nodes — the gateway then hangs in
# ContainerCreating with FailedAttachVolume — or cannot serve the access modes
# above. A PVC spec is immutable: a claim already created with the wrong class
# has to be deleted once before the next upgrade recreates it.
telemetryGatewaySendingQueuePVCStorageClass: ""

telemetry-gateway:
  mode: deployment
  # Off because the upstream auto-rewrite crashes the render on a disabled pipeline:
  # `opentelemetry-collector.rewriteDeprecatedComponentNames` does `index $pipeline $kind`
  # without a nil guard (_config.tpl), so any `pipelines.<name>: null` — the documented way
  # to switch a pipeline off, used by values-demo.yaml and the stage values — aborts with
  # "index of untyped nil". The sibling `opentelemetry-collector.deprecations` helper guards
  # the same loop correctly, so this is an upstream oversight, not our config.
  # The rewrite only renames deprecated components (processor `k8sattributes` -> `k8s_attributes`,
  # detector `k8snode` -> `k8s_api`); we use neither name, so disabling it is a no-op.
  # Re-check when bumping the opentelemetry-collector dependency.
  rewriteDeprecatedComponentNames: false
  # Plain RollingUpdate defaults (maxSurge: 25%, maxUnavailable: 25%) would
  # start the new pod before the old one releases the ReadWriteOnce
  # file-storage PVC (access modes in
  # telemetryGatewaySendingQueuePVCAccessModes above, claim rendered by
  # templates/telemetry-gateway/telemetry-gateway-file-storage-pvc.yaml),
  # leaving it stuck in ContainerCreating. maxSurge: 0 forbids creating the
  # new pod while the old one still counts toward capacity, and
  # maxUnavailable: 1 lets the old one scale to zero first — so at
  # replicaCount: 1 the old pod is always fully gone (and the PVC released)
  # before the new one is created, the same guarantee `Recreate` would give,
  # without switching `strategy.type` on a live Deployment (which hits a
  # Kubernetes field-defaulting quirk: `rollingUpdate: Forbidden when type is
  # Recreate`, since Kubernetes silently defaults that field on the live
  # object whenever type is RollingUpdate, and nothing ever prunes it).
  # Only the single-writer PVC forces this; on ReadWriteMany storage the
  # plain RollingUpdate defaults are fine again.
  rollout:
    strategy: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  image:
    repository: europe-west3-docker.pkg.dev/gematik-pt-zeta-prod/zeta-dcr/zeta-telemetry-gateway
    # some customer scripts are based around this value even though it is ineffective. Deprecated and will be superseded by SBOM.
    tag: "v0.157.0"
    digest: "sha256:97bc1aa4584d7747ec1edb18cb3e68723841e001bfc620d25657e71786d12aed"
    pullPolicy: Always
  command:
    name: /otelcol/zeta-telemetry-gateway
  resources:
    limits:
      memory: "4Gi"
    requests:
      cpu: "1"
      memory: "1Gi"
  # Subchart: defaultContainerSecurityContext does not reach these values, so
  # the UID is pinned here separately, plus a GID (the only one in this chart):
  # the collector needs a known non-root identity that can write the file-storage PVC below.
  # OpenShift rejects both, because its SCC assigns UID and GID from the
  # namespace's allocated range — hand them over there with an explicit
  # `fsGroup: null` / `runAsUser: null`. Explicit `null`, not omission: Helm
  # merges maps, so a values file that simply leaves these keys out still
  # inherits the 1000 set here. See docs/explanations/Telemetry.md.
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
    # PVCs/emptyDirs are created root:root by default; fsGroup makes the
    # mounted file-storage volume group-writable by the non-root user below.
    fsGroup: 1000
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ "ALL" ]
  config:
    connectors:
      # WARNING metrics created by count connector are discarded by prometheus.
      # Use deltatocumulative processor to rectify metrics before sending them
      # to prometheus.
      count/security_kpis:
        # ADR 0001 (docs/adr/0001-reliable-daily-metrics.md): these are plain
        # monotonic counters since collector-process-start now, not per-day
        # buckets — no zeta-client.date attribute baked into the series
        # itself. "Daily" is computed downstream, durably, by kpiPrometheus
        # (increase() over a UTC-midnight-aligned range) rather than by this
        # in-memory connector, which loses all of this on every restart.
        logs:
          attack.detection.count:
            description: 'Anzahl erkannte Angriffe in Kategorie (siehe A_25404-*) plus weitere breakdown in Versicherte und LE (A_25484-03)'
            conditions:
              - HasPrefix(resource.attributes["service.name"], "ZETA Guard ") and
                log.attributes["attackDetection.capecId"] != nil
            attributes:
              - key: attackDetection.capecId
              - key: zeta-client.user_category
                default_value: "provider"

          zeta_guard_kpi.botnet_accesses_24h:
            description: 'Anzahl von Zugriffen von Botnetzen (A_25484-03)'
            conditions:
              - resource.attributes["service.name"] == "ZETA Guard PDP policy engine" and
                log.attributes["opa.event_type"] == "decision_log" and
                log.attributes["zeta-client.access_via_botnet"] == true

          zeta_guard_kpi.country_accesses_24h:
            description: 'Anzahl von Zugriffen aus jedem Land gezählt plus weitere Zugriffe, die separat in Versicherte und LE ausgewiesen werden (A_25484-03)'
            conditions:
              - resource.attributes["service.name"] == "ZETA Guard PDP policy engine" and
                log.attributes["opa.event_type"] == "decision_log"
            attributes:
              - key: zeta-client.user_category
                default_value: "provider"

          zeta_guard_kpi.failed_authorization_codes_24h:
            description: 'Anzahl fehlerhafte Authorization Codes vom IDP (A_25484-03)'
            conditions:
              - resource.attributes["service.name"] == "ZETA Guard PDP authorization server" and
                log.attributes["event_type"] == "authn_authorization_code_invalid"
            attributes:
              - key: zeta-client.reason
                default_value: "none given"

          zeta_guard_kpi.failed_client_activations_24h:
            description: 'Anzahl fehlerhafter Clientfreischaltungen plus weitere breakdown in Versicherte und LE (A_25484-03)'
            conditions:
              - resource.attributes["service.name"] == "ZETA Guard PDP authorization server" and
                log.attributes["event_type"] == "authn_client_registration_fail"
            attributes:
              - key: zeta-client.reason
                default_value: "none given"
              - key: zeta-client.user_category
                default_value: "provider"

          zeta_guard_kpi.tor_accesses_24h:
            description: 'Anzahl von Zugriffen über TOR Netzwerke plus weitere breakdown in Versicherte und LE (A_25484-03)'
            conditions:
              - resource.attributes["service.name"] == "ZETA Guard PDP policy engine" and
                log.attributes["opa.event_type"] == "decision_log" and
                log.attributes["zeta-client.access_via_tor"] == true
            attributes:
              - key: zeta-client.user_category
                default_value: "provider"

          zeta_guard_kpi.vpn_accesses_24h:
            description: 'Anzahl von Zugriffen über VPNs plus weitere breakdown in Versicherte und LE (A_25484-03)'
            conditions:
              - resource.attributes["service.name"] == "ZETA Guard PDP policy engine" and
                log.attributes["opa.event_type"] == "decision_log" and
                log.attributes["zeta-client.access_via_vpn"] == true
            attributes:
              - key: zeta-client.user_category
                default_value: "provider"

        spans:
          zeta_guard_kpi.requests_by_unregister_clients.authorization_server.count:
            description: 'Anzahl versuchter Zugriffe von nicht registrierten Clients auf Authorization Server APIs (A_25484-03)'
            conditions:
              - resource.attributes["service.name"] == "ZETA Guard PDP authorization server" and
                span.kind == SPAN_KIND_SERVER and
                (
                  span.attributes["http.response.status_code"] == 401 or
                  span.attributes["http.response.status_code"] == 403
                ) and
                span.attributes["http.route"] == "/realms/{realm}/clients-registrations/{provider}"

          zeta_guard_kpi.requests_by_unregister_clients.resource_server.count:
            description: 'Anzahl versuchter Zugriffe von nicht registrierten Clients auf Resource Server APIs (A_25484-03)'
            conditions:
              - resource.attributes["service.name"] == "ZETA Guard PEP HTTP proxy" and
                span.kind == SPAN_KIND_SERVER and
                span.attributes["http.response.status_code"] == 401 and
                (
                  span.attributes["http.route"] == "/ASL" or
                  span.attributes["http.route"] == "/pep" or
                  HasPrefix(span.attributes["http.route"], "/ASL/") or
                  HasPrefix(span.attributes["http.route"], "/pep/")
                )

      # RED metrics (rate/latency/errors per service+span_name+kind) synthesized
      # from the span stream, with exemplars linking each histogram bucket to a
      # contributing trace. Fed from the dienst_hersteller trace pipeline and
      # consumed by the dienst_hersteller metrics pipeline (see service.pipelines).
      # Must run on the unsampled trace stream — before any tail-sampling — or
      # the derived metrics are biased by what sampling kept. Requires the
      # spanmetrics connector to be compiled into the collector distribution.
      spanmetrics:
        metrics_flush_interval: 15s
        exemplars:
          enabled: true
        # key metric streams by stable resource attrs only — otherwise every
        # PEP pod generation becomes a separate stream that differs in
        # unpromoted attrs and collides onto the same Prometheus series
        # (alternating counter values -> bogus rate() spikes)
        resource_metrics_key_attributes:
          - service.name
          - service.namespace
          - service.instance.id
          - service.version
        # stop re-flushing counters of resources that no longer send spans
        # (default: never expire -> dead-pod series flushed forever)
        metrics_expiration: 5m
        dimensions:
          - name: http.route
          - name: is_asl
          - name: zeta-test.oauth_grant
            default: unknown
        histogram:
          explicit:
            buckets: [50us, 100us, 250us, 500us, 1ms, 2ms, 4ms, 6ms, 8ms, 10ms, 15ms, 20ms, 30ms, 50ms, 75ms, 100ms, 200ms, 500ms, 1s, 2s, 5s]

    exporters:
      otlp_grpc/ti_siem:
        endpoint: https://otlp.siem.prod.ccs.gematik.solutions:443
        auth:
          authenticator: bearertokenauth/ti-siem
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 1215s
          max_elapsed_time: 1820s
        sending_queue:
          enabled: true
          queue_size: 2048
          batch:
            flush_timeout: 5s
            min_size: 512
          storage: file_storage
        timeout: 30s

      otlp_grpc/ti_sim:
        endpoint: https://otlp.v1.bd.prod.ccs.gematik.solutions:443
        auth:
          authenticator: bearertokenauth/ti-sim
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 1215s
          max_elapsed_time: 1820s
        sending_queue:
          enabled: true
          queue_size: 2048
          batch:
            flush_timeout: 5s
            min_size: 512
          storage: file_storage
        timeout: 30s

      # ADR 0001: pushes count/security_kpis's reshaped KPI counters to
      # kpiPrometheus's OTLP receiver (metrics/security_kpis pipeline below),
      # so kpiPrometheus can durably store them and absorb telemetry-gateway
      # restarts via increase(). Not a "prometheus" exporter: this collector
      # build doesn't include that component (only otlp/otlp_grpc/otlp_http/
      # debug — confirmed by the "unknown type" error trying it), so push
      # instead of scrape.
      #
      # Endpoint is kpiPrometheus's server fullname, hardcoded rather than
      # computed: this config is rendered from inside the telemetry-gateway
      # subchart's own context, which can't reach kpiPrometheus's
      # `.Subcharts` entry — only zeta-guard's own root-level templates can,
      # kpiPrometheus being zeta-guard's subchart, not telemetry-gateway's.
      #
      # Without `server.fullnameOverride`, `prometheus.server.fullname`
      # derives the name from `.Chart.Name`, which for an aliased dependency
      # is the alias itself — "kpiPrometheus", camelCase — producing
      # `<release>-kpiPrometheus-server`. That fails at deploy time: it's not
      # a valid Kubernetes resource name (RFC 1123 subdomain, lowercase
      # only), so every resource keyed off it (ServiceAccount, ConfigMap,
      # PVC, ClusterRole(Binding), Service, Deployment) is rejected. Fixed by
      # setting `server.fullnameOverride: kpi-prometheus-server` below,
      # static rather than release-prefixed — safe because this chart is
      # always one release per namespace. If that fullnameOverride ever
      # changes, update this endpoint to match.
      otlp_http/security_kpis:
        endpoint: "http://kpi-prometheus-server/api/v1/otlp"
        tls:
          insecure: true

    extensions:
      bearertokenauth/ti-siem:
        filename: "/etc/ti-siem/token"
      bearertokenauth/ti-sim:
        filename: "/etc/ti-sim/token"
      file_storage:
        create_directory: true
        directory: /var/lib/storage/otc

    processors:
      deltatocumulative:
        max_stale: 24h

      # optional tail sampling for TI-SIM
      # see https://gemspec.gematik.de/docs/gemSpec/gemSpec_Perf/gemSpec_Perf_V2.87.0/#A_28988
      tail_sampling/ti_sim:
        decision_wait: 10s
        num_traces: 50000
        expected_new_traces_per_sec: 200
        policies:
          - name: errors-always
            type: status_code
            status_code:
              status_codes: [ERROR]
          - name: success-sampled
            type: probabilistic
            probabilistic:
              sampling_percentage: 5

      transform/siem:
        error_mode: ignore
        log_statements:

          - context: log
            conditions:
              - resource.attributes["service.name"] == "ZETA Guard PDP policy engine" and
                log.attributes["opa.event_type"] == "decision_log"
              - resource.attributes["service.name"] == "ZETA Guard PDP policy engine (simulation)" and
                log.attributes["opa.event_type"] == "decision_log"
            statements:
              # removed embedded metrics from decision logs
              - delete_key(log.body, "metrics")

              # A_25484-03 - Security Monitoring - Security KPIs
              - set(log.attributes["zeta-client.user_category"],
                    log.body["result"]["security"]["user_category"])
              - set(log.attributes["zeta-client.access_via_botnet"],
                    log.body["result"]["security"]["access_via"]["botnet"])
              - set(log.attributes["zeta-client.access_via_tor"],
                    log.body["result"]["security"]["access_via"]["tor"])
              - set(log.attributes["zeta-client.access_via_vpn"],
                    log.body["result"]["security"]["access_via"]["vpn"])

              # A_28793 - Telemetriedaten für Policy Entscheidungen
              - set(log.attributes["app.build_id"],
                    log.body["input"]["client_registration_data"]["product_version"])
              - set(log.attributes["device.model.identifier"],
                    log.body["input"]["client_registration_data"]["device_info"]["device_model"])
              - set(log.attributes["os.name"],
                    log.body["input"]["client_registration_data"]["device_info"]["os"])
              - set(log.attributes["os.version"],
                    log.body["input"]["client_registration_data"]["device_info"]["os_version"])

          - conditions:
              - resource.attributes["service.name"] == "ZETA Guard PDP policy engine" and
                log.attributes["opa.event_type"] == "status_update"
              - resource.attributes["service.name"] == "ZETA Guard PDP policy engine (simulation)" and
                log.attributes["opa.event_type"] == "status_update"
            statements:
              # remove embedded metrics from status updates
              - delete_key(log.body, "metrics")
              - delete_key(log.body["bundles"]["authz"], "metrics")

            # No longer read by count/security_kpis itself (ADR 0001 — its counters
            # are plain monotonic sums now, not date-bucketed), but still
            # set on every record exported to SIEM directly
            # (otlp_grpc/ti_siem), which may rely on it independently of the
            # KPI aggregation this originally existed for. Left in place.
          - statements:
              # A_25484-03 - Security Monitoring - Security KPIs
              - set(log.attributes["zeta-client.date"],
                FormatTime(log.time, "%F"))

        trace_statements:
            # See log_statements above — same reasoning.
          - statements:
              # A_25484-03 - Security Monitoring - Security KPIs
              - set(span.attributes["zeta-client.date"],
                FormatTime(span.start_time, "%F"))

      transform/dienst_hersteller:
        error_mode: ignore
        trace_statements:
          # A_28960 - Security Monitoring - Keine Weitergabe sicherheitsrelevanter Telemetriedaten
          - delete_key(span.attributes, "app.installation.id")
            where span.attributes["app.installation.id"] != nil

      # sets `server.address` attribute for TI-SIEM and TI-SIM
      transform/siem_and_sim:
        log_statements:
          - set(resource.attributes["server.address"], "{{ .Values.global.clusterFQDN }}")
            where resource.attributes["server.address"] == nil
        metric_statements:
          - set(resource.attributes["server.address"], "{{ .Values.global.clusterFQDN }}")
            where resource.attributes["server.address"] == nil
        profile_statements:
          - set(resource.attributes["server.address"], "{{ .Values.global.clusterFQDN }}")
            where resource.attributes["server.address"] == nil
        trace_statements:
          - set(resource.attributes["server.address"], "{{ .Values.global.clusterFQDN }}")
            where resource.attributes["server.address"] == nil

      # tag KC span events with the OAuth grant type; the shipped dashboards
      # split token traffic on zeta-test.oauth_grant
      transform/keycloak_oauth_grant:
        error_mode: ignore
        trace_statements:
          - context: spanevent
            statements:
              - set(span.attributes["zeta-test.oauth_grant"], "refresh") where attributes["kc.details.grant_type"] == "refresh_token"
              - set(span.attributes["zeta-test.oauth_grant"], "token_exchange") where attributes["kc.details.grant_type"] == "urn:ietf:params:oauth:grant-type:token-exchange"
              - set(span.attributes["zeta-test.oauth_grant"], "token_exchange") where attributes["kc.details.grant_type"] == "urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Atoken-exchange"

      # PEP's tracing layer emits #[instrument(err)] events as log records whose
      # body is empty — the error text lives in attributes["error"] only
      # (opentelemetry-appender-tracing hardcodes the message field as the body).
      # Copy it into the body so log UIs show a message. OTTL: an unset body is
      # nil, not "". Must run on every logs pipeline that reaches an exporter.
      transform/error_body:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(log.body, log.attributes["error"]) where log.attributes["error"] != nil and (log.body == nil or log.body == "")

      # set log severity 'error' for OPA status updates containing error codes
      transform/log_severity_opa_errors:
        log_statements:
          - conditions:
              - log.attributes["opa.event_type"] == "status_update" and
                (
                  log.body["bundles"]["authz"]["code"] != nil or
                  log.body["decision_logs"]["code"] != nil
                )
            statements:
              - set(log.severity_number, SEVERITY_NUMBER_ERROR)
              - set(log.severity_text, "error")

      # Workaround for outdated implementation of OpenTelemetry semantic conventions in PEP. Remove when fixed in PEP.
      attributes/semantic_conventions_migration:
        actions:
          - key: client.address
            from_attribute: http.client_ip
            action: insert
          - key: http.request.method
            from_attribute: http.method
            action: insert
          - key: http.response.status_code
            from_attribute: http.status_code
            action: insert
          - key: user_agent.original
            from_attribute: http.user_agent
            action: insert
          - key: server.address
            from_attribute: net.host.name
            action: insert
        include:
          match_type: strict
          services:
            - "ZETA Guard PEP HTTP proxy"

      filter/security_kpis_corrected:
        error_mode: ignore
        metric_conditions:
          - >-
            not (
              resource.attributes["service.name"] == "ZETA Guard KPI metrics helper" and
              (
                HasPrefix(metric.name, "attack.detection.") or
                HasPrefix(metric.name, "zeta_guard_kpi.")
              )
            )

      filter/dienst_hersteller:
        # removes attack detection, authn_*, and policy decision logs
        # removes security event metrics
        error_mode: ignore
        log_conditions:
          - >-
            HasPrefix(resource.attributes["service.name"], "ZETA Guard ") and
            (
              log.attributes["attackDetection.capecId"] != nil or
              log.attributes["event_type"] == "authn_client_deleted" or
              log.attributes["event_type"] == "authn_client_registered" or
              log.attributes["event_type"] == "authn_client_registration_fail" or
              log.attributes["event_type"] == "authn_token_created" or
              log.attributes["opa.event_type"] == "decision_log"
            )
        metric_conditions:
          - >-
            HasPrefix(resource.attributes["service.name"], "ZETA Guard ") and
            (
              HasPrefix(metric.name, "attack.detection.") or
              HasPrefix(metric.name, "zeta_guard_kpi.")
            )

      filter/ti_sim:
        # removes all logs and metrics except those created by the resource server, and error/fatal logs created by ZETA guard
        # removes most spans except those created by the resource server
        # keeps certain HTTP server spans created by the HTTP proxy
        error_mode: ignore
        log_conditions:
          - >-
            not (
              resource.attributes["service.name"] == "resource server" or
              HasPrefix(resource.attributes["service.name"], "rs.") or
              HasPrefix(resource.attributes["service.name"], "ZETA Guard ") and
              (
                log.severity_number >= SEVERITY_NUMBER_ERROR
              )
            )
        metric_conditions:
          - >-
            not (
              resource.attributes["service.name"] == "resource server" or
              HasPrefix(resource.attributes["service.name"], "rs.")
            )
        trace_conditions:
          - >-
            not (
              resource.attributes["service.name"] == "resource server" or
              HasPrefix(resource.attributes["service.name"], "rs.") or
              (
                resource.attributes["service.name"] == "ZETA Guard PEP HTTP proxy" and
                span.kind == SPAN_KIND_SERVER and
                (
                  span.attributes["url.path"] != "/status" and
                  span.attributes["http.route"] != "/status"
                )
              )
            )

      filter/ti_siem:
        # removes all logs/metrics/spans except those created by ZETA guard
        error_mode: ignore
        log_conditions:
          - >-
            not (
              HasPrefix(resource.attributes["service.name"], "ZETA Guard ") and
              (
                log.attributes["attackDetection.capecId"] != nil or
                log.attributes["opa.event_type"] != nil or
                log.attributes["event_type"] == "authn_client_deleted" or
                log.attributes["event_type"] == "authn_client_registered" or
                log.attributes["event_type"] == "authn_client_registration_fail" or
                log.attributes["event_type"] == "authn_token_created"
              )
            )
        metric_conditions:
          - >-
            not (
              HasPrefix(resource.attributes["service.name"], "ZETA Guard ") and
              (
                HasPrefix(metric.name, "attack.detection.") or
                HasPrefix(metric.name, "zeta_guard_kpi.")
              )
            )
        trace_conditions:
          - >-
            not (
              HasPrefix(resource.attributes["service.name"], "ZETA Guard ") and
              span.attributes["attackDetection.capecId"] != nil or
              (
                resource.attributes["service.name"] == "ZETA Guard PDP authorization server" and
                span.kind == SPAN_KIND_SERVER
              ) or
              (
                resource.attributes["service.name"] == "ZETA Guard PEP HTTP proxy" and
                span.kind == SPAN_KIND_SERVER and
                (
                  span.attributes["url.path"] != "/status" and
                  span.attributes["http.route"] != "/status"
                )
              ) or
              (
                resource.attributes["service.name"] == "ZETA Guard PDP authorization server" and
                span.kind == SPAN_KIND_CLIENT and
                span.attributes["http.request.method"] == "POST" and
                IsMatch(span.attributes["url.full"], "/v1/data/policies/zeta/authz/decision$")
              )
            )

      redaction/zeta_guard:
        # by default, keep all attributes
        allow_all_keys: true
        # remove attributes with keys matching these patterns
        blocked_key_patterns:
          - ".*token.*"
        # redact these patterns inside attribute values
        blocked_values:
          ### A_25744 - ZETA Guard - Datenschutzkonformes Logging und Monitoring
          # taken from https://github.com/stefanboeck/privacylight/blob/main/privacylight/detection.py
          # email addresses
          - '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}'
          # IBAN
          - '[A-Z]{2}\d{2}[A-Z0-9]{10,30}'
          # credit card numbers
          - '\d{4}[\s-]?\d{4}[\s-]?\d{4}[\s-]?\d{4}'
          # German phone numbers
          - '(?:\+49|0049|0)[\s-]?1[5-7]\d[\s-]?\d{7,8}'

          ### A_25745 - ZETA Guard - Keine medizinischen Informationen in Logging und Monitoring

          ### A_25746 - ZETA Guard - Keine sicherheitsrelevanten Daten in Logging und Monitoring
          # JWT
#          - '([a-zA-Z0-9_=]+)\.([a-zA-Z0-9_=]+)\.([a-zA-Z0-9_\-\+\/=]*)'
          # The following patterns are taken from https://help.nightfall.ai/detection_platform/regex_library
          # ECDSA Private Key
          - '^-----BEGIN ECDSA PRIVATE KEY-----\s.*,ENCRYPTED(?:.|\s)+?-----END ECDSA PRIVATE KEY-----$'
          # SSL Certificate
          - '^-----BEGIN CERTIFICATE-----(?:.|\n)+?\s-----END CERTIFICATE-----$'

          ### mixed bag of patterns
          - '^[a-zA-Z0-9_+&*-]+(?:\.[a-zA-Z0-9_+&*-]+)*@(?:[a-zA-Z0-9-]+\.)+[a-zA-Z]{2,7}$'
          - '^([0-9a-zA-Z\-=_]{20,})\.([0-9a-zA-Z\-_=]{3,})\.([0-9a-zA-Z\-_=]*)$'
          - 'eyJ[A-Za-z0-9-_=]+?\.[A-Za-z0-9-_=]+\.?[A-Za-z0-9-_.+/=]*'
          - >
            client_(id|secret)['"\s:=]+[a-zA-Z0-9\-_.~]{10,100}
          - 'AKIA[0-9A-Z]{16}'
          - >
            aws(.{0,20})?(?-i)['"]?[0-9A-Za-z\/+]{40}['"]?
          - 'AIza[0-9A-Za-z\-_]{35}'
          - 'ghp_[0-9a-zA-Z]{36}'
          - 'glpat-[0-9a-zA-Z-_]{20}'
          - 'xox[baprs]-([0-9a-zA-Z]{10,48})?'
          - 'sk_live_[0-9a-zA-Z]{24}'
          - 'pk_live_[0-9a-zA-Z]{24}'
          - 'SK[0-9a-fA-F]{32}'
          - 'SG\.[\w\d\-_]{22}\.[\w\d\-_]{43}'
          - 'sl\.[A-Za-z0-9_-]{20,100}'
          - 'shpat_[0-9a-fA-F]{32}'
          - 'EAACEdEose0cBA[0-9A-Za-z]+'
          - >
            [ hH ]eroku['"][0-9a-f]{32}['"]
          - 'dop_v1_[a-z0-9]{64}'
          - '0/[0-9a-z]{32}'
          - 'lin_api_[a-zA-Z0-9]{40}'
          - '\d{9}:[a-zA-Z0-9_-]{35}'
          - >
            mongodb(\+srv)?:\/\/[^\s'"/]+
          - >
            postgres(?:ql)?:\/\/[^\s'"/]+
          - >
            mysql:\/\/[^\s'"/]+
          - >
            redis:\/\/[^\s'"/]+
          - >
            elasticsearch:\/\/[^\s'"/]+
          - >
            jdbc:\w+:\/\/[^\s'"/]+
          - '[A-Za-z]:\\(?:[^\\\n\r]+\\)*[^\\\n\r\.]+\.[\w]+'
          - >
            (username|user|email)['"\s:=]+[^\s'"@]{1,100}['"].*?(password|pwd)['"\s:=]+[^\s'" ]{4,100}
          - '\b\d{1,5}\s*(?:[A-Za-zÀ-ÿ0-9.-]+\s+)*(?:Straße|Str\.|Strasse|Street|St\.|Road|Rd\.|Avenue|Ave\.|Boulevard|Blvd\.|Lane|Ln\.|Weg|Alle[e]?|Gasse|Place|Pl\.|Drive|Dr\.|Court|Ct\.|Square|Sq\.|Parkway|Pkwy\.)\b'
        # don't change attributes with keys matching these patterns
        ignored_key_patterns:
          - '^app\.kubernetes\.io\/.+'
          - '^container\..+'
          - '^k8s\..+'
          - '^net\..+'
          - '^log\..+'
          - '^otel\..+'
          - '^service\..+'
        ignored_keys:
          - http.user_agent
          - app.installation.id
        redact_all_types: true
        # NOT info: summary attributes (redaction.*.count) vary per batch; on
        # metric datapoints they become label churn that fragments each series
        # (counters appear non-monotonic, sums overcount). Applies to every
        # consumer of the metrics pipelines.
        summary: silent

    receivers:
      opa/policy_engine:
        endpoint: ${env:MY_POD_IP}:49152
        service_name: "ZETA Guard PDP policy engine"
      opa/policy_engine_simulation:
        endpoint: ${env:MY_POD_IP}:49153
        service_name: "ZETA Guard PDP policy engine (simulation)"
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
            # default 4MiB rejects KC's fat 512-span batches as PERMANENT
            # errors -> KC-side span loss (the "~15x PDP undercount")
            max_recv_msg_size_mib: 32
          http:
            endpoint: ${env:MY_POD_IP}:4318
      # ADR 0001: dedicated receiver for the corrected daily-KPI value the
      # kpi-metrics-helper CronJob pushes in (see
      # metrics/security_kpis_corrected pipeline below). Separate from the
      # bare `otlp` receiver above so it's cleanly routable to its own
      # pipeline rather than mixing into whatever that one already feeds.
      # HTTP only — the CronJob is a curl+bash script, no gRPC client needed.
      otlp/security_kpis_corrected:
        protocols:
          http:
            endpoint: ${env:MY_POD_IP}:4319

      prometheus:
        config:
          scrape_configs:
            # NOTE: job names are load-bearing — the shipped dashboards
            # (charts/lgtm/dashboards/) select on them
            - job_name: ZETA Guard PDP authorization server
              metrics_path: /auth-mgmt/metrics  # align with KC_HTTP_MANAGEMENT_RELATIVE_PATH
              scrape_interval: 5s
              static_configs:
                # align with KC_HTTP_MANAGEMENT_PORT
                - targets: [ authserver:9000 ]

            - job_name: opa
              scrape_interval: 5s
              static_configs:
                - targets: [ opa:8181 ]

            - job_name: ZETA Guard PEP HTTP proxy
              scrape_interval: 5s
              static_configs:
                - targets: [ pep-proxy-svc:9113 ]

            - job_name: telemetry-gateway
              scrape_interval: 5s
              static_configs:
                - targets: [ "${env:MY_POD_IP}:8888" ]

            # ingress metrics are the reliable rps/latency source for
            # consumers (spanmetrics shed under load); scraped via the
            # chart's stable nginx-ingress-metrics Service alias
            - job_name: nginx-ingress
              scrape_interval: 5s
              static_configs:
                - targets: [ nginx-ingress-metrics:9113 ]

      syslog/http_proxy:
        udp:
          listen_address: "${env:MY_POD_IP}:54526"
        protocol: rfc3164
        location: UTC
        resource:
          "service.name": "ZETA Guard PEP HTTP proxy"
        # With pepproxyTracingEnabled the access log line carries
        # `trace_id=<32 hex>` and `span_id=<16 hex>` (log_format main_traced).
        # Lift them into the log record's TraceId/SpanId so logs correlate
        # with traces. Each ID has its own parser, so position, order and
        # separators don't matter. Lines without a (valid) ID — untraced
        # requests log empty IDs, error_log lines none — pass through
        # unchanged; the message text is kept.
        operators:
          - type: regex_parser
            id: pep_trace_id
            if: 'attributes.message != nil and attributes.message contains "trace_id="'
            parse_from: attributes.message
            parse_to: attributes.trace_context
            regex: '\btrace_id=(?P<trace_id>[0-9a-f]{32})\b'
            on_error: send_quiet
          - type: regex_parser
            id: pep_span_id
            if: 'attributes.message != nil and attributes.message contains "span_id="'
            parse_from: attributes.message
            parse_to: attributes.trace_context
            regex: '\bspan_id=(?P<span_id>[0-9a-f]{16})\b'
            on_error: send_quiet
            # Only here, not on pep_trace_id: a trace block sets TraceId and
            # SpanId together, so it must run once both are collected. It
            # reads without deleting, hence the remove below.
            trace:
              trace_id:
                parse_from: attributes.trace_context.trace_id
              span_id:
                parse_from: attributes.trace_context.span_id
          - type: remove
            if: 'attributes.trace_context != nil'
            field: attributes.trace_context

    service:
      extensions:
        - bearertokenauth/ti-siem
        - bearertokenauth/ti-sim
        - file_storage
        - health_check
      pipelines:
        logs: null

        logs/dienst_hersteller:
          receivers:
            - opa/policy_engine
            - opa/policy_engine_simulation
            - otlp
            - syslog/http_proxy
          processors:
            - memory_limiter
            - filter/dienst_hersteller
            - transform/dienst_hersteller
            - transform/error_body
            - redaction/zeta_guard
            - batch
          exporters:
            # Diensthersteller: replace `debug` with your own exporter during setup — the
            # dienst_hersteller streams belong to you, the chart only ships a placeholder.
            - debug

        logs/ti_sim:
          receivers:
            - opa/policy_engine
            - opa/policy_engine_simulation
            - otlp
            - syslog/http_proxy
          processors:
            - memory_limiter
            - transform/log_severity_opa_errors
            - filter/ti_sim
            - transform/error_body
            - transform/siem_and_sim
            - redaction/zeta_guard
            - batch
          exporters:
            - otlp_grpc/ti_sim

        logs/ti_siem:
          receivers:
            - opa/policy_engine
            - opa/policy_engine_simulation
            - otlp
            - syslog/http_proxy
          processors:
            - memory_limiter
            - filter/ti_siem
            - transform/error_body
            - transform/siem
            - transform/siem_and_sim
            - redaction/zeta_guard
            - batch
          exporters:
            - count/security_kpis
            - otlp_grpc/ti_siem

        metrics: null

        metrics/dienst_hersteller:
          receivers:
            - otlp
            - prometheus
            # RED metrics synthesized from the dienst_hersteller trace stream
            - spanmetrics
          processors:
            - memory_limiter
            - filter/dienst_hersteller
            - transform/dienst_hersteller
            - redaction/zeta_guard
            - batch
          exporters:
            # Diensthersteller: replace `debug` with your own exporter during setup — the
            # dienst_hersteller streams belong to you, the chart only ships a placeholder.
            - debug

        metrics/ti_sim:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - filter/ti_sim
            - transform/siem_and_sim
            - redaction/zeta_guard
            - batch
          exporters:
            - otlp_grpc/ti_sim

        # ADR 0001: count/security_kpis's own KPI counters split off into
        # metrics/security_kpis below — this pipeline now only carries the
        # scrape-sourced (authserver/opa/pep-proxy/nginx-ingress) metrics
        # straight to SIEM, unchanged from before.
        metrics/ti_siem:
          receivers:
            - otlp
            - prometheus
          processors:
            - memory_limiter
            - filter/ti_siem
            - transform/siem_and_sim
            - redaction/zeta_guard
            - batch
          exporters:
            - otlp_grpc/ti_siem

        # ADR 0001: count/security_kpis's raw, restart-vulnerable KPI counters. These
        # must NOT reach SIEM directly (otlp_grpc/ti_siem is deliberately
        # absent here) — only kpiPrometheus's durable, restart-corrected
        # value (metrics/security_kpis_corrected below) should.
        metrics/security_kpis:
          receivers:
            - count/security_kpis
          processors:
            - memory_limiter
            - filter/ti_siem
            - deltatocumulative
            - transform/siem_and_sim
            - redaction/zeta_guard
            - batch
          exporters:
            - otlp_http/security_kpis

        # ADR 0001: the durable, UTC-day-corrected value the kpi-metrics-
        # helper CronJob pushes in, computed from kpiPrometheus's durable
        # storage (see docs/adr/0001-reliable-daily-metrics.md, mechanism
        # step 3). This is what actually reaches SIEM for the KPIs defined
        # under count/security_kpis — the one place otlp_grpc/ti_siem is used for
        # them, replacing the direct export removed from
        # metrics/security_kpis above.
        metrics/security_kpis_corrected:
          receivers:
            - otlp/security_kpis_corrected
          processors:
            - memory_limiter
            - filter/security_kpis_corrected
            - redaction/zeta_guard
            - batch
          exporters:
            - otlp_grpc/ti_siem

        traces: null

        traces/dienst_hersteller:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - filter/dienst_hersteller
            - attributes/semantic_conventions_migration
            - transform/dienst_hersteller
            - transform/keycloak_oauth_grant
            - redaction/zeta_guard
            - batch
          exporters:
            # Diensthersteller: replace `debug` with your own exporter during setup — the
            # dienst_hersteller streams belong to you, the chart only ships a placeholder.
            - debug
            # also feed the (unsampled) trace stream into the spanmetrics connector
            - spanmetrics

        traces/ti_sim:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - filter/ti_sim
            #- tail_sampling/ti_sim
            - attributes/semantic_conventions_migration
            - transform/siem_and_sim
            - redaction/zeta_guard
            - batch
          exporters:
            - otlp_grpc/ti_sim

        traces/ti_siem:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - filter/ti_siem
            - attributes/semantic_conventions_migration
            - transform/siem_and_sim
            - redaction/zeta_guard
            - batch
          exporters:
            - count/security_kpis
            - otlp_grpc/ti_siem

  extraVolumeMounts:
    - name: ti-siem-token
      mountPath: /etc/ti-siem
      readOnly: true
    - name: ti-sim-token
      mountPath: /etc/ti-sim
      readOnly: true
    - name: file-storage
      mountPath: /var/lib/storage/otc
  extraVolumes:
    - name: ti-siem-token
      secret:
        secretName: ti-siem-token
    - name: ti-sim-token
      secret:
        secretName: ti-sim-token
    - name: file-storage
      persistentVolumeClaim:
        # Standalone PVC for the sending_queue file_storage extension above.
        claimName: '{{ include "opentelemetry-collector.fullname" . }}-file-storage'

  ports:
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    opa-push:
      enabled: true
      containerPort: 49152
      servicePort: 49152
      protocol: TCP
    opa-sim-push:
      enabled: true
      containerPort: 49153
      servicePort: 49153
      protocol: TCP
    syslog:
      enabled: true
      containerPort: 54526
      servicePort: 54526
      protocol: UDP
    kpi-otlp:
      # ADR 0001: the otlp/security_kpis_corrected receiver's HTTP port.
      # Named "kpi-otlp", not "kpi-metrics-otlp" — k8s port names are capped
      # at 15 characters (IANA_SVC_NAME).
      enabled: true
      containerPort: 4319
      servicePort: 4319
      protocol: TCP
    zipkin:
      enabled: false
  additionalLabels:
    app.kubernetes.io/part-of: zeta-guard
  # Defense-in-depth label for telemetry-gateway's pods, on top of the
  # app.kubernetes.io/name: telemetry-gateway that Helm already derives from
  # this dependency's Chart.yaml `alias:` (which is what actually keeps this
  # selector from also matching test-monitoring-service's own otel-collector
  # instance — see telemetryGateway.selectorLabels in _helpers.tpl for the
  # full explanation). `additionalLabels` above only lands on the
  # Deployment's own metadata, not the pod template, so it can't be used for
  # this — podLabels is what actually reaches the pods (and NetworkPolicy
  # podSelectors).
  podLabels:
    app.kubernetes.io/part-of: zeta-guard
    app.kubernetes.io/component: telemetry-gateway
    helm.sh/chart: '{{ include "opentelemetry-collector.chart" . }}'

# ---------------------------------------------------------------------------
# Durable daily KPI metrics (ADR 0001: docs/adr/0001-reliable-daily-metrics.md)
# ---------------------------------------------------------------------------
# Gates the dedicated `kpiPrometheus` dependency below (Chart.yaml condition).
# Actual storage/retention config lives directly under `kpiPrometheus:`, not
# here — this stays a bare flag so there's exactly one place to look, not two
# that can silently drift out of sync (a lesson this chart has already paid
# for elsewhere).
kpiMetricsPersistence:
  enabled: false
  # The kpi-metrics-helper CronJob (ADR 0001, mechanism step 3): queries
  # kpiPrometheus and OTLP-pushes the corrected daily total to
  # telemetry-gateway. No custom image — same convention as
  # opa-token-renewer-cronjob/ti-siem-token-renewer-cronjob/
  # ti-sim-token-renewer-cronjob: inline script in an off-the-shelf public
  # image, here python3's stdlib only (no curl needed).
  cronJob:
    # Once daily, at 23:59 UTC — deliberately not more often: the corrected
    # value is meant to reach SIEM exactly once per day, not be continuously
    # re-published. 23:59 rather than 00:00 so the query's UTC-midnight-
    # aligned range (see the implementation note in the CronJob template)
    # covers essentially the whole day being reported, at the cost of the
    # last minute's events (accepted, same spirit as this ADR's other
    # accepted timing gaps). Trade-off: unlike a short interval, a single
    # missed/failed run (see backoffLimit below) now loses that day's report
    # entirely, with no automatic catch-up until the next day's run.
    schedule: "59 23 * * *"
    image:
      repository: python
      # tag: "3.12-slim"
      digest: "sha256:2c941e860699f878900b0edc2403613c234d4b32eda3cc9fa7036991a2a63c4a"
      pullPolicy: IfNotPresent
    backoffLimit: 3
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

kpiPrometheus:
  # Only Prometheus server itself — no Alertmanager, no Pushgateway, no
  # node/kube-state-metrics scraping. This instance exists purely to durably
  # store telemetry-gateway's reshaped count/security_kpis KPI counters.
  #
  # nameOverride and server.fullnameOverride below both exist for the same
  # reason: without them, this vendored chart's helpers (`prometheus.name`,
  # `prometheus.server.fullname`) fall back to `.Chart.Name`, which for an
  # aliased dependency is the alias itself — "kpiPrometheus", camelCase.
  # That's an invalid Kubernetes name/label component wherever it flows into
  # container names or resource names (RFC 1123: lowercase only) — it broke
  # the ServiceAccount/ConfigMap/PVC/ClusterRole(Binding)/Service/Deployment
  # (fixed by fullnameOverride) and then the Deployment's own container names
  # (fixed by nameOverride here). Keep both in sync with kpiPrometheus.
  # selectorLabels in _helpers.tpl, which hardcodes the same "kpi-prometheus"
  # value to match this chart's own generated app.kubernetes.io/name label.
  nameOverride: kpi-prometheus
  alertmanager:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  # kpiPrometheus is a pure OTLP push receiver (see the server.extraFlags
  # comment below and kpi-prometheus-netpol.yaml, which restricts its
  # egress to DNS only) — it never scrapes anything itself, so the chart's
  # default Kubernetes service-discovery scrape jobs and the ClusterRole/
  # ClusterRoleBinding that back them are pure unused attack surface here.
  # Disabling rbac.create alone doesn't stop them from being *rendered*, so
  # both have to go.
  rbac:
    create: false
  # rbac.create: false above removes the ClusterRole(Binding) these jobs
  # rely on for Kubernetes API service discovery / kubelet auth, so leaving
  # any of them enabled would render a scrape config that can never
  # succeed. scrapeConfigs is a map, and Helm deep-merges maps, so an empty
  # override here would leave the chart's defaults (all enabled) in place
  # — each job has to be listed and disabled explicitly.
  scrapeConfigs:
    prometheus:
      enabled: false
    kubernetes-api-servers:
      enabled: false
    kubernetes-nodes:
      enabled: false
    kubernetes-nodes-cadvisor:
      enabled: false
    kubernetes-service-endpoints:
      enabled: false
    kubernetes-service-endpoints-slow:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    kubernetes-services:
      enabled: false
    kubernetes-pods:
      enabled: false
    kubernetes-pods-slow:
      enabled: false
  # Subchart: defaultPodSecurityContext / defaultContainerSecurityContext do not
  # reach these values, so the PSS 'restricted' settings are repeated here. The
  # chart's own pod defaults (runAsUser/runAsGroup/fsGroup 65534, runAsNonRoot)
  # are merged in and stay; prometheus only writes to its PVC, so the root
  # filesystem can be read-only. On OpenShift set server.securityContext
  # runAsUser/runAsGroup/fsGroup to an explicit `null` so the SCC assigns them.
  configmapReload:
    prometheus:
      containerSecurityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        capabilities:
          drop: ["ALL"]
  server:
    # Static rather than release-prefixed because this chart is always one
    # release per namespace.
    fullnameOverride: kpi-prometheus-server
    retention: 7d
    # Pod-level (this chart's naming); merged with its runAsUser 65534 defaults.
    securityContext:
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop: ["ALL"]
    image:
      # tag: "v3.13.2"
      digest: "sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69"
    persistentVolume:
      size: 2Gi
      # empty -> cluster default StorageClass, matching cloudnativePg.storage
      # below and the file-storage PVC's own convention.
      storageClass: ""
    # ADR 0001: telemetry-gateway pushes count/security_kpis's KPI counters
    # here via OTLP (otlp_http/security_kpis exporter) rather than being
    # scraped — this collector build has no "prometheus" exporter component.
    # The OTLP receiver is disabled by default in Prometheus and must be
    # opted into explicitly; this is a list, not a map, so the chart's own
    # default (web.enable-lifecycle, needed by its configmap-reload
    # sidecar) has to be restated here too or Helm's list-replace semantics
    # would silently drop it.
    extraFlags:
      - web.enable-lifecycle
      - web.enable-otlp-receiver
  # Self-monitoring only (ADR 0001, mechanism step 4) — no alert-delivery
  # destination is wired up yet, deliberately; these rules exist so a broken
  # durability path doesn't silently regress, not to page anyone yet.
  #
  # KpiPrometheusPvcNearFull below is currently dead: kubelet_volume_stats_*
  # was fed by the default kubernetes-nodes scrape job, which is now
  # disabled (see rbac/scrapeConfigs above) along with the ClusterRole it
  # needed for kubelet service discovery/auth. Firing it again requires
  # either a separate node-metrics source or explicitly re-enabling that one
  # job plus its RBAC — deliberately left as-is rather than silently
  # removing the rule, since evaluating against a permanently-absent metric
  # just means "never fires", not a rendering error.
  serverFiles:
    alerting_rules.yml:
      groups:
        - name: kpi-prometheus-self-monitoring
          rules:
            - alert: KpiPrometheusPvcNearFull
              expr: |
                (kubelet_volume_stats_available_bytes{persistentvolumeclaim=~".*kpi-prometheus.*"}
                  / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~".*kpi-prometheus.*"}) < 0.15
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "kpiPrometheus PVC is running low on space"
                description: "Less than 15% free space remains on kpiPrometheus's PVC for 15m."

# ---------------------------------------------------------------------------
# Egress NetworkPolicies (A_27864-01)
# ---------------------------------------------------------------------------
# When enabled, each ZETA Guard pod gets an egress NetworkPolicy that restricts
# outbound traffic to explicitly listed IP blocks. Internal cluster communication
# (DNS, pod-to-pod) is always allowed via pod/namespace selectors.
# Ports are not restricted in this release (Phase 1 — IP-only).
networkPolicy:
  enabled: false

  # DNS egress peer for the egress NetworkPolicies. Defaults to the upstream
  # Kubernetes / KIND kube-dns service. To target a different DNS service (e.g.,
  # OpenShift: openshift-dns / dns.operator.openshift.io/daemonset-dns=default /
  # port 5353, since OVN-Kubernetes evaluates egress post-DNAT), set `to` to a
  # raw peer list — it is rendered as-is and overrides namespaceSelector/
  # podSelector. Do not override the selectors directly: Helm deep-merges maps,
  # so a new label would be added to `k8s-app: kube-dns` (AND semantics) and
  # match no pod. Lists like `to` are replaced wholesale, so they override
  # cleanly.
  dns:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
    ports:
      - port: 53
        protocol: UDP
      - port: 53
        protocol: TCP
    to: []

  egress:
    # A_27864-01 — gematik telemetry data receiver (OTLP endpoint)
    telemetry:
      ipBlocks: [ ]
    # A_27864-01 — gematik SIEM
    siem:
      ipBlocks: [ ]
    # A_27864-01 — ZETA Artifact Registry at gematik (image pull, OPA bundles)
    artifactRegistry:
      ipBlocks: [ ]
    # A_27864-01 — provider-internal artifact registry
    providerArtifactRegistry:
      ipBlocks: [ ]
    # A_27864-01 — OCSP/CRL for TLS TSPs per CAB Forum
    # pep-proxy: stapling for its own TLS server cert (only when pepproxy.hsmProxyAddr is set)
    ocspCabForum:
      ipBlocks: [ ]
    # A_27864-01 — SMC-B TSP OCSP Responder
    # authserver: revocation check of the SMC-B cert in the token exchange
    ocspSmcbTsp:
      ipBlocks: [ ]
    # A_27864-01 — OCSP Responder for TI component PKI
    # pep-proxy: OCSP response for its own ASL signer cert (only when pepproxy.asl_enabled)
    ocspTiPki:
      ipBlocks: [ ]
    # PIP — OPA policy bundle source
    pip:
      ipBlocks: [ ]
    # PoPP service
    popp:
      ipBlocks: [ ]
      mock: false  # allow egress to local popp-mock pod (app=popp-mock); uses podSelector + targetPort 8080
    # provider-internal traffic
    providerInternal:
      allowAll: false  # true = all egress allowed (no IP filter)
      resourceServers:
        ipBlocks: [ ]
      telemetrySystems:
        ipBlocks: [ ]
      # podSelectors: allow egress to cluster-local pods by label (post-DNAT, kindnet pattern).
      # Each entry: {matchLabels: {<label>: <value>}, port: <targetPort>}
      # Use for test-only cluster-local backends (e.g., testfachdienst in local KIND stages).
      podSelectors: [ ]
