# =============================================================================
# ZETA Guard Helm Chart — Demo / Reference Values
# =============================================================================
# This file documents configurable values of the zeta-guard subchart.
# Use it as a reference when creating environment-specific overrides.
# Values shown here are sensible demo defaults; adjust for your environment.
# =============================================================================

# ---------------------------------------------------------------------------
# Global settings (shared across subcharts via Helm's global mechanism)
# ---------------------------------------------------------------------------
global:
  imagePullSecrets: [ ]
  registry_host: "europe-west3-docker.pkg.dev/gematik-pt-zeta-prod/zeta-dcr/"
  # infinispanExternal: see umbrella chart values for full Infinispan config

  # Cluster's public fully qualified domain name. Stamped into the telemetry
  # streams as the `server.address` resource attribute for TI-SIEM / TI-SIM.
  clusterFQDN: "zeta-demo.example"

  # Istio PeerAuthentication resources
  istio:
    enabled: false

  # HTTP forward proxy for outbound requests from all ZETA Guard components.
  # Applies to: pepproxy (nginx), authserver (Keycloak), opa, opa-simulation,
  #             provisioning-processor (init container), opa-token-renewer (CronJob).
  # Example: "http://proxy.example.com:8080"
  #
  # This is a chart-wide setting — there is no per-component proxy value.
  # To exclude a specific component's targets from the proxy, add those
  # hostnames/suffixes to noProxy instead of configuring the proxy per-component.
  # Example: noProxy: ".cluster.local,europe-west3-docker.pkg.dev"
  httpProxy: null
  httpsProxy: null
  noProxy: null
  allProxy: null

# Registry path prefix prepended to image repository names (e.g. "zeta/zeta-guard/")
registry_name: ""

# additionalLabels is a map of labels added to every zeta-guard resource.
additionalLabels: {}

# ---------------------------------------------------------------------------
# Authserver (Keycloak-based ZETA authorization server)
# ---------------------------------------------------------------------------
authserver:
  # --- ServiceAccount ---
  serviceAccount:
    create: true
    name: authserver

  # --- Pod security context (applied to the pod spec) ---
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  # --- PodDisruptionBudget ---
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  # --- Image ---
  image:
    repository: keycloak-zeta
    tag: 1.3.1
  imagePullPolicy: Always
  imagePullSecrets: [ ]

  # --- Scaling ---
  replicaCount: 1

  # --- Hostname ---
  # Public hostname used in Keycloak's frontend URL.
  hostname: "zeta-demo.example"
  wellKnownAuthServerPath: /
  # Separate hostname for the Keycloak admin console and admin REST API.
  # When set, /auth/admin is blocked via the PEP proxy and a dedicated admin
  # ingress is created. Terraform and CI/CD runners must use this hostname.
  # IP-based access restriction must be configured at the infrastructure layer
  # (e.g. Cloud Armor, NetworkPolicy, firewall rules).
  adminHostname: "admin.zeta-demo.example"
  # TLS Secret for the admin ingress. Empty defaults to "zeta-guard-admin-tls".
  # For local/KIND reuse the main cert: set "zeta-guard-tls" and add adminHostname
  # to issuers.local.dnsNames.
  adminTlsSecretName: ""

  # --- Admin credentials ---
  # Must be set on first deployment; existing Secrets are retained on upgrade.
  admin:
    username: admin
    password: ""

  # --- Genesis hash & SMC-B hashing pepper ---
  # Required on first install; leave empty on upgrades.
  # The chart reads the existing cluster Secret automatically (lookup) and leaves
  # it unchanged. To rotate a value, set it explicitly during helm upgrade —
  # see Quickstart guide for consequences.
  # Generate: genesisHash=$(openssl rand -hex 32)  smcbHashingPepper=$(uuidgen)
  genesisHash: ""
  smcbHashingPepper: ""

  # --- Provider configuration (ZETA SMC-B token-exchange) ---
  provider:
    smcB:
      opaBaseUrl: "http://opa:8181"
      opaSimulationBaseUrl: "http://opa-simulation:8181"
      decisionPath: "/v1/data/policies/zeta/authz/decision"
      connectionTimeoutMs: 1000
      readTimeoutMs: 2000
      # HTTP timeouts for the SMC-B OCSP revocation check
      ocspConnectTimeoutMs: 1000
      ocspReadTimeoutMs: 3000
      # Default false (fail-open): only a REVOKED response denies; undetermined status
      # (unreachable/timeout/unknown) is allowed so the service stays operational during
      # an OCSP outage. Set true to also deny when the status cannot be determined.
      ocspFailClosed: false

  # --- Client registration / session TTLs ---
  config:
    maxClients: "256"
    clientRegistrationTTL: "PT5M"
    clientRegistrationSchedulerInterval: "PT2M"
    # Idle timeouts of the Keycloak SSO sessions (ISO-8601 durations).
    userIdleTTL: "P1Y"
    clientIdleTTL: "P1Y"
    # ZETA Stufe 2: OIDC client flow via a federated sectoral IDP (SE-KIDP),
    # instead of the SMC-B token exchange (env ZETA_OIDC_FLOW_ENABLED).
    # Required for authserver.sekidp.mtls below.
    oidcFlowEnabled: false

  # --- Truststore hot reload ---
  # Picks up refreshed SMC-B, TPM and OCSP trust anchors while the server runs, so a
  # provisioning run takes effect without restarting the pod. Only has an effect if
  # something rewrites the files at runtime — see provisioningProcessor.schedule.
  truststoreReload:
    enabled: true
    # ISO-8601 duration between two checks, hours or less. First check runs one interval after startup.
    interval: PT1H

  # --- SE-KIDP client mTLS (ZETA Stufe 2) ---
  # Client identity the authserver presents to the sectoral IDP. Active as soon as
  # keystore.secretName is set — which requires config.oidcFlowEnabled: true,
  # otherwise the render fails (the keystore would be silently ignored).
  sekidp:
    mtls:
      keystore:
        secretName: ""                 # Secret holding the PKCS12 keystore
        secretKey: sekidp-client.p12   # key within that Secret
      keystorePassword:
        secretName: ""                 # Secret holding the keystore password
        secretKey: ""

  # --- Database encryption / integrity (VAU, spree integrity provider) ---
  # Off by default. See the "known issues" section of the release notes before
  # enabling: the readiness endpoint reports ready prematurely, so raise
  # probes.readiness.initialDelaySeconds (e.g. 240) alongside.
  dbEnc:
    enabled: false
    columnEncryptionEnabled: false
    integrityChecksEnabled: false
    integrityRowChecksEnabled: false
    integrityTableChecksEnabled: false
    periodicRowChecksEnabled: false
    # Behaviour on an integrity violation: lockdown (reject requests) / shutdown (exit).
    lockdownOnError: false
    shutdownOnError: false
    # Retry budget while waiting for the keychain at startup.
    bootstrapInterval: "PT30S"
    bootstrapAttempts: 15
    keychainGenerator:
      image:
        repository: keychain-generator
        tag: 2.0.4
      imagePullPolicy: IfNotPresent

  # --- Additional trusted CAs ---
  # CAs Keycloak trusts for its own outbound HTTPS calls; each is mounted under
  # conf/truststores and auto-imported. Empty -> JVM defaults.
  # Per entry set exactly one: secretName+secretKey, or an inline PEM cert.
  additionalTrustedCAs: []
  # - secretName: zeta-guard-tls
  #   secretKey: ca.crt
  # - cert: |
  #     -----BEGIN CERTIFICATE-----
  #     ...
  #     -----END CERTIFICATE-----

  # --- HSM integration ---
  hsm:
    # Activates HSM Proxy connection at authserver startup (HSM_PROXY_ENDPOINT).
    # When false, the HsmProxyKeycloakFactory SPI is a no-op.
    enabled: false
    endpoint: ""   # gRPC address of the HSM Proxy, e.g. "hsm-sim:50051"
    # Key-encryption key for the database encryption keychain (HSM_PROXY_KEK_ID).
    # Only relevant with authserver.dbEnc.enabled: true.
    dbEnc: {}
    # dbEnc:
    #   keyId: "zeta-guard-keycloak-kek-v1"
    tls:
      # Pod-level HTTPS on port 8443 using the HSM-backed key.
      # Requires authserver.hsm.enabled: true and a running HSM Proxy.
      enabled: false
      keyId: ""    # TLS key ID in the HSM
    tokenSigning:
      # JWT token signing via HSM-backed ES256 key. Requires hsm.enabled: true.
      enabled: false
      keyId: ""    # Token signing key ID in the HSM
      failClosed: true   # Refuse software-key fallback when HSM is unreachable

  # --- TLS (non-HSM) ---
  tls:
    # Pod-level HTTPS on port 8443 using a cert/key from a Kubernetes Secret.
    # The Secret must contain keys tls.crt and tls.key.
    enabled: false
    certSecretName: ""

  # --- Keycloak build init container ---
  initContainer:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop: [ "ALL" ]
    resources:
      limits:
        cpu: "2"
        memory: "1Gi"
      requests:
        cpu: "500m"
        memory: "512Mi"

  # --- Main Keycloak container ---
  container:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop: [ "ALL" ]
    resources:
      limits:
        cpu: "8"
        memory: "4Gi"
      requests:
        cpu: "4"
        memory: "4Gi"
    extraVolumeMounts: []

  # --- Extra volumes injected into the Deployment ---
  # Mounted via container.extraVolumeMounts above.
  extraVolumes: []

  # --- Database connection pool ---
  # replicaCount × maxSize (+ ~25 reserve) must stay ≤ cloudnativePg.parameters.maxConnections (100 here).
  # Enforced at render time by templates/db/cnpg-cluster.yaml.
  dbPool:
    minSize: 10
    maxSize: 75

  # --- HTTP thread pool ---
  httpPool:
    maxThreads: 200

  # --- Logging ---
  # Supports per-category overrides separated by comma, e.g. "INFO,org.keycloak:DEBUG"
  # For production use "WARN" or higher to reduce log volume.
  log:
    level: "WARN"

  # --- Startup verbosity ---
  # true adds --verbose to the start command (full stacktraces on startup errors).
  verbose: false

  # --- Test mode ---
  # Disables Keycloak's outbound TLS trust manager. Test environments only.
  testmode: false

  # --- Probe thresholds ---
  probes:
    liveness:
      initialDelaySeconds: 0
      periodSeconds: 15
      failureThreshold: 5
    readiness:
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 5
    startup:
      initialDelaySeconds: 30
      periodSeconds: 10
      failureThreshold: 20

  # --- Host alias (test setup: add /etc/hosts entry) ---
  hostAlias: {}

  # --- Pod metadata ---
  podLabels: {}
  podAnnotations: {}

  # --- Scheduling ---
  affinity: {}
  tolerations: [ ]

# --- Authserver feature toggles (top-level) ---

# Log output format: "json" for structured logging, "default" for plain text
authServerLogConsoleOutput: json

# Enable the Keycloak metrics endpoint
authServerMetricsEnabled: true

# Enable OpenTelemetry tracing for authserver
authServerTracingEnabled: true

# ---------------------------------------------------------------------------
# PEP-Proxy (nginx-based Policy Enforcement Point)
# ---------------------------------------------------------------------------
pepproxy:
  # --- ServiceAccount ---
  serviceAccount:
    create: true
    name: pep-proxy

  # --- Pod security context (applied to the pod spec) ---
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  # --- Image ---
  image:
    repository: ngx_pep
    tag: 1.3.0
  imagePullPolicy: Always
  imagePullSecrets: [ ]

  # --- Scaling ---
  replicaCount: 1

  # --- nginx worker tuning ---
  # workerProcesses: "auto" = one per CPU.
  workerProcesses: auto
  workerConnections: 16384
  # Per worker process; must cover ~2x workerConnections (client + upstream side of
  # each proxied connection), otherwise nginx clamps below workerConnections.
  workerRlimitNofile: 40960

  # --- Resources ---
  resources:
    limits:
      cpu: "2"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "200Mi"

  # --- Container security context ---
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop: [ "ALL" ]

  # --- Well-known base URL ---
  wellKnownBase: http://localhost
  wellKnownResourceSuffix: /pep/

  # --- ASL (Application Security Layer) ---
  # Controls whether ASL is enabled (true) or disabled (false).
  asl_enabled: true
  # aslRootCA: "GEM.RCA7 TEST-ONLY"
  # Specify an override OCSP URL or "off" to disable stapling:
  # aslOcsp: "http://example.org/ocsp"
  # Change maximum validity of cached OCSP responses (default 24h per A_24624-01):
  # alsOcspTtl: 5m
  # HSM-backed ASL signer key as store URI, e.g. "store:hsm:asl-signer.p256".
  # Replaces the signer-key file from the asl-identity secret; requires hsmProxyAddr.
  asl_hsm_key: null

  # --- nginx configuration ---
  nginxConf:
    configMapName: pep-nginx-conf
    # Set to true to have the chart generate the ConfigMap from values below.
    generateConfigMap: true

    # Accept invalid upstream TLS certificates (test only!)
    httpClientAcceptInvalidCerts: false

    # ASL test mode — disables encryption. NEVER USE IN PRODUCTION!
    aslTestmode: false

    # Enable (true) or disable (false) no-travel enforcement
    noTravel: false

    # Fachdienst URL forwarded to by the PEP as optional convenience variable
    # for use in the `locations` template string.
    # Irrelevant when using `proxyLocations`.
    fachdienstUrl: "https://fachdienst"

    # JWKS issuer for PoPP key validation.
    # Set to null to disable PoPP.
    poppIssuer: "http://localhost"

    # Accepted validity of a PoPP token:
    #   "quarter"        — within the current quarter (gemSpec_ZETA, A_26477)
    #   duration string  — fixed period since iat, with optional unit (d,h,m,s);
    #                      defaults to seconds when no unit is given, e.g. "1d"
    poppValidity: quarter

    # OIDC issuer (iss) of the authorization server
    pepIssuer: "http://authserver/auth/realms/zeta-guard"

    # Audience required for a valid access token
    requiredAudience: "test"

    # Scopes required for a valid access token
    requiredScopes: [ ]

    # Structured configuration of the proxied resource-server paths — prefer this.
    # Each entry renders an http-level `upstream` block (with connection keepalive)
    # plus an exact + trailing-slash location pair, always including
    # proxy_headers.conf. `websocket: true` entries are additionally routed via a
    # dedicated ingress WebSocket minion, which keeps upstream keepalive intact on
    # all other locations.
    proxyLocations: []
    # - path: /pep                        # public path; no trailing slash
    #   upstream: http://fachdienst:8080  # scheme://host[:port] — no path here; port defaults per scheme
    #   upstreamPath: /                   # optional URI prefix on the upstream (default /)
    #   websocket: false                  # WebSocket upgrade handling (+ ingress ws routing)
    #   bypassAsl: false                  # public without ASL — mind your spec!
    #   keepalive: 32                     # optional; idle upstream conns kept per worker
    #   extraConfig: |                    # optional; tpl-rendered, appended inside both blocks
    #     proxy_ssl_verify on;

    # DEPRECATED in favor of `proxyLocations` above — raw nginx `location` blocks
    # (with `proxy_pass`) as a Go template string. Scheduled for removal; setting
    # both at once fails the render, so migrate entirely rather than mixing.
    # The PEP header handling (`include proxy_headers.conf;` — strips client-supplied
    # credentials and ZETA-* headers, sets the PEP's own headers + Forwarded) is included
    # once at the `server` level, so plain `proxy_pass` locations inherit it automatically.
    # nginx `proxy_set_header` inheritance is non-additive: a location that declares its own
    # `proxy_set_header` (e.g. a WebSocket upgrade) does NOT inherit it and must repeat
    # `include proxy_headers.conf;` itself — otherwise a `pep on;` location returns HTTP 500
    # (ProxyHeadersMissing). `proxyLocations` generates all of this correctly.
    locations: ""

  # --- HSM integration for PEP ---
  # Set to gRPC URL of HSM Proxy to enable ossl_hsm integration
  hsmProxyAddr: null
  # HSM key ID for the TLS listener ("store:hsm:<hsmTlsKeyId>")
  hsmTlsKeyId: tls.p256
  # Certificate matching the HSM TLS key, relative to /etc/nginx. The default is
  # baked into the PEP image — mount your own via extraVolumeMounts.
  hsmTlsCert: tls.p256.pem

  # --- TLS parameters of the PEP listener ---
  # nginx snippet (ssl_protocols, ciphers, curves) implementing the gematik TLS AFOs.
  # See chart values.yaml for the full default block; keep in sync with
  # nginx-ingress' http-snippets when overriding.
  # tlsConfig: |
  #   ssl_protocols TLSv1.3 TLSv1.2;

  # --- Pod metadata ---
  podLabels: {}
  podAnnotations: {}

  # --- Scheduling ---
  affinity: {}
  tolerations: [ ]

  # --- Extra volumes injected into the Deployment ---
  extraVolumes: []
  extraVolumeMounts: []

# --- PEP-Proxy feature toggles (top-level) ---

# Enable metrics endpoint (requires pepproxyMetricsExporterImage)
pepproxyMetricsEnabled: true

# nginx-prometheus-exporter image (required when pepproxyMetricsEnabled is true)
pepproxyMetricsExporterImage: nginx/nginx-prometheus-exporter@sha256:0bf30a7c0ec24554a87063905f505a4ae4ea49043eab68f03660474512ba5fc8

# Enable tracing for nginx
pepproxyTracingEnabled: true

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------

# DB mode switch:
# - cloudnative: managed by CloudNativePG operator
# - external: use external DB (provide authserverDb.kcDb, kcDbUrl, kcDbSchema, kcDbSecretName)
databaseMode: cloudnative

authserverDb:
  kcDb: postgres

# CloudNativePG DB connection settings (databaseMode=cloudnative).
cloudnativeDbUrl: "jdbc:postgresql://keycloak-db-rw:5432/keycloak"
cloudnativeDbSecretName: "keycloak-db-app"
cloudnativeDbSchema: "public"

# CloudNativePG cluster settings (databaseMode=cloudnative).
# WARNING: instances=1 is only suitable for dev/test.
# For production use instances >= 3.
cloudnativePg:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-standard-trixie
  imagePullPolicy: ""
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      # No cpu limit: avoids CFS throttling; cpu.request is the floor, DB can burst.
      memory: 1Gi
  affinity: {}
  monitoring: {}
  # enablePDB: leave unset for the CNPG default; set false on single-instance stages
  storage:
    size: 10Gi
    # storageClass shortcut; empty → cluster default StorageClass
    storageClass: ""
    # Per-env PVC template (e.g. a specific storageClassName); empty → CNPG default
    pvcTemplate: {}
  # Optional dedicated volume for the write-ahead log (pg_wal). Empty → WAL lives on
  # the data volume above (CNPG default). Split it off for write-heavy stages so WAL
  # fsync does not contend with checkpoint flushes.
  walStorage: {}
  # walStorage:
  #   size: 16Gi
  #   storageClass: managed-csi-premium
  parameters:
    sharedBuffers: 24MB
    maxConnections: 100
  # Additional reloadable postgresql.conf parameters (snake_case keys, string values).
  extraParameters:
    # full_page_writes after each checkpoint balloon WAL (~3x observed); compression
    # costs spare CPU and cuts checkpoint frequency and write volume alike.
    wal_compression: "on"
    # Further examples:
    # max_wal_size: "2GB"                 # SOFT cap; WAL shares the data volume by
    # min_wal_size: "1GB"                 # default — raise only with more disk or walStorage
    # log_min_duration_statement: "200"   # log statements slower than 200ms
    # track_io_timing: "on"
  # Preloaded libraries; extensions (e.g. pg_stat_statements) are auto-CREATEd by the
  # operator. NOTE: changes here trigger a postgres restart.
  sharedPreloadLibraries: []
  pooler:
    enabled: false
  backup:
    enabled: false

# ---------------------------------------------------------------------------
# Ingress & TLS
# ---------------------------------------------------------------------------

# Name of a namespace-scoped cert-manager Issuer used to obtain the Ingress TLS
# certificate. When set, the Ingress is annotated with cert-manager.io/issuer
# and the named Issuer must exist in the release namespace. Takes precedence over
# clusterIssuer. Use this when governance/security policy forbids ClusterIssuers.
# Leave empty ("") to use clusterIssuer instead.
issuer: ""

# Name of a cluster-scoped cert-manager ClusterIssuer used to obtain the Ingress
# TLS certificate. Annotates the Ingress with cert-manager.io/cluster-issuer.
# Used only when issuer is empty. The named ClusterIssuer must exist in the
# cluster.
clusterIssuer: "letsencrypt-cd"

# Name of the Kubernetes Secret containing the gematik certificate chain for
# verifying the cosign signature of the provisioning data image. The Secret
# must have a key 'certchain.pem' holding a PEM-encoded X.509 certificate
# chain (CA and intermediate certs, no leaf cert). Required.
# For production: create your own Secret with gematik production certificates.
# For tests: use gematik-image-signer-test (included in the chart).
imageTrustCertchainSecretRef: gematik-image-signer-test

# IngressClass used by generated Ingress resources.
# With the bundled NIC: keep equal to nginx-ingress.controller.ingressClass.name.
# With an external controller: set to your class (e.g. gce, openshift-default).
ingressClassName: "nginx"

# Deploy Ingress resources
ingressEnabled: true
ingressMasterAnnotations: {}
ingressMinionAnnotations: {}

# Deploy the bundled nginx-ingress controller
nginxIngressEnabled: true
# When true, add the cookie-based sticky-session lb-method on the minion ingress.
# Needs the NIC to provide the $zeta_route http-snippets (the bundled subchart ships
# them; external NICs must add them). Disable where the NIC lacks them.
nginxIngressLbMethod: true

# When true, drop spec.tls from the master ingress so TLS can be configured via
# ingressMasterAnnotations."nginx.org/server-snippets" — required for ossl_hsm support.
nginxIngressHsm: false

# One-shot pre-upgrade hook that adopts foreign, ingress-shim-created Certificates
# (zeta-guard-tls / zeta-guard-admin-tls) into the helm release. Only rendered while
# such a Certificate exists; afterwards the chart manages it normally.
certificateAdoption:
  # Needs kubectl + bash; same default as the token-renewer worker image.
  image: google/cloud-sdk:549.0.0

nginx-ingress:
  controller:
    readOnlyRootFilesystem: true
    # NIC v5.4.0+ uses /tmp for thread-local temp files
    volumes:
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: tmp
        mountPath: /tmp
    enableCustomResources: false
    ingressClass:
      name: nginx
    service:
      type: LoadBalancer
      externalTrafficPolicy: Local
    config:
      entries:
        ssl-protocols: "TLSv1.2 TLSv1.3"
        ssl-ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384"
        ssl-ecdh-curve: "prime256v1:secp384r1:brainpoolP256r1:brainpoolP384r1"
        ssl-session-cache: "none"
        ssl-session-tickets: "on"
        ssl-session-timeout: "5m"
        ssl-stapling: "off"
        # Use client order
        ssl-prefer-server-ciphers: "false"
    resources:
      limits:
        cpu: "2"
        memory: "1Gi"
      requests:
        cpu: "250m"
        memory: "200Mi"

# Use OpenShift Ingress Route-Controller; creates edge-terminated routes with TLS redirect
openshiftIngress:
  enabled: false
  certName: ""

# ---------------------------------------------------------------------------
# Routing & Development
# ---------------------------------------------------------------------------

# When true, the Ingress routes traffic via tiger-proxy instead of direct services.
routeViaTigerProxy: false

# When enabled, injects a changing annotation to force pod rollouts on each helm upgrade.
devMode: false

# ---------------------------------------------------------------------------
# OPA (Open Policy Agent)
# ---------------------------------------------------------------------------
opa:
  replicaCount: 1
  image:
    repository: opa
    tag: 1.19.1-static
  imagePullPolicy: IfNotPresent
  imagePullSecrets: [ ]

  # OPA server log level: debug|info|warn|error
  logLevel: info

  # If enabled, OPA will log decision logs to console.
  logDecisions: false

  # Log OPA plugin status updates to the console.
  logStatusUpdates: false

  # Kubernetes ServiceAccount name for OPA pods (blank = default)
  serviceAccountName: ""

  # Require an activated bundle for readiness (/health?bundles=true) when bundle mode is
  # on, so a failed bundle download surfaces as NotReady instead of staying silent.
  bundleHealthCheck: false

  # Periodically restart the opa (and opa-simulation) Deployment via
  # `kubectl rollout restart`.
  # Enabled here so `make template-demo` also renders and lints the rollout-restart CronJob;
  # the chart default is off (opt-in per stage).
  rolloutRestart:
    enabled: true
    # Daily at 03:00, fixed Europe/Berlin timezone.
    schedule: "0 3 * * *"
    backoffLimit: 5
    # Empty → the chart creates its own ServiceAccount plus minimal RBAC (get/patch on
    # just the opa Deployments). Set to use a pre-provisioned ServiceAccount instead;
    # the chart then creates no RBAC and expects equivalent rights to exist.
    serviceAccountName: ""

  # --- Container security context ---
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop: [ "ALL" ]

  # --- CronJob security context (WIF token renewer) ---
  cronjobSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    capabilities:
      drop: [ "ALL" ]

  # --- Resources ---
  resources:
    limits:
      cpu: "2"
      memory: "1Gi"
    requests:
      cpu: "100m"
      memory: "200Mi"

  # --- Health probes ---
  health:
    liveness:
      periodSeconds: 20
    readiness:
      periodSeconds: 20

  # --- Bundle mode (disabled = inline policyRego is used) ---
  bundle:
    enabled: false
    # Logical service name used in OPA config
    serviceName: registry
    # Base URL of the OCI registry
    url: ""
    # Fully qualified bundle resource (including registry host)
    resource: ""
    credentials:
      secretRef:
        name: ""
    polling:
      min_delay_seconds: 60
      max_delay_seconds: 60
    # Signature verification for OPA bundles
    verification:
      enabled: true
      keyId: ""
      algorithm: ""
      # Optional: must match the scope embedded in the bundle signature.
      # Omit if the bundle was signed without a scope.
      scope: ""

  # --- OPA Simulation ---
  simulation:
    enabled: true
    replicaCount: 1
    bundle:
      # Optional explicit simulation bundle resource. If empty, the chart derives from active resource.
      resource: ""
      # Optional signature-verification override for the simulation bundle only
      # (same keys as opa.bundle.verification). Empty → the shared one applies.
      verification: {}

  # --- Workload Identity Federation (AKS → GCP STS) for GAR access ---
  workloadIdentityFederation:
    enabled: false
    sts:
      sa: ""
    tokenRenewer:
      enabled: true
      schedule: "*/45 * * * *"
      backoffLimit: 5
    worker:
      image: google/cloud-sdk:549.0.0
      imagePullPolicy: IfNotPresent
      imagePullSecrets: [ ]
      resources:
        limits:
          cpu: "250m"
          memory: "200Mi"
        requests:
          cpu: "50m"
          memory: "50Mi"

  # --- Pod metadata ---
  podLabels: {}
  podAnnotations: {}

  # --- Scheduling ---
  affinity: {}
  tolerations: [ ]

# --- OPA feature toggles (top-level) ---

# Enable distributed tracing with a gRPC endpoint
opaDistributedTracingEnabled: true

# Export bundle and plugin status metrics to Prometheus
opaStatusPrometheus: true

# --- OPA policy / data configuration ---
opaPolicy:
  # Enable console decision logs in OPA
  logDecisions: true
  # Default fake policy: allow-all decision object.
  # In production, policies are loaded from PIP-PAP via bundle mode.
  policyRego: |
    package policies.zeta.authz

    decision := {
      "allow": true,
      "ttl": {
        "access_token": 300,
        "refresh_token": 86400,
      },
    }

# ---------------------------------------------------------------------------
# Notification Service (ZETA Stufe 2, opt-in)
# ---------------------------------------------------------------------------
# Push notification management and forwarding service. Two variants are deployed
# from one image repo — "-rs" (resource-server facing) and "-fdv" (FdV facing) —
# sharing a single Postgres database. Brings its own PEP location block and
# discovery document. Off by default; enable per stage.
notificationService:
  enabled: false
  replicaCount: 1
  serviceAccountName: ""
  image:
    repository: notification-service
    # Tag prefix only; the chart appends "-rs" / "-fdv" per variant.
    tag: 1.3.0
  # Optional per-variant digest pins (the two variants differ). Empty → tag only.
  # A per-variant *tag* is not supported and would be ignored.
  rs:
    image:
      digest: ""
  fdv:
    image:
      digest: ""
  imagePullPolicy: Always
  imagePullSecrets: []

  # --- Persistence (both variants share one database) ---
  db:
    # cloudnative → provision a dedicated CNPG Cluster; external → point
    # jdbcUrl/secretName at an out-of-band Postgres.
    mode: cloudnative
    # CNPG Cluster name and single source of truth: the -rw/-app resources,
    # NetworkPolicy selectors and the derived jdbcUrl/secretName all follow it.
    clusterName: "notification-db"
    # Empty in cloudnative mode → "jdbc:postgresql://<clusterName>-rw:5432/notification".
    jdbcUrl: ""
    # Empty in cloudnative mode → "<clusterName>-app".
    secretName: ""
    # Init container that blocks startup until Postgres accepts TCP, so Flyway does
    # not crash-loop while the database comes up.
    waitForDb:
      enabled: true
    # CNPG Cluster settings for mode=cloudnative — plain Postgres, no pg_cron
    # (record purging happens in-app). See chart values.yaml for the full surface
    # (resources, parameters, walStorage, monitoring, backup).
    cloudnativePg:
      instances: 1
      storage:
        size: 2Gi

  # --- Application configuration ---
  env:
    # Allowlist of Push Gateway base URLs. Empty fails startup validation —
    # set at least one when enabling the service.
    pushGatewayAllowedBaseUrls: []
    # Allowed notification channels, comma-separated. No default.
    channelsAllowed: ""
    # HSM-backed at-rest sealing of stored notification data.
    persistenceSealingEnabled: false

  # --- Outbound connection to the Push Gateway ---
  pushGateway:
    # Extra CAs trusted for the outbound HTTPS calls, in addition to the system
    # defaults. Per entry set exactly one: secretName+secretKey, or an inline cert.
    trustedCAs: []
    # Client certificate for outbound mTLS. Active once both clientCert.secretName
    # and clientKey.secretName are set.
    mtls:
      clientCert:
        secretName: ""
        secretKey: tls.crt
      clientKey:
        secretName: ""
        secretKey: tls.key
      # Optional password for an encrypted private key.
      keyPassword:
        secretName: ""
        secretKey: ""

  # --- Quarkus HTTP access log ---
  accessLog:
    enabled: false
    # Empty → Quarkus "common" pattern. %{i,Header-Name} captures a request header.
    pattern: ""

  # --- Optional history feature (A_29974) ---
  # Single knob driving the service's NOTIFICATION_HISTORY_ENABLED env, the
  # discovery scopes_supported, and (via terraform) the Keycloak scope.
  historyEnabled: false

  # RFC 9728 resource identifier, combined with pepproxy.wellKnownBase to form the
  # audience. Single leading-slash segment, decoupled from the /push/v1 API prefix.
  wellKnownResourceSuffix: /notification-service

# ---------------------------------------------------------------------------
# Provisioning Processor (shared init container for trust-anchor provisioning)
# ---------------------------------------------------------------------------
# Used by authserver, OPA, OPA-simulation, and PEP-Proxy as init container.
provisioningProcessor:
  provisioningContainer: "europe-west3-docker.pkg.dev/gematik-pt-zeta-test/zeta-provisioning/zeta-guard-provisioning:latest"
  # OCSP validation of the SMC-B / TSL certificates (env PROCESSORS_TSL_OCSP_ENABLED).
  # Default true per A_24624-01; false skips the live OCSP checks (test envs only).
  tslOcspEnabled: true
  # Daily re-run of the provisioning processor as a resident native sidecar, so refreshed
  # trust anchors take effect without restarting the pod (see authserver.truststoreReload).
  # enabled: false runs it as a one-shot init container instead.
  # Needs Kubernetes >= 1.32 (OpenShift 4.19) and a processor image supporting SCHEDULE_TIME.
  schedule:
    enabled: true
    # Local time of the daily re-run, format HH:MM — not a cron expression.
    time: "03:00"
    # IANA timezone the time above is read in.
    timezone: "Europe/Berlin"
  # --- CA for the provisioning container registry (Option A and B are mutually exclusive) ---
  # Option A (existing default): mount the CA from a Secret. Auto-wires env var
  #           PROVISIONING_CONTAINER_REGISTRY_CA_FILE + mount /var/registry-ca/ca.crt.
  # provisioningContainerCaSecretRef:
  #   name: registry-ca
  #   key: ca.crt
  #
  # Option B: mount the CA from a ConfigMap (e.g. the bundle generated by OpenShift custom PKI).
  #           Same auto-wiring. SecretRef takes precedence if both are set.
  # provisioningContainerCaConfigMapRef:
  #   name: zeta-guard-openshift-ca-bundle
  #   key: ca-bundle.crt
  #
  # Option C: generic mount of any source (Secret/ConfigMap/projected/CSI/...). The operator
  #           wires up the volume, mount and env var themselves.
  # extraEnv:
  #   - name: PROVISIONING_CONTAINER_REGISTRY_CA_FILE
  #     value: /var/custom-ca/ca.crt
  # extraVolumes:
  #   - name: custom-ca
  #     configMap:
  #       name: my-ca-bundle
  # extraVolumeMounts:
  #   - name: custom-ca
  #     mountPath: /var/custom-ca
  #     readOnly: true
  #
  # --- Registry credentials (for registries that do not allow anonymous access) ---
  # Reference an existing Secret (e.g. created from a SealedSecret) holding the registry
  # username and token/password. Auto-wires the env vars PROVISIONING_CONTAINER_REGISTRY_USERNAME
  # and PROVISIONING_CONTAINER_REGISTRY_TOKEN via secretKeyRef. Leave unset for anonymous access.
  # registryCredentialsSecretRef:
  #   name: registry-credentials
  #   usernameKey: username   # default: username
  #   tokenKey: token         # default: token
  image:
    repository: provisioning-processor
    tag: 1.3.0
  imagePullPolicy: Always
  resources:
    limits:
      cpu: "1"
      memory: "200Mi"
    requests:
      cpu: "100m"
      memory: "100Mi"
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    capabilities:
      drop: [ "ALL" ]

# ---------------------------------------------------------------------------
# Gematik connection (OIDC token renewer CronJob)
# ---------------------------------------------------------------------------

# If true, the CronJob ti-sim-token-renewer-cronjob maintains a valid
# access token in the Secret ti-sim-token.
gematikConnectionEnabled: false

gematik:
  tiSiem:
    serviceAccountEmailAddress: ""
    idTokenAudience: ""
  tiSim:
    serviceAccountEmailAddress: ""
    idTokenAudience: ""
  workloadIdentityFederation:
    projectNumber: ""
    poolId: ""
    workloadIdentityProvider: ""

# ---------------------------------------------------------------------------
# Telemetry Gateway (OpenTelemetry Collector)
# ---------------------------------------------------------------------------

# Deploy the telemetry gateway
telemetryGatewayEnabled: true

# Fully-qualified hostname the telemetry-gateway is reached at. Empty uses the bundled
# telemetry-gateway's bare service name; set to an FQDN (e.g.
# <svc>.<namespace>.svc.cluster.local) when the bare name does not resolve. Changes only
# the address — telemetry must always go to the telemetry-gateway (its redaction and
# ti_sim/ti_siem filters are not bypassable).
telemetryGatewayHost: ""

# Sizes the PersistentVolumeClaim backing the collector's sending queue.
telemetryGatewaySendingQueuePVCResources:
  requests:
    storage: 5Gi

# Access modes of that PVC. ReadWriteMany for shared-filesystem storage.
telemetryGatewaySendingQueuePVCAccessModes:
  - ReadWriteOnce

# StorageClass of that PVC. Empty omits the field -> cluster default class.
telemetryGatewaySendingQueuePVCStorageClass: ""

telemetry-gateway:
  mode: deployment
  image:
    repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
  command:
    name: otelcol-k8s
  resources:
    limits:
      cpu: "4"
      memory: "2Gi"
    requests:
      cpu: "100m"
      memory: "200Mi"
  # No securityContext here on purpose — this inherits values.yaml, which is
  # the only place in this chart that pins a UID/GID: the collector needs a
  # known non-root identity that can write the file-storage PVC. OpenShift
  # rejects both, because its SCC assigns UID and GID from the namespace's
  # allocated range — hand them over there with an explicit `fsGroup: null` /
  # `runAsUser: null`. Explicit `null`, not omission: Helm merges maps, so a
  # values file that simply leaves these keys out still inherits the 1000 from
  # values.yaml. See docs/explanations/Telemetry.md#openshift.
  #
  # podSecurityContext:
  #   fsGroup: null
  # securityContext:
  #   runAsNonRoot: true
  #   runAsUser: null
  extraVolumeMounts: [ ]
  extraVolumes: [ ]
  ports:
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
  additionalLabels:
    app.kubernetes.io/part-of: zeta-guard
  config:
    exporters:
      # Override with environment-specific exporter, e.g.:
      # otlp_grpc/ti_siem:
      #   endpoint: https://otlp.v1.bd.prod.ccs.gematik.solutions:443
      #   auth:
      #     authenticator: bearertokenauth/ti-siem
      # otlp_grpc/ti_sim:
      #   endpoint: https://otlp.v1.bd.prod.ccs.gematik.solutions:443
      #   auth:
      #     authenticator: bearertokenauth/ti-sim
      debug: {}
    processors:
      redaction/zeta_guard:
        allow_all_keys: true
        blocked_key_patterns:
          - ".*token.*"
        # See chart values.yaml for full list of blocked_values patterns
        blocked_values: [ ]
        ignored_key_patterns:
          - '^app\.kubernetes\.io\/.+'
          - '^container\..+'
          - '^k8s\..+'
          - '^net\..+'
          - '^log\..+'
          - '^otel\..+'
          - '^service\..+'
        ignored_keys:
          - http.user_agent
        redact_all_types: true
        summary: info
    service:
      extensions:
        - health_check
      # Setting a pipeline to null switches it off — this demo keeps only the
      # dienst_hersteller streams and drops the gematik TI-SIM / TI-SIEM ones,
      # which need the gematik OTLP endpoints plus the bearertokenauth extensions
      # (see gematikConnectionEnabled and the exporters above).
      # NOTE: these nulls reach the collector config verbatim, so this demo config
      # documents the value surface — it is not a bootable collector config.
      pipelines:
        logs/ti_sim: null
        logs/ti_siem: null
        metrics/ti_sim: null
        metrics/ti_siem: null
        traces/ti_sim: null
        traces/ti_siem: null

# ---------------------------------------------------------------------------
# Egress NetworkPolicies (A_27864-01)
# ---------------------------------------------------------------------------
# When enabled, each ZETA Guard pod gets an egress NetworkPolicy that restricts
# outbound traffic to explicitly listed IP blocks. Internal cluster communication
# (DNS, pod-to-pod) is always allowed via pod/namespace selectors.
# Ports are not restricted in this release (Phase 1 — IP-only).
#
# Set ipBlocks per category (list of CIDR strings, e.g. ["1.2.3.4/32"]).
# Leave empty to allow no external egress for that category.
#
# IP acquisition:
#   - gematik endpoints (telemetry, SIEM, PoPP): dig +short <hostname>
#   - Google Artifact Registry: https://www.gstatic.com/ipranges/cloud.json (filter europe-west3)
#   - OCSP responders: openssl x509 -in <cert.pem> -text | grep -A2 "OCSP" → dig +short <ocsp-host>
#
# For provider-internal traffic, set providerInternal.allowAll: true to bypass
# IP restrictions entirely (e.g. during initial setup).
networkPolicy:
  enabled: false

  # DNS egress peer for the egress NetworkPolicies. Defaults to the upstream
  # Kubernetes / KIND kube-dns service. To target a different DNS service (e.g.
  # OpenShift: openshift-dns / dns.operator.openshift.io/daemonset-dns=default /
  # port 5353, since OVN-Kubernetes evaluates egress post-DNAT), set `to` to a
  # raw peer list — it is rendered as-is and overrides namespaceSelector/
  # podSelector. Do not override the selectors directly: Helm deep-merges maps,
  # so a new label would be added to `k8s-app: kube-dns` (AND semantics) and
  # match no pod. Lists like `to` are replaced wholesale, so they override
  # cleanly.
  dns:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
    ports:
      - port: 53
        protocol: UDP
      - port: 53
        protocol: TCP
    to: []

  egress:
    telemetry: # gematik telemetry data receiver (OTLP)
      ipBlocks: []           # e.g. ["<gematik-otlp-ip>/32"]
    siem: # gematik SIEM
      ipBlocks: [ ]
    artifactRegistry: # ZETA Artifact Registry at gematik (OPA bundles, images)
      ipBlocks: []            # e.g. Google Artifact Registry europe-west3-docker.pkg.dev
    providerArtifactRegistry: # provider-internal artifact registry
      ipBlocks: [ ]
    ocspCabForum: # OCSP/CRL for TLS TSPs per CAB Forum
      ipBlocks: [ ]
    ocspSmcbTsp: # SMC-B TSP OCSP Responder
      ipBlocks: [ ]
    ocspTiPki: # OCSP Responder for TI component PKI
      ipBlocks: [ ]
    pip: # PIP — OPA policy bundle source
      ipBlocks: [ ]
    popp: # PoPP service
      ipBlocks: [ ]
      mock: false             # set true when popp-mocks subchart is deployed (allows egress to app=popp-mock pod, targetPort 8080)
    providerInternal: # provider-internal traffic
      allowAll: false         # true = all egress allowed (no IP filter)
      resourceServers:
        ipBlocks: [ ]
      telemetrySystems:
        ipBlocks: [ ]
      podSelectors: []       # cluster-local pods via podSelector+targetPort (kindnet post-DNAT); e.g. [{matchLabels: {app: testfachdienst}, port: 8080}]
