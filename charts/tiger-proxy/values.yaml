global:
  imagePullSecrets: []
  registry: europe-west3-docker.pkg.dev/gematik-pt-zeta-prod/zeta-dcr/
  registry_host: "europe-west3-docker.pkg.dev/gematik-pt-zeta-prod/zeta-dcr/"
  enableDNSRedirect: false
  # Istio PeerAuthentication resources
  istio:
    enabled: false
  dns:
    tigerStaticClusterIP: "10.96.3.11"
    redirects:
      - fqdn: ehca.gematik.de
        proxyRoutes: []
      - fqdn: cert-mock.zeta.test
        proxyRoutes: []
      - fqdn: ocsp-testref.root-ca.ti-dienste.de
        proxyRoutes: []

registry_name: ""

replicaCount: 1

# When enabled, injects a changing annotation to force pod rollouts
# on each helm upgrade/apply even if image tag is unchanged.
devMode: false

image:
  tag: fork-2.0.0
  repository: testproxy
imagePullPolicy: Always

nginxSidecar:
  image:
    registry: ""
    repository: nginxinc/nginx-unprivileged
    tag: "alpine3.22-slim"
  imagePullPolicy: IfNotPresent
  resources: {}
  # resources:
  #   limits:
  #     cpu: "200m"
  #     memory: "128Mi"
  #   requests:
  #     cpu: "50m"
  #     memory: "64Mi"

resources: {}
# resources:
#   limits:
#     cpu: "900m"
#     memory: "1Gi"
#   requests:
#     cpu: "500m"
#     memory: "512Mi"

serviceAccount:
  create: true
  name: tiger-proxy

podDisruptionBudget:
  enabled: false
  # minAvailable: 1
  # maxUnavailable: 1

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext: {}
#  allowPrivilegeEscalation: false
#  readOnlyRootFilesystem: true
#  runAsNonRoot: true
#  capabilities:
#    drop: [ "ALL" ]

proxyConfig:
  proxyPort: 8080
  adminPort: 9999
  otlpHttpClientMaxBodySize: 64m
  proxyLogLevel: INFO
  activateRbelParsing: true
  parsingShouldBlockCommunication: false
  stompClientBufferSizeInMb: 32
  fileSaveInfo:
    writeToFile: false
    fileName: "tiger.log"

  proxyRoutes:
    - from: /testfachdienst
      to: https://testfachdienst:443
    # E-mail binding of the registration: through the PEP with the reduced binding token (see How_to_configure_Ingress.md).
    - from: /auth/realms/zeta-guard/zeta/identity/bind-email
      to: http://pep-proxy-svc/auth/realms/zeta-guard/zeta/identity/bind-email
    - from: /auth
      to: http://authserver/auth
    - from: /td-smcb
      to: http://testdriver-smcb
    - from: /td-oidc
      to: http://testdriver-oidc
    - from: /proxy
      to: http://testdriver-smcb/proxy
    - from: /opa
      to: http://opa:8181
    - from: /opa-simulation
      to: http://opa-simulation:8181
    - from: /.well-known/openid-federation
      to: http://authserver/auth/realms/zeta-guard/.well-known/openid-federation
    - from: /popp
      to: http://popp-statics
    - from: /ocsp/tls
      to: http://zeta-cert-validation-mock/ocsp/tls
    - from: /ocsp/smb
      to: http://zeta-cert-validation-mock/ocsp/smb
    - from: http://ehca.gematik.de/
      to: http://ehca.gematik.de/
      matchForProxyType: false
      preserveHostHeader: true
    - from: http://cert-mock.zeta.test/
      to: http://zeta-cert-validation-mock/
      matchForProxyType: false
      preserveHostHeader: true
    - from: http://ocsp-testref.root-ca.ti-dienste.de/
      to: http://ocsp-testref.root-ca.ti-dienste.de/
      matchForProxyType: false
      preserveHostHeader: true
    # push-gateway chart (charts/push-gateway, push-gateway.enabled) — see
    # docs/how-to_guides/How_to_configure_notification_service.md.
    - from: /push-gateway
      to: http://push-gateway:8080
    # SEK-IDP chart (charts/sekidp, sekidp.enabled) — see How_to_configure_sekidp.md.
    # routeViaTigerProxy is true, so both sekidp Ingress paths hop through tiger-proxy.
    - from: /sekidp
      to: http://sekidp-gsi-server:8085
    - from: /sekidp-fedmaster
      to: http://sekidp-fedmaster:8083
    # mailcatcher chart (charts/mailcatcher, mailcatcher.enabled) — see How_to_configure_mailcatcher.md.
    # Only the web UI (1080) is routed; SMTP (1025) stays ClusterIP-only.
    - from: /mailcatcher
      to: http://mailcatcher:1080/mailcatcher
    - from: /notification-service-rs
      to: http://notification-service-rs:8080
    - from: /
      to: http://pep-proxy-svc
    - from: /zeta
      to: http://pep-proxy-svc/zeta
    # Authserver paths of the client management: to the PEP, which answers 404 (see How_to_configure_Ingress.md).
    - from: /auth/realms/zeta-guard/zeta/clients
      to: http://pep-proxy-svc/auth/realms/zeta-guard/zeta/clients
    - from: /auth/realms/zeta-guard/zeta/identity/email
      to: http://pep-proxy-svc/auth/realms/zeta-guard/zeta/identity/email

  tls: {}

startup:
  livenessProbe:
    url: /actuator/health
    port: 9999
    initialDelaySeconds: 60
  readinessProbe:
    url: /actuator/health
    port: 9999
    initialDelaySeconds: 60
  failureThreshold: 30
  startupPeriodSeconds: 30

service:
  type: ClusterIP
  annotations: {}
  ports:
    proxy: 80
    admin: 9999
  nodePorts:
    proxy: null
    admin: null
  tls: []
