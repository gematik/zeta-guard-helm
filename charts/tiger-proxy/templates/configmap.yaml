{{- $seenRoutes := dict -}}
{{- range $routeIndex, $route := .Values.proxyConfig.proxyRoutes -}}
  {{- if or (empty $route.from) (empty $route.to) -}}
    {{- fail (printf "tiger-proxy proxyConfig.proxyRoutes[%d] requires non-empty from and to values" $routeIndex) -}}
  {{- end -}}
  {{- if hasKey $seenRoutes $route.from -}}
    {{- fail (printf "tiger-proxy proxyConfig.proxyRoutes contains duplicate route %q" $route.from) -}}
  {{- end -}}
  {{- $_ := set $seenRoutes $route.from true -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: tiger-proxy
  labels:
    {{- include "tiger-proxy.labels" . | nindent 4 }}
data:
  application.yaml: | 
    tigerProxy:
      proxyPort: {{ .Values.proxyConfig.proxyPort }}
      adminPort: {{ .Values.proxyConfig.adminPort }}
      proxyLogLevel: {{ .Values.proxyConfig.proxyLogLevel }}
      activateRbelParsing: {{ .Values.proxyConfig.activateRbelParsing }}
      activateWorkflowUi: true
      parsingShouldBlockCommunication: {{ .Values.proxyConfig.parsingShouldBlockCommunication }}
      stompClientBufferSizeInMb: {{ .Values.proxyConfig.stompClientBufferSizeInMb }}
      fileSaveInfo:
        writeToFile: {{ .Values.proxyConfig.fileSaveInfo.writeToFile }}
        fileName: {{ .Values.proxyConfig.fileSaveInfo.fileName }}
      proxyRoutes:
      {{- range $route := .Values.proxyConfig.proxyRoutes }}
      - from: {{ $route.from }}
        to: {{ $route.to }}{{ if $route.preserveHostHeader }}
        preserveHostHeader: {{ $route.preserveHostHeader }}{{ end }}
        {{- if hasKey $route "matchForProxyType" }}
        matchForProxyType: {{ $route.matchForProxyType }}
        {{- end }}
      {{- end }}
      {{- if .Values.global.enableDNSRedirect }}
        {{- range $redirect := $.Values.global.dns.redirects }}
          {{- range $redirectRoute := (default list $redirect.proxyRoutes) }}
      - from: {{ $redirectRoute.from }}
        to: {{ $redirectRoute.to }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- with .Values.proxyConfig.tls }}
      tls:
{{ toYaml . | indent 8 }}
      {{- end }}

  application.grpc.yaml: |
    tigerProxy:
      proxyPort: 14137
      adminPort: 19999
      proxyLogLevel: {{ .Values.proxyConfig.proxyLogLevel }}
      activateRbelParsing: {{ .Values.proxyConfig.activateRbelParsing }}
      parsingShouldBlockCommunication: {{ .Values.proxyConfig.parsingShouldBlockCommunication }}
      stompClientBufferSizeInMb: {{ .Values.proxyConfig.stompClientBufferSizeInMb }}
      {{- if .Values.proxyConfig.directReverseProxy }}
      directReverseProxy:
        hostname: {{ .Values.proxyConfig.directReverseProxy.hostname }}
        port: {{ .Values.proxyConfig.directReverseProxy.port }}
        ignoreConnectionErrors: {{ default false .Values.proxyConfig.directReverseProxy.ignoreConnectionErrors }}
      {{- end }}

  nginx.conf: |
    worker_processes auto;
    error_log  /dev/stdout warn;
    pid        /tmp/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;

      access_log  /dev/stdout;

      keepalive_timeout 65;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;

      server {
        listen 4138 http2;
        client_max_body_size {{ .Values.proxyConfig.otlpHttpClientMaxBodySize }};

        location / {
          proxy_pass http://127.0.0.1:{{ .Values.proxyConfig.proxyPort }}/telemetry/gateway/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
        }
      }
    }
    # stream {
    #   server {
    #     listen 4137;
    #     proxy_pass 127.0.0.1:14137;
    #   }
    # }
