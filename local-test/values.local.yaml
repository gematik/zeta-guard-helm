# Values for the umbrella chart (local environment with KIND)

global:
  registry_host: "europe-west3-docker.pkg.dev/gematik-pt-zeta-prod/zeta-dcr/"
  enableDNSRedirect: true
  clusterFQDN: zeta-kind.local

tags:
  testfachdienst: true
  tiger-proxy: true
  tiger-testsuite: true
  testdriver-smcb: true
  testdriver-oidc: true
  zeta-guard: true
  zeta-tls-test-tool-service: true

# Required by the Notification Service. gematik ships no image — build from
# github.com/gematik/push-gateway under global.registry_host as push-gateway:<tag>.
push-gateway:
  enabled: true
  devMode: true
  # Own Ingress so the NS reaches the Push Gateway via the public URL
  # /push-gateway; routeViaTigerProxy keeps the tiger-proxy -> push-gateway:8080 hop.
  ingressEnabled: true
  hostname: zeta-kind.local
  ingressClassName: nginx
  routeViaTigerProxy: true
  startupProbe:
    httpGet:
      path: /actuator/health/liveness
      port: management
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 60
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop: [ "ALL" ]
  postgres:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      runAsNonRoot: true
      runAsUser: 999
      capabilities:
        drop: [ "ALL" ]
  artemis:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop: [ "ALL" ]
  opentelemetry:
    enabled: true
    endpoint: http://telemetry-gateway-local:4318
    resourceAttributes:
      service.namespace: zeta-local
      service.version: latest

# SEK-IDP (gsi-server) + Fedmaster (gsi-fedmaster) from
# github.com/gematik/app-gemSekIdp. Build your own images under
# global.registry_host as gsi-server:<tag> / gsi-fedmaster:<tag>.
sekidp:
  enabled: true
  devMode: true
  ingressEnabled: true
  hostname: zeta-kind.local
  ingressClassName: nginx
  routeViaTigerProxy: true
  gsiServer:
    env:
      # Browser-resolvable Ingress URL, not the in-cluster Service name — baked
      # into gsi-server's signed entity statement and used as the auth redirect target.
      serverUrl: "https://zeta-kind.local/sekidp"
      # Browser-resolvable Fedmaster URL — must match fedmaster.env.serverUrl below.
      fedmasterUrl: "https://zeta-kind.local/sekidp-fedmaster"
    # GSI_FEDMASTER_MODE=local: authserver's PAR is validated against this
    # statement (redirect_uris: the demo callback below, see testdriver.oidcBaseUri.
    entityStatementAboutRp: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..fjzHCZGEf4AsCJxQMKcWNAWkOLqcZgmICG2MvnLvDuQ"
    additionalTrustedCAs:
      - secretName: zeta-guard-tls
        secretKey: ca.crt
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop: [ "ALL" ]
  fedmaster:
    env:
      # Externally-resolvable Ingress URL (/sekidp-fedmaster) — becomes the
      # iss claim in Fedmaster's entity statement, so it must match the URL
      # clients actually use to reach it.
      serverUrl: "https://zeta-kind.local/sekidp-fedmaster"
    additionalTrustedCAs:
      - secretName: zeta-guard-tls
        secretKey: ca.crt
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop: [ "ALL" ]

# MailCatcher — SMTP catch-all + web UI for test emails. Third-party image,
# verify/repoint before relying on it (see charts/mailcatcher/values.yaml).
mailcatcher:
  enabled: true
  devMode: true
  # Must match the tiger-proxy /mailcatcher route below — MailCatcher emits
  # <base href>/asset URLs relative to this prefix.
  httpPath: /mailcatcher
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop: [ "ALL" ]

zetaCertValidationMockEnabled: true

zeta-cert-validation-mock:
  devMode: true
  mock:
    mode: always_good
    enableAdminEndpoints: true
  opentelemetry:
    enabled: true
    endpoint: http://telemetry-gateway-local:4318
  service:
    type: NodePort
    nodePorts:
      http: 32013

hsmsim:
  enabled: true
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop: [ "ALL" ]

zetaTlsTestToolServiceEnabled: true

zeta-tls-test-tool-service:
  devMode: true
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop: [ "ALL" ]
  service:
    type: NodePort
    nodePorts:
      serviceMgmtNodePort: 32012

issuers:
  local:
    enabled: true
    issuerName: local-selfsigned
    certificateName: zeta-guard-local-tls
    secretName: zeta-guard-tls
    commonName: zeta-kind.local
    dnsNames:
      - zeta-kind.local
      - localhost
    duration: 8760h

popp-mocks:
  enabled: true
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop: [ "ALL" ]
  tokenGenerator:
    enabled: true
    ingress:
      enabled: true
      className: nginx
      hostname: zeta-kind.local

testdriverCommon: &localDriver
  aslProdEnv: false
  connector_base_url: ""
  connector_card_handle: ""
  connector_client_system_id: ""
  connector_mandant_id: ""
  connector_user_id: ""
  connector_workspace_id: ""
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop: [ "ALL" ]
  devMode: true
  disableServerValidation: true
  fachdienst_url: "https://zeta-kind.local/pep/"
  hostname: zeta-kind.local
  ingressClassName: nginx
  PoppToken: "eyJhbGciOiJFUzI1NiIsInR5cCI6InZuZC50ZWxlbWF0aWsucG9wcCtqd3QiLCJraWQiOiJhbGlhcyJ9..mVn6JqtEgrO-jlYeWWlNciTIMc2zPEBNi92s_2J8eAiOORw9H6MxWBP9_iTUEIGbKsHZtOaQDimMBGoA7dI9ow"
  routeViaTigerProxy: true
  requiredOid: "1.2.276.0.76.4.328"

testdriver-smcb:
  <<: *localDriver
  smcbCertificateFileName: smcb-certificates.p12
  smcbCertificateAlias: zeta.c_smcb_aut

nativedriver:
  <<: *localDriver
  smcbCertificateFileName: smcb-certificates.p12
  smcbCertificateAlias: zeta.c_smcb_aut

oidcSekIdp: &oidcSekIdp
  # Ingress URL (sekidp.gsiServer.env.serverUrl), so OIDC_IDP_ISS must match it.
  oidcIdpIss: "https://zeta-kind.local/sekidp"
  mailcatcherUrl: "https://zeta-kind.local/mailcatcher"

testdriver-oidc:
  <<: [*localDriver, *oidcSekIdp]
  enabled: true
  PoppToken: ""

testfachdienst:
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop: [ "ALL" ]
  devMode: true
  env:
    - name: SERVER_SSL_ENABLED
      value: "true"
  opentelemetry:
    enabled: true
    endpoint: http://telemetry-gateway-local:4318
    resourceAttributes:
      service.namespace: zeta-local
      service.version: 1.0.0
      deployment.environment.name: local

testMonitoringServiceEnabled: true

testMonitoringService:
  ingressRulesHost: "zeta-kind.local"
  opentelemetry-demo:
    jaeger:
      # Expose the query API through the host mapping in kind-local.yaml.
      extraObjects:
        - apiVersion: v1
          kind: Service
          metadata:
            name: jaeger-query-local
          spec:
            type: NodePort
            ports:
              - name: http-query
                port: 16686
                targetPort: 16686
                nodePort: 32086
            selector:
              app.kubernetes.io/name: jaeger
              app.kubernetes.io/instance: '{{ .Release.Name }}'
              app.kubernetes.io/component: all-in-one
    grafana:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
    opentelemetry-collector:
      fullnameOverride: test-monitoring-collector-local
    prometheus:
      server:
        clusterRoleNameOverride: prometheus-local
        service:
          type: NodePort
          nodePort: 32090
    opensearch:
      protocol: http   # optional, but matches the demo’s http endpoint
      httpPort: 9200
      opensearchJavaOpts: "-Xms512m -Xmx512m"
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 2Gi
      service:
        type: NodePort
        nodePort: 32098

tiger-proxy:
  registry_name: ""
  service:
    type: NodePort
    nodePorts:
      admin: 32097

tiger-testsuite:
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop: [ "ALL" ]
  devMode: true
  env:
    zetaBaseUrl: zeta-kind.local
    zetaProxyUrl: tiger-proxy:9999
    zetaProxy: proxy
    tigerEnvironment: cloud
    cucumberTags: ""
    mvnGoals: verify
    mvnAdditionalArgs: ""
    serenityExportDir: ""
  proxyAdminService:
    enabled: true
    type: NodePort
    nodePort: 32011
  service:
    enabled: true
    type: NodePort
    port: 9010
    nodePort: 32010
  workflowUi:
    activateWorkflowUi: true
    trafficVisualization: true
    startBrowser: false
    workflowUiPort: 9010
    workflowUiStartTimeoutInSeconds: 300
    enableTestSelection: true
    runTestsOnStart: false
    tigerProxyConfiguration:
      adminPort: 9011

zeta-guard:
  authserver:
    # Trust the local self-signed CA for outbound calls (e.g. sekidp-fedmaster).
    additionalTrustedCAs:
      - secretName: zeta-guard-tls
        secretKey: ca.crt
    probes:
      startup:
        failureThreshold: 60
    truststoreReload:
      enabled: false
    admin:
      username: admin
      password: local-dev-password
    config:
      maxClients: "5000"
      # Required by notificationService.enabled: true (see values.schema.json allOf).
      oidcFlowEnabled: true
      entityStatement:
        clientName: "zeta-guard"
        organizationName: "zeta-guard"
        contactEmail: "noreply@localhost"
    genesisHash: 4841c2142fef441daa6ee6c57db65c011935964b14e94a6c8f5ec0447b83526c
    hostname: zeta-kind.local
    hsm:
      enabled: true
      endpoint: "hsm-sim:50051"
      tls:
        enabled: true
        keyId: "zeta-guard-keycloak-tls-es256-v1.p256"
      tokenSigning:
        enabled: false
        keyId: "zeta-guard-keycloak-token-es256-v1.p256"
    imagePullPolicy: IfNotPresent
    log:
      level: "INFO,de.gematik.zeta.zetaguard:debug"
    provider:
      smcB:
        # opaBaseUrl value has to be aligned with tags.tiger-proxy state
        # see docs/How_to_configure_tiger-proxy.md for reference
        opaBaseUrl: "http://tiger-proxy/opa"
        # opaBaseUrl: "http://opa:8181"
    smcbHashingPepper: 085c1245-dc0d-4d39-95b4-97496bec6182
    tls:
      enabled: false
      certSecretName: zeta-guard-tls
  databaseMode: cloudnative
  devMode: true
  ingressClassName: nginx
  gematikConnectionEnabled: false
  nginx-ingress:
    # Fixed Service name so CoreDNS can resolve the ingress hostnames to it (make kind-dns)
    serviceNameOverride: nginx-ingress-controller
    controller:
      ingressClass:
        name: nginx
      service:
        type: NodePort
        externalTrafficPolicy: Local
        httpPort:
          port: 80
          nodePort: 32080
          targetPort: 80
        httpsPort:
          port: 443
          nodePort: 32443
          targetPort: 443
    enabled: true
  opa:
    bundle:
      enabled: false
      serviceName: gar
      url: https://europe-west3-docker.pkg.dev
      resource: "<PROJECT_ID>/opa-bundles/zeta-authz:latest"
      verification:
        enabled: false
        keyId: signer
    logLevel: info
    serviceAccountName: opa
    workloadIdentityFederation:
      enabled: false
      sts:
        sa: ""
  notificationService:
    enabled: true
    rs:
      mtls:
        # Local HTTP route via Tiger; no RS client-certificate authentication.
        enabled: false
    env:
      # Reach the Push Gateway via the public ingress /push-gateway (hops through
      # tiger-proxy -> push-gateway:8080), not the internal Service.
      pushGatewayAllowedBaseUrls:
        - "https://zeta-kind.local/push-gateway/push/v1/"
      channelsAllowed: "zeta"
    # Trust the self-signed local CA (issuers.local -> zeta-guard-tls) so the NS's
    # outbound HTTPS to https://zeta-kind.local/push-gateway validates.
    pushGateway:
      trustedCAs:
        - secretName: zeta-guard-tls
          secretKey: ca.crt
  provisioningProcessor:
    federationMaster:
      enabled: true
      environment: "test"
      devModeUrl: "https://zeta-kind.local/sekidp-fedmaster"
    schedule:
      enabled: false
    containerSecurityContext:
      readOnlyRootFilesystem: false
  pepproxy:
    replicaCount: 1
    aslOcsp: "http://zeta-cert-validation-mock/ocsp/asl"
    asl_enabled: false
    hsmProxyAddr: "http://hsm-sim:50051"
    # hsm-sim serves plain-text gRPC only
    hsmProxyPlainTextAccepted: true
    nginxConf:
      # Discovery and JWKS via the cluster-internal authserver (no ingress TLS/DNS).
      pepInternalUrl: "http://authserver/auth/realms/zeta-guard"
      generateConfigMap: true
      pepIssuer: https://zeta-kind.local/auth/realms/zeta-guard
      requiredAudience: https://zeta-kind.local
    wellKnownBase: https://zeta-kind.local
  routeViaTigerProxy: true
  telemetryGatewayEnabled: true
  telemetry-gateway:
    command:
      name: /otelcol/zeta-telemetry-gateway
    fullnameOverride: telemetry-gateway-local
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ "ALL" ]
    config:
      processors:
        batch:
          timeout: 60s
          send_batch_size: 1
      exporters:
        otlp_http/tms_dienst_hersteller:
          endpoint: http://test-monitoring-collector-local:4328
          encoding: json
          tls:
            insecure: true
        otlp_http/tms_ti_sim:
          endpoint: http://test-monitoring-collector-local:4338
          encoding: json
          tls:
            insecure: true
        otlp_http/tms_ti_siem:
          endpoint: http://test-monitoring-collector-local:4348
          encoding: json
          tls:
            insecure: true
      service:
        extensions:
          - file_storage
          - health_check
        pipelines:
          logs/dienst_hersteller:
            exporters:
              - otlp_http/tms_dienst_hersteller

          logs/ti_sim:
            exporters:
              - otlp_http/tms_ti_sim

          logs/ti_siem:
            exporters:
              - count/security_kpis
              - otlp_http/tms_ti_siem

          metrics/dienst_hersteller:
            exporters:
              - otlp_http/tms_dienst_hersteller

          metrics/ti_sim:
            exporters:
              - otlp_http/tms_ti_sim

          metrics/ti_siem:
            exporters:
              - otlp_http/tms_ti_siem

          traces/dienst_hersteller:
            exporters:
              - otlp_http/tms_dienst_hersteller
              # keep the base chart spanmetrics connector wired because exporter lists replace chart defaults
              - spanmetrics

          traces/ti_sim:
            exporters:
              - otlp_http/tms_ti_sim

          traces/ti_siem:
            exporters:
              - count/security_kpis
              - otlp_http/tms_ti_siem
    # The root values.yaml zeroes extraVolumeMounts/extraVolumes for
    # telemetry-gateway (Helm lists replace, not merge), which silently drops
    # the file-storage mount too, leaving the PVC that
    # zeta-guard/templates/telemetry-gateway/telemetry-gateway-file-storage-pvc.yaml
    # renders unbound forever — redeclared here.
    extraVolumeMounts:
      - name: file-storage
        mountPath: /var/lib/storage/otc
    extraVolumes:
      - name: file-storage
        persistentVolumeClaim:
          claimName: '{{ include "opentelemetry-collector.fullname" . }}-file-storage'
