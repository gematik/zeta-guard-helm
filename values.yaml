# Minimal defaults to support helm lint without env-specific files


# Global defaults used by subcharts; keep safe empties
global:
  imagePullSecrets: []
  enableDNSRedirect: false
  # Istio PeerAuthentication resources
  istio:
    enabled: false
  dns:
    tigerStaticClusterIP: "10.96.3.11"
    redirects:
      - fqdn: ehca.gematik.de
        proxyRoutes: []
      - fqdn: cert-mock.zeta.test
        proxyRoutes: []
      - fqdn: ocsp-testref.root-ca.ti-dienste.de
        proxyRoutes: []
  infinispanExternal:
    enabled: false
    replicaCount: 3
    image:
      repository: infinispan-zeta
      tag: "15.2"
    imagePullPolicy: Always
    imagePullSecrets: [ ]
    serviceAccount:
      create: true
      name: infinispan
    resources: {}
    podDisruptionBudget:
      enabled: false
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      runAsNonRoot: true
      capabilities:
        drop: [ "ALL" ]
    extraJavaOptions: ""
    remote:
      host:
      port:
    admin:
      username: "please set me"
      password: "please set me"
      secretName:
    hsm:
      enabled: false
      endpoint: ""  # gRPC address of the HSM Proxy, e.g. "hsm-sim:50051"
      keyId: ""  # TLS key ID in the HSM, e.g. "zeta-guard-infinispan-tls-es256-v1.p256"
      caCert: |
        -----BEGIN CERTIFICATE-----
        -----END CERTIFICATE-----
    config: |-
      <infinispan xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="urn:infinispan:config:15.0 https://infinispan.org/schemas/infinispan-config-15.0.xsd
                            urn:infinispan:server:15.0 https://infinispan.org/schemas/infinispan-server-15.0.xsd" xmlns="urn:infinispan:config:15.0" xmlns:server="urn:infinispan:server:15.0">
        <cache-container name="default" statistics="true">
            <transport cluster="${infinispan.cluster.name:cluster}" stack="${infinispan.cluster.stack:tcp}" node-name="${infinispan.node.name:}" />
            <security>
                <authorization />
            </security>
        </cache-container>
        <server xmlns="urn:infinispan:server:15.0">
            <interfaces>
                <interface name="public">
                    <inet-address value="${infinispan.bind.address:127.0.0.1}" />
                </interface>
            </interfaces>
            <socket-bindings default-interface="public" port-offset="${infinispan.socket.binding.port-offset:0}">
                <socket-binding name="default" port="${infinispan.bind.port:11222}" />
            </socket-bindings>
            <security>
                <security-realms>
                    <security-realm name="default">
                    {{- if .Values.global.infinispanExternal.hsm.enabled }}
                      <server-identities>
                        <ssl>
                          <keystore
                            type="HSMPROXY"
                            provider="HSMPROXY"
                            password=""
                            alias="tls"/>
                        </ssl>
                      </server-identities>
                    {{- end }}
                      <properties-realm />
                    </security-realm>
                    {{- if .Values.global.infinispanExternal.hsm.enabled }}
                    <security-realm name="cluster-transport">
                      <server-identities>
                        <ssl>
                          <keystore
                            type="HSMPROXY"
                            provider="HSMPROXY"
                            password=""
                            alias="tls"/>
                          <truststore path="${env.HSM_TRUSTSTORE_PATH}" password="" />
                        </ssl>
                      </server-identities>
                    </security-realm>
                    {{- end }}
                </security-realms>
            </security>
            <endpoints socket-binding="default" security-realm="default" />
        </server>
        <cache-container name="keycloak">
            <replicated-cache name="work" statistics="true">
                <encoding media-type="application/x-protostream" />
            </replicated-cache>
            <distributed-cache name="sessions" statistics="true">
                <encoding media-type="application/x-protostream" />
            </distributed-cache>
            <distributed-cache name="authenticationSessions" statistics="true">
                <encoding media-type="application/x-protostream" />
            </distributed-cache>
            <distributed-cache name="clientSessions" statistics="true">
                <encoding media-type="application/x-protostream" />
            </distributed-cache>
            <distributed-cache name="offlineSessions" statistics="true">
                <encoding media-type="application/x-protostream" />
            </distributed-cache>
            <distributed-cache name="offlineClientSessions" statistics="true">
                <encoding media-type="application/x-protostream" />
            </distributed-cache>
            <distributed-cache name="actionTokens" statistics="true">
                <encoding media-type="application/x-protostream" />
            </distributed-cache>
            <distributed-cache name="loginFailures" statistics="true">
                <encoding media-type="application/x-protostream" />
            </distributed-cache>
            <!--
              Session revocation block list (REVOCATION_CACHE in the zeta-guard-revocation
              provider). Replicated so a block reaches every node, including those holding
              PEP subscriptions. Entries carry their own lifespan, so no expiration or
              eviction here: dropping a block would silently un-revoke a session.
              Unlike embedded mode, the provider cannot create this itself — it probes the
              cache at startup and refuses to boot without it.
            -->
            <replicated-cache name="zetaGuardRevocations" statistics="true">
                <encoding media-type="application/x-protostream" />
            </replicated-cache>
            {{- if .Values.global.infinispanExternal.hsm.enabled }}
            <transport server:security-realm="cluster-transport"/>
            {{- end }}
        </cache-container>
      </infinispan>

# Keep tags empty by default; env files can enable as needed
tags: { }

zetaTlsTestToolServiceEnabled: false

zeta-tls-test-tool-service: { }

zetaCertValidationMockEnabled: false

zeta-cert-validation-mock: { }

hsmsim:
  enabled: false

# Safe defaults for cert-manager issuers to avoid nil pointer lookups
issuers:
  local:
    enabled: false
    issuerName: local-selfsigned
    certificateName: zeta-guard-local-tls
    secretName: zeta-guard-tls
    commonName: ""
    dnsNames: [ ]
    duration: 8760h

popp-mocks:
  enabled: false
  # Needed when poppIssuer points to popp-statics (JWKS), or adjust /popp target + poppIssuer to your JWKS endpoint.

push-gateway:
  enabled: false

sekidp:
  enabled: false

mailcatcher:
  enabled: false

testdriver-smcb:
  enabled: true
  # Static PoPP token for the SMC-B test drivers. It is the same on every
  # stage, so it lives here and is rotated in one place (testdriver and
  # nativedriver below); stage files do not set it.
  # actorId: X110411675!
  # $ curl -k -X 'POST' 'https://$zetaFqdn/popp-token-generator/popp/test/api/v1/token-generator' -H 'accept: */*' -H 'Content-Type: application/json' -d '{
  #   "tokenParamsList": [
  #     {
  #       "proofMethod": "ehc-practitioner-user-x509",
  #       "patientProofTime": "1791553843",
  #       "iat": "1791553843",
  #       "patientId": "X110411675",
  #       "insurerId": "109500969",
  #       "actorId": "X110411675",
  #       "actorProfessionOid": "1.2.276.0.76.4.32"
  #     }
  #   ]
  # }' | jq
  PoppToken: "..cW8css1KHgx9jxySuGoTtSz10wROm_aQRiRao21UTgh_mYlfoxTg7DMH7hchjaMSVWPjL76teYZxjakjnx20uw"
  serviceAccount:
    create: true
    name: testdriver-smcb
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

testdriver-oidc:
  enabled: false
  serviceAccount:
    create: true
    name: testdriver-oidc
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

nativedriver:
  PoppToken: "..cW8css1KHgx9jxySuGoTtSz10wROm_aQRiRao21UTgh_mYlfoxTg7DMH7hchjaMSVWPjL76teYZxjakjnx20uw"
  serviceAccount:
    create: true
    name: nativedriver
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

androidDriverEnabled: false

androiddriver:
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

testfachdienst:
  # notificationServiceRsBaseUrl value has to be aligned with tags.tiger-proxy state
  # see docs/how-to_guides/How_to_configure_tiger-proxy.md for reference
  notificationServiceRsBaseUrl: "http://tiger-proxy/notification-service-rs"
  # notificationServiceRsBaseUrl: "http://notification-service-rs:8080"

# Shared TIGER proxy configuration. Stage files only override genuinely
# stage-specific settings such as image pins, NodePorts, or additional routes.
tiger-proxy:
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop: [ "ALL" ]
  devMode: true
  proxyConfig:
    tls:
      domainName: tiger-proxy

# If testMonitoringServiceEnabled is true, observability backends are added to the deployment.
testMonitoringServiceEnabled: false

testMonitoringService:
  # The OpenTelemetry demo is not configured for production use. You need to
  # adjust resource requests and limits of Grafana and Prometheus for long-term
  # use.
  opentelemetry-demo:
    grafana:
      rbac:
        namespaced: true
    jaeger:
      jaeger:
        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            memory: 2Gi
        livenessProbe:
          failureThreshold: 6
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
        readinessProbe:
          failureThreshold: 6
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        startupProbe:
          failureThreshold: 30
          periodSeconds: 10
          timeoutSeconds: 5
    opentelemetry-collector:
      resources:
        requests:
          memory: 512Mi
        limits:
          memory: 2Gi
      config:
        exporters:
          otlphttp/prometheus:
            endpoint: http://prometheus:9090/api/v1/otlp
        service:
          pipelines:
            # These three (logs/metrics/traces, bare) are the upstream
            # opentelemetry-demo chart's own default pipelines, wired for
            # the demo app's built-in receivers — nothing we run actually
            # feeds them (every demo component that would is disabled;
            # frontend-proxy, the one we keep, doesn't send telemetry here).
            # Tried nulling them out entirely, but the chart's own
            # applyAnnotationDiscoveryConfig template unconditionally reads
            # `.service.pipelines.metrics`/`.logs` as maps regardless of
            # whether we use them, so removing the keys crashes template
            # rendering itself, earlier than the collector's own config
            # validation. So they stay, patched instead:
            traces:
              exporters:
                - otlp_grpc/jaeger
                - spanmetrics
            metrics:
              receivers:
                - otlp
                - kafkametrics
                - spanmetrics
                - prometheus/ad
                - receiver_creator/metrics
                - hostmetrics
                - kubeletstats
                - k8s_cluster
              exporters:
                - otlphttp/prometheus
            logs:
              exporters:
                - opensearch
    prometheus:
      server:
        # Environments should override baseURL with their public host.
        extraFlags:
          - web.enable-otlp-receiver
        resources:
          requests:
            # should be 1.5x of Prometheus' `storage.local.target-heap-size` (default 2GiB)
            memory: 3Gi
          limits:
            memory: 6Gi

zeta-guard:
  nginx-ingress:
    controller:
      image:
        pullPolicy: Always
  authserver:
    config:
      # optimised TTLs for nightly load tests, so we start with a clean DB each time
      userIdleTTL: "PT22H"
      clientIdleTTL: "PT22H"
    container:
      resources:
        limits:
          memory: "4Gi"
        requests:
          cpu: "1"
          memory: "3Gi"
  authServerLogConsoleOutput: default
  authServerMetricsEnabled: true
  authServerTracingEnabled: true
  cloudnativePg:
    imageName: ghcr.io/cloudnative-pg/postgresql:17.11-standard-trixie
    resources:
      requests:
        cpu: "1"
        memory: 1Gi
      limits:
        # No cpu limit: avoids CFS throttling; cpu.request is the floor, DB can burst.
        memory: 2Gi
    # with single instance DBs, PDB would block any node drain/upgrade as it is minAvailable=1
    enablePDB: false
  # Mirror of cloudnativePg above, for the keycloak-db.enabled=true upstream-chart path.
  # keycloak-db.cluster.* is a separate values path — it does NOT inherit cloudnativePg.*
  # (see charts/zeta-guard/values.yaml) — so a stage that flips keycloak-db.enabled: true
  # without these would silently get the upstream chart's own defaults (different image,
  # no resource limits, enablePDB back to true) instead of what this file already declares
  # for cloudnativePg. Keep in sync with the cloudnativePg block above.
  keycloak-db:
    cluster:
      imageName: ghcr.io/cloudnative-pg/postgresql:17.11-standard-trixie
      enablePDB: false
      resources:
        requests:
          cpu: "1"
          memory: 1Gi
        limits:
          memory: 2Gi
      postgresql:
        parameters:
          wal_compression: "on"
  notificationService:
    db:
      cloudnativePg:
        # Same image as keycloak-db above; the subchart default points at the gematik mirror
        imageName: ghcr.io/cloudnative-pg/postgresql:17.11-standard-trixie
        enablePDB: false
    sealing:
      keychainGenerator:
        image:
          # Path in our registry; the subchart default is the gematik name,
          # notification-keychain-generator (see private/renderImageNames.sh).
          repository: notification-service/keychain-generator
  gematikConnectionEnabled: false
  # Name of the Kubernetes Secret containing the gematik certificate chain for
  # verifying the cosign signature of the provisioning data image. The Secret
  # must have a key 'certchain.pem' holding a PEM-encoded X.509 certificate
  # chain (CA and intermediate certs, no leaf cert). Required — the Helm chart
  # fails without this value.
  # See: Referenz_des_Helm_Charts.md#cosign-vertrauenskette-für-image-verifikation
  imageTrustCertchainSecretRef: gematik-image-signer-test
  ingressMinionAnnotations:
    # turning off rate limit to enable load tests
    nginx.org/limit-req-rate: null
    nginx.org/limit-req-key: null
    nginx.org/limit-req-zone-size: null
  opa:
    image:
      registry: docker.io/
      repository: openpolicyagent/opa
  opaDistributedTracingEnabled: true
  opaStatusPrometheus: false
  openshiftRoute:
    enabled: false
  provisioningProcessor:
    containerSecurityContext:
      readOnlyRootFilesystem: true
  pepproxy:
    nginxConf:
      # the main image knows pep_pdp_url; stages pinning a released PEP set this to ""
      pepInternalUrl: "http://authserver/auth/realms/zeta-guard"
      configMapName: pep-test-nginx-conf

      # fachdienstUrl value has to be aligned with tags.tiger-proxy state
      # see docs/how-to_guides/How_to_configure_tiger-proxy.md for reference
      fachdienstUrl: "https://tiger-proxy:80/testfachdienst"
      # fachdienstUrl: "https://testfachdienst:443"

      httpClientAcceptInvalidCerts: true
      aslTestmode: true

      # poppIssuer value has to be aligned with tags.tiger-proxy state
      # see docs/how-to_guides/How_to_configure_tiger-proxy.md for reference
      poppIssuer: "http://tiger-proxy/popp"
      # poppIssuer: http://popp-statics

      locations: |-
        {{- $fd := .Values.pepproxy.nginxConf.fachdienstUrl -}}
        location /achelos_testfachdienst/ws/ {
            include proxy_headers.conf;
            proxy_pass {{ $fd }}/achelos_testfachdienst/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        }
        location /achelos_testfachdienst/ws {
            include proxy_headers.conf;
            proxy_pass {{ $fd }}/achelos_testfachdienst/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        }
        location /pep/ {
            # inherits proxy_headers.conf from the server block
            proxy_pass {{ $fd }}/;
            proxy_ssl_verify off;

            {{- if .Values.openshiftIngress.enabled }}
            # declares its own proxy_set_header (cookie strip) and therefore does NOT inherit
            # the server-level proxy_headers.conf (non-additive) — re-include it here
            include proxy_headers.conf;
            proxy_set_header Cookie ""; # do not pass OpenShift-session-cookies
            {{- end }}
        }
        location /pep/achelos_testfachdienst/ws/ {
            include proxy_headers.conf;
            proxy_pass {{ $fd }}/achelos_testfachdienst/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

            # SECURITY WARNING: This will make this location public and it can be called without the ASL protocol.
            # This is ok and desired for this test setup.
            # If you want to copy this behaviour, make sure this is permitted by the spec of your resource server.
            satisfy all;
            allow all;
        }
        location /pep/achelos_testfachdienst/ws {
            include proxy_headers.conf;
            proxy_pass {{ $fd }}/achelos_testfachdienst/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

            # SECURITY WARNING: This will make this location public and it can be called without the ASL protocol.
            # This is ok and desired for this test setup.
            # If you want to copy this behaviour, make sure this is permitted by the spec of your resource server.
            satisfy all;
            allow all;
        }
        location /pep/achelos_testfachdienst/hellozeta/popp {
            # inherits proxy_headers.conf from the server block
            proxy_pass {{ $fd }}/achelos_testfachdienst/hellozeta/popp;
            proxy_ssl_verify off;

            {{- if .Values.openshiftIngress.enabled }}
            # declares its own proxy_set_header (cookie strip) and therefore does NOT inherit
            # the server-level proxy_headers.conf (non-additive) — re-include it here
            include proxy_headers.conf;
            proxy_set_header Cookie ""; # do not pass OpenShift-session-cookies
            {{- end }}
        }

        # routes with popp verification explicitly disabled
        location /pep/achelos_testfachdienst/no-popp {
            # inherits proxy_headers.conf from the server block
            proxy_pass {{ $fd }}/achelos_testfachdienst/no-popp;
            proxy_ssl_verify off;
            
            pep_require_popp off;

            {{- if .Values.openshiftIngress.enabled }}
            # declares its own proxy_set_header (cookie strip) and therefore does NOT inherit
            # the server-level proxy_headers.conf (non-additive) — re-include it here
            include proxy_headers.conf;
            proxy_set_header Cookie ""; # do not pass OpenShift-session-cookies
            {{- end }}
        }
        location /pep/achelos_testfachdienst/no-popp/ {
            # inherits proxy_headers.conf from the server block
            proxy_pass {{ $fd }}/achelos_testfachdienst/no-popp/;
            proxy_ssl_verify off;

            pep_require_popp off;

            {{- if .Values.openshiftIngress.enabled }}
            # declares its own proxy_set_header (cookie strip) and therefore does NOT inherit
            # the server-level proxy_headers.conf (non-additive) — re-include it here
            include proxy_headers.conf;
            proxy_set_header Cookie ""; # do not pass OpenShift-session-cookies
            {{- end }}
        }
        location /pep/achelos_testfachdienst/no-popp/ws/ {
            include proxy_headers.conf;
            proxy_pass {{ $fd }}/achelos_testfachdienst/no-popp/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

            pep_require_popp off;

            # SECURITY WARNING: This will make this location public and it can be called without the ASL protocol.
            # This is ok and desired for this test setup.
            # If you want to copy this behaviour, make sure this is permitted by the spec of your resource server.
            satisfy all;
            allow all;
        }
        location /pep/achelos_testfachdienst/no-popp/ws {
            include proxy_headers.conf;
            proxy_pass {{ $fd }}/achelos_testfachdienst/no-popp/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

            pep_require_popp off;

            # SECURITY WARNING: This will make this location public and it can be called without the ASL protocol.
            # This is ok and desired for this test setup.
            # If you want to copy this behaviour, make sure this is permitted by the spec of your resource server.
            satisfy all;
            allow all;
        }

        # keep old routing during migration for test tool compatibility
        location /pep/achelos_testfachdienst/hellozeta/no-popp {
            # inherits proxy_headers.conf from the server block
            proxy_pass {{ $fd }}/achelos_testfachdienst/hellozeta/no-popp;
            proxy_ssl_verify off;

            pep_require_popp off;

            {{- if .Values.openshiftIngress.enabled }}
            # declares its own proxy_set_header (cookie strip) and therefore does NOT inherit
            # the server-level proxy_headers.conf (non-additive) — re-include it here
            include proxy_headers.conf;
            proxy_set_header Cookie ""; # do not pass OpenShift-session-cookies
            {{- end }}
        }
        location /pep/achelos_testfachdienst/ws-no-popp/ {
            include proxy_headers.conf;
            proxy_pass {{ $fd }}/achelos_testfachdienst/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

            pep_require_popp off;

            # SECURITY WARNING: This will make this location public and it can be called without the ASL protocol.
            # This is ok and desired for this test setup.
            # If you want to copy this behaviour, make sure this is permitted by the spec of your resource server.
            satisfy all;
            allow all;
        }
        location /pep/achelos_testfachdienst/ws-no-popp {
            include proxy_headers.conf;
            proxy_pass {{ $fd }}/achelos_testfachdienst/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

            pep_require_popp off;

            # SECURITY WARNING: This will make this location public and it can be called without the ASL protocol.
            # This is ok and desired for this test setup.
            # If you want to copy this behaviour, make sure this is permitted by the spec of your resource server.
            satisfy all;
            allow all;
        }
    resources:
      limits:
        memory: "1Gi"
      requests:
        cpu: "1"
        memory: "500Mi"
  pepproxyMetricsEnabled: true
  pepproxyTracingEnabled: true

  telemetryGatewayEnabled: true
  telemetry-gateway:
    config:
      service:
        extensions:
          - health_check
        pipelines:
          logs/dienst_hersteller:
            exporters:
              - debug
          logs/ti_sim:
            exporters:
              - debug
          logs/ti_siem:
            exporters:
              - count/security_kpis
              - debug
          metrics/dienst_hersteller:
            exporters:
              - debug
          # ADR 0001 (docs/adr/0001-reliable-daily-metrics.md): this is the
          # one place the corrected KPI value actually reaches TI-SIEM
          # (otlp_grpc/ti_siem in the base chart) — drop it for testing
          # stages same as every other *_ti_siem pipeline below.
          metrics/security_kpis_corrected:
            exporters:
              - debug
          metrics/ti_sim:
            exporters:
              - debug
          metrics/ti_siem:
            exporters:
              - debug
          traces/dienst_hersteller:
            exporters:
              - debug
              - spanmetrics
          traces/ti_sim:
            exporters:
              - debug
          traces/ti_siem:
            exporters:
              - count/security_kpis
              - debug
    extraVolumeMounts: [ ]
    extraVolumes: [ ]

smcb_keystore:
  keystore: "please set me"
  password: "please set me"

lgtm:
  storageClassName: managed-csi-premium
